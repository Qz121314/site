<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f5f6f7" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      html,
      body {
        margin: 0;
        background: var(--page-bg, #f5f6f7);
      }

      body {
        min-width: 320px;
        overflow-x: hidden;
      }

      .boot-shell {
        --boot-header-height: calc(58px + env(safe-area-inset-top));
        --boot-bottom-height: calc(66px + env(safe-area-inset-bottom));
        min-height: 100dvh;
        overflow: hidden;
        background: var(--page-bg, #f5f6f7);
      }

      .boot-shell,
      .boot-shell * {
        box-sizing: border-box;
      }

      .boot-app-bar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 2;
        display: grid;
        height: var(--boot-header-height);
        place-items: center;
        padding-top: env(safe-area-inset-top);
        border-bottom: 1px solid var(--line, #e7e9ec);
        background: var(--surface, #fff);
      }

      .boot-brand,
      .boot-loading-line,
      .boot-loading-panel {
        display: block;
        background: var(--surface-soft, #eef0f2);
      }

      .boot-brand {
        width: min(44vw, 148px);
        height: 34px;
        border-radius: 4px;
      }

      .boot-main {
        width: min(1200px, 100%);
        min-height: calc(100dvh - var(--boot-header-height));
        margin: 0 auto;
        padding-top: calc(var(--boot-header-height) + 10px);
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: calc(var(--boot-bottom-height) + 30px);
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .boot-loading-panel {
        width: min(520px, 100%);
        height: 132px;
        margin: clamp(42px, 14vh, 132px) auto 0;
        border: 1px solid var(--line, #e7e9ec);
        border-radius: 16px;
        opacity: 0.72;
      }

      .boot-loading-line {
        width: min(48%, 180px);
        height: 12px;
        margin: 22px auto 0;
        border-radius: 999px;
        opacity: 0.72;
      }

      @media (min-width: 768px) {
        .boot-main {
          padding-top: calc(var(--boot-header-height) + 25px);
          padding-right: max(24px, env(safe-area-inset-right));
          padding-left: max(24px, env(safe-area-inset-left));
        }
      }

      @media (min-width: 980px) {
        .boot-shell {
          --boot-header-height: 62px;
          --boot-bottom-height: 0px;
        }

        .boot-main {
          padding-bottom: 58px;
        }
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/api/public/pwa/icon/192" />
    <link rel="apple-touch-icon" href="/api/public/pwa/icon/192" />
    <title>Service Catalog</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <header class="boot-app-bar"><span class="boot-brand"></span></header>
        <main class="boot-main">
          <div class="boot-loading-panel"><span class="boot-loading-line"></span></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
