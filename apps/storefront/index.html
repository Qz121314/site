<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f5f6f7" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      html,
      body {
        margin: 0;
        background: var(--page-bg, #f5f6f7);
      }

      body {
        min-width: 320px;
        overflow-x: hidden;
      }

      .boot-shell {
        --boot-header-height: calc(58px + env(safe-area-inset-top));
        --boot-bottom-height: calc(66px + env(safe-area-inset-bottom));
        min-height: 100dvh;
        overflow: hidden;
        background: var(--page-bg, #f5f6f7);
      }

      .boot-shell,
      .boot-shell * {
        box-sizing: border-box;
      }

      .boot-app-bar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 2;
        display: grid;
        height: var(--boot-header-height);
        place-items: center;
        padding-top: env(safe-area-inset-top);
        border-bottom: 1px solid var(--line, #e7e9ec);
        background: var(--surface, #fff);
      }

      .boot-brand,
      .boot-hero,
      .boot-shortcuts i,
      .boot-shortcuts b,
      .boot-section-heading span,
      .boot-section-heading i,
      .boot-product-grid span,
      .boot-bottom-nav span {
        display: block;
        background: var(--surface-soft, #eef0f2);
      }

      .boot-brand {
        width: min(44vw, 148px);
        height: 34px;
        border-radius: 4px;
      }

      .boot-main {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding-top: calc(var(--boot-header-height) + 10px);
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: calc(var(--boot-bottom-height) + 30px);
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .boot-hero {
        height: clamp(300px, 52svh, 440px);
        margin-right: -16px;
        margin-left: -16px;
      }

      .boot-shortcuts {
        display: flex;
        gap: 15px;
        padding: 16px 2px 28px;
        overflow: hidden;
      }

      .boot-shortcuts span {
        display: grid;
        width: 66px;
        min-width: 66px;
        justify-items: center;
        gap: 8px;
      }

      .boot-shortcuts i {
        width: 58px;
        height: 58px;
        border-radius: 14px;
      }

      .boot-shortcuts b {
        width: 42px;
        height: 8px;
        border-radius: 4px;
      }

      .boot-section-heading {
        display: flex;
        min-height: 42px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line, #e7e9ec);
      }

      .boot-section-heading span {
        width: min(42vw, 164px);
        height: 20px;
        border-radius: 7px;
      }

      .boot-section-heading i {
        width: 20px;
        height: 20px;
        border-radius: 7px;
      }

      .boot-product-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 12px;
      }

      .boot-product-grid span {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
      }

      .boot-bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        height: var(--boot-bottom-height);
        align-items: start;
        padding: 9px 20px env(safe-area-inset-bottom);
        border-top: 1px solid var(--line, #e7e9ec);
        background: var(--surface, #fff);
      }

      .boot-bottom-nav span {
        width: 28px;
        height: 28px;
        justify-self: center;
        border-radius: 10px;
      }

      @media (max-width: 767px) {
        .boot-shortcuts {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 14px 8px;
          padding: 14px 0 24px;
          overflow: visible;
        }

        .boot-shortcuts span {
          width: 100%;
          min-width: 0;
          min-height: 80px;
          gap: 6px;
        }

        .boot-shortcuts i {
          width: 54px;
          height: 54px;
        }
      }

      @media (min-width: 768px) {
        .boot-main {
          padding-top: calc(var(--boot-header-height) + 25px);
          padding-right: max(24px, env(safe-area-inset-right));
          padding-left: max(24px, env(safe-area-inset-left));
        }

        .boot-hero {
          height: min(440px, 39vw);
          min-height: 360px;
          margin: 0;
          border-radius: 18px;
        }

        .boot-shortcuts {
          gap: 23px;
          padding: 26px 2px 32px;
        }
      }

      @media (min-width: 980px) {
        .boot-shell {
          --boot-header-height: 62px;
          --boot-bottom-height: 0px;
        }

        .boot-main {
          padding-bottom: 58px;
        }

        .boot-bottom-nav {
          display: none;
        }
      }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/api/public/pwa/icon/192" />
    <link rel="apple-touch-icon" href="/api/public/pwa/icon/192" />
    <title>Service Catalog</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <header class="boot-app-bar"><span class="boot-brand"></span></header>
        <main class="boot-main">
          <div class="boot-hero"></div>
          <div class="boot-shortcuts">
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
            <span><i></i><b></b></span>
          </div>
          <div class="boot-section-heading"><span></span><i></i></div>
          <div class="boot-product-grid"><span></span><span></span></div>
        </main>
        <nav class="boot-bottom-nav">
          <span></span><span></span><span></span><span></span>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
