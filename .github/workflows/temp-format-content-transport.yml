name: Temp Content Transport Format

on:
  push:
    branches:
      - agent/storefront-bootstrap-navigation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-navigation
      - name: Format content transport
        run: |
          npm install --global prettier@3.9.6
          prettier --write apps/storefront/src/content.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/content.ts
          git commit -m "Format storefront content transport"
          git push origin HEAD:agent/storefront-bootstrap-navigation
