name: Apply Product Detail Request Budget

on:
  push:
    branches:
      - perf/product-detail-request-budget
    paths:
      - 'scripts/apply-product-detail-request-budget.mjs'
      - '.github/workflows/apply-product-detail-request-budget.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/product-detail-request-budget
      - name: Apply exact source patch
        run: node scripts/apply-product-detail-request-budget.mjs
      - name: Commit patched sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/storefront/src/StorefrontRoot.tsx apps/storefront/src/ProductDetailPage.tsx apps/storefront/src/content.ts
          git commit -m 'perf: bound product detail request fan-out'
          git push origin HEAD:perf/product-detail-request-budget
