name: Article C0 Weak Reference Cleanup

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-weak-reference-cleanup.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove redundant C0 counting wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/assets/asset-library.ts')
          source = path.read_text()
          helper = """function countRowReferences(row: MediaAssetReferenceRow | null): number {\n  return countReferences(toReferenceCounts(row));\n}\n\n"""
          if source.count(helper) != 1:
              raise SystemExit(f'expected one countRowReferences helper, found {source.count(helper)}')
          source = source.replace(helper, '', 1)
          if source.count('countRowReferences(row)') != 5:
              raise SystemExit(f'expected five wrapper usages, found {source.count("countRowReferences(row)")}')
          source = source.replace('countRowReferences(row)', 'countReferences(toReferenceCounts(row))')
          path.write_text(source)
          PY
      - name: Run changed-file fixer
        run: pnpm fix:changed
      - name: Run formatting check
        run: pnpm format
      - name: Run targeted weak-reference contract
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/message-article-background-contract.test.mjs \
            apps/worker/test/article-message-contract.test.mjs
      - name: Run full repository verify
        run: pnpm verify
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/assets/asset-library.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(content): remove redundant article background counting wrapper"
          git push origin HEAD:feat/message-article-background-media-contract
