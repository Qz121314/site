name: Temp Fix Legacy Product Routing

on:
  push:
    branches:
      - agent/product-detail-summary-reuse

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-detail-summary-reuse
      - name: Preserve legacy product lookup semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/storefront/src/content.ts')
          source = path.read_text()
          old = """  } else {
    const rememberedMatches = Object.values(bootstrap.productSummaries).filter(
      (product) => product.id === productRef || product.slug === productRef,
    );
    if (rememberedMatches.length === 1) {
      matchedProduct = rememberedMatches[0] ?? null;
      section = matchedProduct
        ? (bootstrap.home.allSections.find(
            (item) => item.id === matchedProduct?.sectionId,
          ) ?? null)
        : null;
    } else {
      const snapshots = await Promise.all(
        bootstrap.home.allSections.map((item) =>
          loadSectionSnapshot(bootstrap, item.id, signal),
        ),
      );
      matchedProduct = findPublishedProduct(
        snapshots.flatMap((snapshot) => snapshot.products),
        productRef,
      );
      if (matchedProduct) {
        section =
          bootstrap.home.allSections.find(
            (item) => item.id === matchedProduct?.sectionId,
          ) ?? null;
      }
    }
  }
"""
          new = """  } else {
    // Legacy product URLs do not carry section context. Product slugs are only
    // unique within a section, so a partial in-memory summary set cannot prove
    // global uniqueness safely. Preserve the authoritative all-section lookup.
    const snapshots = await Promise.all(
      bootstrap.home.allSections.map((item) =>
        loadSectionSnapshot(bootstrap, item.id, signal),
      ),
    );
    matchedProduct = findPublishedProduct(
      snapshots.flatMap((snapshot) => snapshot.products),
      productRef,
    );
    if (matchedProduct) {
      section =
        bootstrap.home.allSections.find(
          (item) => item.id === matchedProduct?.sectionId,
        ) ?? null;
    }
  }
"""
          if old not in source:
              raise SystemExit('legacy branch marker not found')
          path.write_text(source.replace(old, new, 1))

          contract = Path('apps/storefront/test/product-summary-reuse-contract.test.mjs')
          text = contract.read_text()
          addition = """

test('legacy product routes keep authoritative all-section lookup', async () => {
  const source = await readFile(new URL('../src/content.ts', import.meta.url), 'utf8');
  assert.match(
    source,
    /Legacy product URLs do not carry section context[\s\S]*bootstrap\.home\.allSections\.map/u,
  );
});
"""
          contract.write_text(text.rstrip() + addition + '\n')
          PY

          npx --yes prettier@3.9.6 --write apps/storefront/src/content.ts apps/storefront/test/product-summary-reuse-contract.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/content.ts apps/storefront/test/product-summary-reuse-contract.test.mjs
          git commit -m "Preserve legacy product lookup semantics"
          git push origin HEAD:agent/product-detail-summary-reuse
