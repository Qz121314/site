name: Phase D Apply

on:
  push:
    branches:
      - refactor/admin-management-workspaces
    paths:
      - scripts/phase-d-apply.py
      - .github/workflows/phase-d-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refactor/admin-management-workspaces

      - name: Apply scoped Phase D patch
        run: python scripts/phase-d-apply.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed Admin sources
        run: pnpm exec prettier --write apps/admin/src/ProductManagementView.tsx apps/admin/src/CategoryManagementView.tsx apps/admin/src/TagManagementView.tsx apps/admin/src/SectionManagementView.tsx apps/admin/src/AssetLibraryView.tsx apps/admin/src/ConversionPoolView.tsx apps/admin/src/admin-ui-system.css

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src
          git diff --cached --check
          git commit -m "refactor(admin): modernize management workspace composition"
          git push origin HEAD:refactor/admin-management-workspaces
