name: Update Product Content Test

on:
  pull_request:
    paths:
      - 'apps/storefront/test/content.test.mjs'
      - '.github/workflows/update-product-content-test.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Replace obsolete global product lookup contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/storefront/test/content.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldTitle = "test('section, product and FAQ reads follow their own module versions and cache sections on demand', async () => {";
          const newTitle = "test('section, canonical product and FAQ reads follow module versions without unrelated section fan-out', async () => {";
          if (!source.includes(oldTitle)) throw new Error('Expected content test title not found');
          source = source.replace(oldTitle, newTitle);
          const before = `    const globallyUniqueSlug = await loadProductSnapshot(bootstrap, 'product-a-slug');\n    assert.equal(globallyUniqueSlug.product.id, 'product-a');\n    assert.equal(\n      requests.filter(\n        (request) =>\n          request.url.includes(SECTION_B_VERSION) &&\n          request.url.endsWith('/section.json'),\n      ).length,\n      1,\n    );`;
          const after = `    assert.equal(\n      requests.filter(\n        (request) =>\n          request.url.includes(SECTION_B_VERSION) &&\n          request.url.endsWith('/section.json'),\n      ).length,\n      0,\n    );`;
          if (!source.includes(before)) throw new Error('Expected legacy global lookup assertion not found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          pnpm exec prettier --write apps/storefront/test/content.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/storefront/test/content.test.mjs
          git commit -m 'test: remove legacy global product fan-out contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
