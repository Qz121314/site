name: Final Acceptance Format Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print Prettier diff
        run: |
          pnpm exec prettier apps/storefront/src/main.tsx apps/storefront/test/desktop-acceptance-contract.test.mjs playwright.config.ts tests/e2e/desktop-production.spec.ts --write
          git diff -- apps/storefront/src/main.tsx apps/storefront/test/desktop-acceptance-contract.test.mjs playwright.config.ts tests/e2e/desktop-production.spec.ts
