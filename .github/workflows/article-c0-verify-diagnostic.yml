name: Article C0 Verify Diagnostic

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-verify-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify preflight
        run: pnpm preflight

      - name: Verify local migrations
        run: pnpm db:migrate:local

      - name: Verify full tests
        run: pnpm test

      - name: Verify build
        run: pnpm build

      - name: Verify Cloudflare dry run
        run: pnpm cf:check
