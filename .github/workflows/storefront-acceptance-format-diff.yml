name: Storefront Acceptance Format Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and push
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            tests/e2e/production-smoke.spec.ts \
            apps/storefront/test/production-visual-system-contract.test.mjs
          if git diff --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/production-smoke.spec.ts apps/storefront/test/production-visual-system-contract.test.mjs
          git commit -m 'style: format storefront acceptance tests'
          git push origin HEAD:${{ github.head_ref }}
