name: Article C0 Corrections

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-corrections.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Article C0 phase-gate corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('apps/worker/src/routes/admin-message-articles.ts')
          source = route_path.read_text()

          replacements = [
              ("""  enabled: boolean;\n  isEnabled: boolean;\n""", """  enabled: boolean;\n"""),
              ("""  backgroundMediaId: string | null;\n  isEnabled: boolean;\n""", """  backgroundMediaId: string | null;\n"""),
              ("""    placements: articleIds.map((articleId) => ({\n      articleId,\n      backgroundMediaId: null,\n      isEnabled: true,\n    })),\n""", """    placements: articleIds.map((articleId) => ({\n      articleId,\n      backgroundMediaId: null,\n    })),\n"""),
              ("""function parsePlacement(value: unknown): MessageArticlePlacementInput | null {\n  if (!isRecord(value) || !validReferenceId(value.articleId)) return null;\n  const rawBackground = value.backgroundMediaId;\n""", """function parsePlacement(value: unknown): MessageArticlePlacementInput | null {\n  if (!isRecord(value) || !validReferenceId(value.articleId) || 'isEnabled' in value) return null;\n  const rawBackground = value.backgroundMediaId;\n"""),
              ("""  if (backgroundMediaId === undefined) return null;\n  const isEnabled = value.isEnabled === undefined ? true : value.isEnabled;\n  if (typeof isEnabled !== 'boolean') return null;\n  return { articleId: value.articleId, backgroundMediaId, isEnabled };\n""", """  if (backgroundMediaId === undefined) return null;\n  return { articleId: value.articleId, backgroundMediaId };\n"""),
              ("""        `SELECT mar.article_id, mar.background_media_id, mar.sort_order, mar.is_enabled, f.question\n         FROM message_article_references mar\n         JOIN faqs f ON f.id = mar.article_id\n         WHERE f.deleted_at IS NULL\n""", """        `SELECT mar.article_id,\n                CASE WHEN background.id IS NOT NULL THEN mar.background_media_id ELSE NULL END AS background_media_id,\n                mar.sort_order, mar.is_enabled, f.question\n         FROM message_article_references mar\n         JOIN faqs f ON f.id = mar.article_id\n         LEFT JOIN media_assets background\n           ON background.id = mar.background_media_id\n          AND background.status = 'ready'\n          AND background.deleted_at IS NULL\n         WHERE f.deleted_at IS NULL\n"""),
              ("""    enabled: row.is_enabled === 1,\n    isEnabled: row.is_enabled === 1,\n""", """    enabled: row.is_enabled === 1,\n"""),
              ("""          `INSERT INTO message_article_references (\n               article_id, background_media_id, sort_order, is_enabled, created_at, updated_at\n             ) VALUES (?, ?, ?, ?, ?, ?)`,\n        ).bind(\n          placement.articleId,\n          placement.backgroundMediaId,\n          sortOrder,\n          placement.isEnabled ? 1 : 0,\n          now,\n          now,\n        ),\n""", """          `INSERT INTO message_article_references (\n               article_id, background_media_id, sort_order, is_enabled, created_at, updated_at\n             ) VALUES (?, ?, ?, 1, ?, ?)`,\n        ).bind(placement.articleId, placement.backgroundMediaId, sortOrder, now, now),\n"""),
              ("""            placements: parsed.placements.map((placement) => ({\n              articleId: placement.articleId,\n              backgroundMediaId: placement.backgroundMediaId,\n              isEnabled: placement.isEnabled,\n            })),\n""", """            placements: parsed.placements.map((placement) => ({\n              articleId: placement.articleId,\n              backgroundMediaId: placement.backgroundMediaId,\n            })),\n"""),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'route replacement expected once, found {source.count(old)}: {old[:80]!r}')
              source = source.replace(old, new, 1)
          route_path.write_text(source)

          test_path = Path('apps/worker/test/article-message-contract.test.mjs')
          test_source = test_path.read_text()

          test_source = test_source.replace(
              """    [\n      'media-video',\n      { id: 'media-video', status: 'ready', deleted_at: null, mime_type: 'video/mp4' },\n    ],\n""",
              """    [\n      'media-video',\n      { id: 'media-video', status: 'ready', deleted_at: null, mime_type: 'video/mp4' },\n    ],\n    [\n      'media-processing',\n      {\n        id: 'media-processing',\n        status: 'processing',\n        deleted_at: null,\n        mime_type: 'image/webp',\n      },\n    ],\n""",
              1,
          )

          test_source = test_source.replace(
              """    get references() {\n      return references.map((reference) => ({ ...reference }));\n    },\n    batches,\n""",
              """    get references() {\n      return references.map((reference) => ({ ...reference }));\n    },\n    setReferenceBackground(articleId, backgroundMediaId) {\n      const reference = references.find((item) => item.article_id === articleId);\n      if (!reference) throw new Error(`Unknown article reference: ${articleId}`);\n      reference.background_media_id = backgroundMediaId;\n    },\n    batches,\n""",
              1,
          )

          old_map = """                .map((reference) => ({\n                  ...reference,\n                  question: articles.get(reference.article_id)?.question,\n                }))\n"""
          new_map = """                .map((reference) => {\n                  const background = reference.background_media_id\n                    ? media.get(reference.background_media_id)\n                    : null;\n                  return {\n                    ...reference,\n                    background_media_id:\n                      background?.status === 'ready' && background.deleted_at === null\n                        ? reference.background_media_id\n                        : null,\n                    question: articles.get(reference.article_id)?.question,\n                  };\n                })\n"""
          if test_source.count(old_map) != 1:
              raise SystemExit(f'test map replacement expected once, found {test_source.count(old_map)}')
          test_source = test_source.replace(old_map, new_map, 1)

          old_test = """test('PUT /message-articles accepts placement presentation metadata, null backgrounds, ordering, and enabled state', async () => {\n  const db = createMessageArticleDb();\n  const app = withRequestId(adminMessageArticleRoutes);\n  const response = await app.request(\n    'https://admin.example.com/',\n    {\n      method: 'PUT',\n      headers: { 'content-type': 'application/json', 'x-admin-request': '1' },\n      body: JSON.stringify({\n        articles: [\n          {\n            articleId: 'article-a',\n            backgroundMediaId: 'media-ready',\n            isEnabled: false,\n          },\n          { articleId: 'article-b', backgroundMediaId: null, isEnabled: true },\n        ],\n      }),\n    },\n    { DB: db },\n  );\n\n  assert.equal(response.status, 200);\n  assert.deepEqual(await response.json(), {\n    articles: [\n      {\n        articleId: 'article-a',\n        title: 'Article A',\n        backgroundMediaId: 'media-ready',\n        sortOrder: 0,\n        enabled: false,\n        isEnabled: false,\n      },\n      {\n        articleId: 'article-b',\n        title: 'Article B',\n        backgroundMediaId: null,\n        sortOrder: 1,\n        enabled: true,\n        isEnabled: true,\n      },\n    ],\n  });\n  assert.deepEqual(db.references, [\n    {\n      article_id: 'article-a',\n      background_media_id: 'media-ready',\n      sort_order: 0,\n      is_enabled: 0,\n    },\n    {\n      article_id: 'article-b',\n      background_media_id: null,\n      sort_order: 1,\n      is_enabled: 1,\n    },\n  ]);\n});\n"""
          new_test = """test('PUT /message-articles accepts placement background metadata and preserves enabled semantics', async () => {\n  const db = createMessageArticleDb();\n  const app = withRequestId(adminMessageArticleRoutes);\n  const response = await app.request(\n    'https://admin.example.com/',\n    {\n      method: 'PUT',\n      headers: { 'content-type': 'application/json', 'x-admin-request': '1' },\n      body: JSON.stringify({\n        articles: [\n          { articleId: 'article-a', backgroundMediaId: 'media-ready' },\n          { articleId: 'article-b', backgroundMediaId: null },\n        ],\n      }),\n    },\n    { DB: db },\n  );\n\n  assert.equal(response.status, 200);\n  assert.deepEqual(await response.json(), {\n    articles: [\n      {\n        articleId: 'article-a',\n        title: 'Article A',\n        backgroundMediaId: 'media-ready',\n        sortOrder: 0,\n        enabled: true,\n      },\n      {\n        articleId: 'article-b',\n        title: 'Article B',\n        backgroundMediaId: null,\n        sortOrder: 1,\n        enabled: true,\n      },\n    ],\n  });\n  assert.deepEqual(db.references, [\n    {\n      article_id: 'article-a',\n      background_media_id: 'media-ready',\n      sort_order: 0,\n      is_enabled: 1,\n    },\n    {\n      article_id: 'article-b',\n      background_media_id: null,\n      sort_order: 1,\n      is_enabled: 1,\n    },\n  ]);\n});\n\ntest('PUT /message-articles rejects C0 enabled editing aliases', async () => {\n  const db = createMessageArticleDb();\n  const app = withRequestId(adminMessageArticleRoutes);\n  const response = await app.request(\n    'https://admin.example.com/',\n    {\n      method: 'PUT',\n      headers: { 'content-type': 'application/json', 'x-admin-request': '1' },\n      body: JSON.stringify({\n        articles: [{ articleId: 'article-a', backgroundMediaId: null, isEnabled: false }],\n      }),\n    },\n    { DB: db },\n  );\n\n  assert.equal(response.status, 400);\n  assert.equal(db.batches.length, 0);\n});\n"""
          if test_source.count(old_test) != 1:
              raise SystemExit(f'old enabled-state test expected once, found {test_source.count(old_test)}')
          test_source = test_source.replace(old_test, new_test, 1)

          test_source = test_source.replace("        isEnabled: true,\n", "")

          marker = """test('PUT /message-articles replaces the full list and persists input order deterministically', async () => {\n"""
          stale_test = """test('GET /message-articles nulls stale background media without dropping placements', async () => {\n  for (const [backgroundMediaId, expected] of [\n    ['media-ready', 'media-ready'],\n    ['media-deleted', null],\n    ['media-processing', null],\n    ['missing-media', null],\n  ]) {\n    const db = createMessageArticleDb();\n    db.setReferenceBackground('article-a', backgroundMediaId);\n    const app = withRequestId(adminMessageArticleRoutes);\n    const response = await app.request('https://admin.example.com/', {}, { DB: db });\n\n    assert.equal(response.status, 200);\n    const body = await response.json();\n    assert.equal(body.articles.length, 2);\n    const article = body.articles.find((item) => item.articleId === 'article-a');\n    assert.equal(article.backgroundMediaId, expected);\n    assert.equal(Object.hasOwn(article, 'isEnabled'), false);\n  }\n});\n\n"""
          if test_source.count(marker) != 1:
              raise SystemExit(f'PUT marker expected once, found {test_source.count(marker)}')
          test_source = test_source.replace(marker, stale_test + marker, 1)

          test_path.write_text(test_source)

          source_contract = Path('apps/worker/test/message-article-background-contract.test.mjs')
          contract = source_contract.read_text()
          old_contract = """  assert.match(source, /background_media_id/u);\n  assert.doesNotMatch(source, /INSERT INTO faqs[\\s\\S]*background/iu);\n"""
          new_contract = """  assert.match(source, /background_media_id/u);\n  assert.match(source, /LEFT JOIN media_assets background/u);\n  assert.match(source, /background.status = 'ready'/u);\n  assert.match(source, /background.deleted_at IS NULL/u);\n  assert.doesNotMatch(source, /\\bisEnabled\\b/u);\n  assert.match(source, /VALUES \\(\\?, \\?, \\?, 1, \\?, \\?\\)/u);\n  assert.doesNotMatch(source, /INSERT INTO faqs[\\s\\S]*background/iu);\n"""
          if contract.count(old_contract) != 1:
              raise SystemExit(f'source contract insertion expected once, found {contract.count(old_contract)}')
          source_contract.write_text(contract.replace(old_contract, new_contract, 1))
          PY
      - name: Run changed-file fixer
        run: pnpm fix:changed
      - name: Run formatting check
        run: pnpm format
      - name: Run targeted C0 contracts
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs
      - name: Run full repository verify
        run: pnpm verify
      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/routes/admin-message-articles.ts \
                  apps/worker/test/article-message-contract.test.mjs \
                  apps/worker/test/message-article-background-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(content): tighten message article placement contract"
          git push origin HEAD:feat/message-article-background-media-contract
