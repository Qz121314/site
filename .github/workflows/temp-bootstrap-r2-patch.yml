name: Temp Bootstrap R2 Finalize

on:
  push:
    branches:
      - agent/storefront-bootstrap-r2-budget

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-r2-budget
      - name: Document and format bootstrap R2 optimization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = """- `mediaBaseUrl`、当前主题配置与四个 Bottom Navigation 项使用同一条 D1 查询读取，导航图片的 `object_key` 也在该查询中解析；
          - Theme 与 Bottom Navigation 都仍是后台实时配置，不要求为了修改它们重新发布 R2 内容快照；
          """
          new = """- `mediaBaseUrl`、当前主题配置与四个 Bottom Navigation 项使用同一条 D1 查询读取，导航图片的 `object_key` 也在该查询中解析；
          - 已发布的 `site + sections index + home summary` 按 `pointerVersion` 合并为不可变 bootstrap bundle；正常命中后 Worker 只需要读取 `public/current.json + 对应 bootstrap bundle` 两个 R2 对象，而不是每次分别读取 4 个公开对象；
          - bootstrap bundle 缺失、损坏或版本不匹配时必须回退到现有 `site / sections / home` 公开快照读取并自动重建 bundle，不能因为缓存优化导致 Storefront 不可用；
          - bootstrap bundle 只缓存已发布静态内容；Theme、Bottom Navigation 与 `mediaBaseUrl` 仍是后台实时配置，不要求为了修改它们重新发布 R2 内容快照；
          """
          if old not in text:
              raise SystemExit('README bootstrap marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

          npm install --global prettier@3.9.6
          prettier --write \
            apps/worker/src/publishing/storefront-bootstrap-snapshot.ts \
            apps/worker/src/routes/public-storefront-config.ts \
            apps/worker/test/modular-publication.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs \
            README.md

          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/worker/src/publishing/storefront-bootstrap-snapshot.ts apps/worker/src/routes/public-storefront-config.ts apps/worker/test/modular-publication.test.mjs apps/worker/test/public-bootstrap-snapshot.test.mjs
          git commit -m "Finalize storefront bootstrap R2 budget"
          git push origin HEAD:agent/storefront-bootstrap-r2-budget
