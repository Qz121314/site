name: Format Messages UX

on:
  push:
    branches: [agent/messages-telegram-ux]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/messages-telegram-ux
      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Remove unstable memo dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/storefront/src/MessagesPage.tsx')
          source = path.read_text()
          old = """  const optimisticComposeConversation = useMemo<SupportConversationDetail | null>(() => {\n    if (!composeOptimisticMessage || !pendingConversation) return null;\n    return {\n      id: '__new__',\n      agentName: null,\n      agentAvatarUrl: null,\n      productTitle: pendingConversation.productTitle,\n      productCoverUrl: pendingConversation.productCoverUrl,\n      productHref: pendingConversation.productHref,\n      lastMessage: composeOptimisticMessage.body,\n      lastMessageAt: composeOptimisticMessage.sentAt,\n      unreadCount: 0,\n      status: 'waiting',\n      createdAt: composeOptimisticMessage.sentAt,\n      expiresAt: composeOptimisticMessage.sentAt,\n      messages: [composeOptimisticMessage],\n      nextMessageCursor: null,\n    };\n  }, [composeOptimisticMessage, pendingConversation]);\n"""
          new = """  const optimisticComposeConversation: SupportConversationDetail | null =\n    composeOptimisticMessage && pendingConversation\n      ? {\n          id: '__new__',\n          agentName: null,\n          agentAvatarUrl: null,\n          productTitle: pendingConversation.productTitle,\n          productCoverUrl: pendingConversation.productCoverUrl,\n          productHref: pendingConversation.productHref,\n          lastMessage: composeOptimisticMessage.body,\n          lastMessageAt: composeOptimisticMessage.sentAt,\n          unreadCount: 0,\n          status: 'waiting',\n          createdAt: composeOptimisticMessage.sentAt,\n          expiresAt: composeOptimisticMessage.sentAt,\n          messages: [composeOptimisticMessage],\n          nextMessageCursor: null,\n        }\n      : null;\n"""
          if old not in source:
              raise SystemExit('target block not found')
          path.write_text(source.replace(old, new))
          PY
      - run: pnpm exec prettier --write apps/storefront/src/MessagesPage.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/MessagesPage.tsx
          git commit -m "格式化 Messages 即时交互"
          git push origin HEAD:agent/messages-telegram-ux
