name: Verify Viewport Resync Production

on:
  pull_request:

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for main production pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: 07241bd32abcb6126f17423da2fa3d6f035ddeb6
        run: |
          set -euo pipefail
          node <<'NODE'
          const owner = 'Qz121314';
          const repo = 'site';
          const sha = process.env.MERGE_SHA;
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 120; attempt += 1) {
            const response = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/commits/${sha}/check-runs`,
              { headers },
            );
            if (!response.ok) throw new Error(`check-runs HTTP ${response.status}`);
            const payload = await response.json();
            const pipeline = payload.check_runs?.find((check) => check.name === 'pipeline');
            console.log(
              `MAIN_PIPELINE=${JSON.stringify(
                pipeline
                  ? {
                      status: pipeline.status,
                      conclusion: pipeline.conclusion,
                      details_url: pipeline.details_url,
                      started_at: pipeline.started_at,
                      completed_at: pipeline.completed_at,
                    }
                  : null,
              )}`,
            );
            if (pipeline?.status === 'completed') {
              if (pipeline.conclusion !== 'success') process.exit(2);
              process.exit(0);
            }
            await sleep(5000);
          }
          throw new Error('Timed out waiting for main production pipeline');
          NODE

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Re-run viewport production acceptance
        env:
          BASE_URL: https://service-catalog-site.fcqz121314.workers.dev
        run: >-
          pnpm exec playwright test tests/e2e/production-smoke.spec.ts
          --project=mobile-chromium
          --grep "a published product keeps shell chrome inside the live visual viewport"
          --reporter=line
