name: Product Metadata Format Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          cp apps/storefront/test/product-filter-metadata-visibility-contract.test.mjs /tmp/before.mjs
          pnpm exec prettier --write apps/storefront/test/product-filter-metadata-visibility-contract.test.mjs
          diff -u /tmp/before.mjs apps/storefront/test/product-filter-metadata-visibility-contract.test.mjs || true
