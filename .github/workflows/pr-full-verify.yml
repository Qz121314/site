name: PR Full Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr-full-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-write:
    if: github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/contact-card-delivery

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format contact card files
        run: >-
          pnpm exec prettier --write
          apps/storefront/src/support-contract.ts
          apps/storefront/src/support-media-gateway.ts
          apps/storefront/src/support-realtime.ts
          apps/storefront/test/chat-attachment-icon-contract.test.mjs
          apps/storefront/test/support-message-attachments.test.mjs

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/storefront/src/support-contract.ts \
            apps/storefront/src/support-media-gateway.ts \
            apps/storefront/src/support-realtime.ts \
            apps/storefront/test/chat-attachment-icon-contract.test.mjs \
            apps/storefront/test/support-message-attachments.test.mjs
          git commit -m "chore: format contact card delivery fix"
          git push origin HEAD:fix/contact-card-delivery

  check:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: guardrails
            label: Guardrails
            command: pnpm guardrails
          - id: format
            label: Format
            command: pnpm format
          - id: lint
            label: Lint
            command: pnpm lint
          - id: typecheck
            label: Typecheck
            command: pnpm typecheck
          - id: migrations
            label: D1 Migrations
            command: pnpm db:migrate:local
          - id: test
            label: Test
            command: pnpm test
          - id: build-budget
            label: Build + Bundle Budget
            command: pnpm build
          - id: worker-dry-run
            label: Worker Dry Run
            command: pnpm build && pnpm cf:check

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.label }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-logs
          ${{ matrix.command }} 2>&1 | tee .ci-logs/${{ matrix.id }}.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-full-verify-${{ matrix.id }}-${{ github.run_attempt }}
          path: .ci-logs/${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 7
