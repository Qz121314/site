name: PR Full Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'codex/storefront-visual-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        run: |
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check
