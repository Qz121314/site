name: Visual V2 Test Tail

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print failing test context
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          grep -n -B 18 -A 45 "not ok" /tmp/test.log || true
          exit $status
