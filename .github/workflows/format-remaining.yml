name: Format Remaining Customer Service Files

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit remaining files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/admin/src/CustomerServiceView.tsx
            apps/admin/src/conversion-pool/ConversionGroupEditorDialog.tsx
            apps/admin/src/conversion-pool/api.ts
            apps/worker/src/customer-service/customer-service-connections.ts
          )
          pnpm exec prettier --write "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m '应用剩余客服重构 Prettier 格式'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
