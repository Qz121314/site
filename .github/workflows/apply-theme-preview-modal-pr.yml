name: Apply Theme Preview Modal PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/admin-theme-preview-modal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-theme-preview-modal
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fix one-shot patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-theme-preview-modal.py')
          source = path.read_text()
          old = '''load_effect = """  useEffect(() => {
            void loadThemeCenter();
          }, [loadThemeCenter]);

          """
          preview_effect = """  useEffect(() => {
            void loadThemeCenter();
          }, [loadThemeCenter]);

          useEffect(() => {
            if (!previewOpen) return undefined;

            const previousOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
            const handleKeyDown = (event: KeyboardEvent) => {
              if (event.key === 'Escape') setPreviewOpen(false);
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => {
              document.body.style.overflow = previousOverflow;
              window.removeEventListener('keydown', handleKeyDown);
            };
          }, [previewOpen]);

          """'''
          new = '''load_effect = """  useEffect(() => {
              void loadThemeCenter();
            }, [loadThemeCenter]);

          """
          preview_effect = """  useEffect(() => {
              void loadThemeCenter();
            }, [loadThemeCenter]);

            useEffect(() => {
              if (!previewOpen) return undefined;

              const previousOverflow = document.body.style.overflow;
              document.body.style.overflow = 'hidden';
              const handleKeyDown = (event: KeyboardEvent) => {
                if (event.key === 'Escape') setPreviewOpen(false);
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => {
                document.body.style.overflow = previousOverflow;
                window.removeEventListener('keydown', handleKeyDown);
              };
            }, [previewOpen]);

          """'''
          if old not in source:
              raise SystemExit('temporary patch anchor definition not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - run: python .github/scripts/apply-theme-preview-modal.py
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/ThemeCenterView.tsx
          apps/admin/src/theme-center.css
          apps/admin/test/theme-center-preview-modal-contract.test.mjs

      - name: Commit result and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-theme-preview-modal.yml
          git rm .github/workflows/apply-theme-preview-modal-pr.yml
          git rm -f .github/scripts/apply-theme-preview-modal.py
          git add apps/admin/src/ThemeCenterView.tsx apps/admin/src/theme-center.css apps/admin/test/theme-center-preview-modal-contract.test.mjs
          git commit -m "fix(admin): open theme mobile preview in modal"
          git push origin HEAD:fix/admin-theme-preview-modal
