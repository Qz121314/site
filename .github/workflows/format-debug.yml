name: Format Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    if: github.head_ref == 'fix/deploy-production-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier apps/storefront/test/production-visual-system-contract.test.mjs --write
          git diff -- apps/storefront/test/production-visual-system-contract.test.mjs || true
