name: Temp Apply Bootstrap Theme PWA

on:
  push:
    branches:
      - agent/storefront-bootstrap-theme-pwa

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-theme-pwa
      - name: Apply request-budget optimization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, count))

          # Worker: fold live theme settings into the existing bootstrap runtime D1 query.
          path = 'apps/worker/src/routes/public-storefront-config.ts'
          replace(
              path,
              "import { BOTTOM_NAVIGATION_KEYS } from '../settings/bottom-navigation';\nimport type { AppEnvironment } from '../types';",
              "import { BOTTOM_NAVIGATION_KEYS } from '../settings/bottom-navigation';\nimport { parseThemeSettings, resolveTheme } from '../theme/theme-center';\nimport type { AppEnvironment } from '../types';",
          )
          replace(
              path,
              "type StorefrontRuntimeRow = {\n  media_base_url: string | null;\n  item_key: string;",
              "type StorefrontRuntimeRow = {\n  media_base_url: string | null;\n  theme_key: string | null;\n  theme_overrides_json: string | null;\n  item_key: string;",
          )
          replace(
              path,
              "type StorefrontBootstrapRuntime = {\n  mediaBaseUrl: string | null;\n  bottomNavigation:",
              "type StorefrontBootstrapRuntime = {\n  mediaBaseUrl: string | null;\n  theme: ReturnType<typeof resolveTheme>;\n  bottomNavigation:",
          )
          replace(
              path,
              "        `SELECT\n           ss.media_base_url,\n           nav.item_key,",
              "        `SELECT\n           ss.media_base_url,\n           ss.theme_key,\n           ss.theme_overrides_json,\n           nav.item_key,",
          )
          replace(
              path,
              "  const mediaBaseUrl = first.media_base_url;\n  if (rows.some((row) => row.media_base_url !== mediaBaseUrl)) return null;\n\n  const bottomNavigation:",
              "  const mediaBaseUrl = first.media_base_url;\n  const themeKey = first.theme_key;\n  const themeOverridesJson = first.theme_overrides_json;\n  if (\n    rows.some(\n      (row) =>\n        row.media_base_url !== mediaBaseUrl ||\n        row.theme_key !== themeKey ||\n        row.theme_overrides_json !== themeOverridesJson,\n    )\n  ) {\n    return null;\n  }\n  const theme = resolveTheme(parseThemeSettings(themeKey, themeOverridesJson));\n\n  const bottomNavigation:",
          )
          replace(
              path,
              "  return { mediaBaseUrl, bottomNavigation };",
              "  return { mediaBaseUrl, theme, bottomNavigation };",
          )
          replace(
              path,
              "    mediaBaseUrl: runtime.mediaBaseUrl,\n    bottomNavigation: runtime.bottomNavigation,",
              "    mediaBaseUrl: runtime.mediaBaseUrl,\n    theme: runtime.theme,\n    bottomNavigation: runtime.bottomNavigation,",
          )

          # Storefront content transport: validate theme locally so this directly-loaded TS module
          # remains dependency-free under Node's strip-types tests.
          path = 'apps/storefront/src/content.ts'
          replace(
              path,
              "export type BottomNavigationItemConfig = {\n  key: 'home' | 'browse' | 'messages' | 'faq';\n  label: string;\n  enabled: boolean;\n  icon: {\n    type: 'builtin' | 'emoji' | 'image';\n    value: string | null;\n  };\n};\n\n",
              "export type BottomNavigationItemConfig = {\n  key: 'home' | 'browse' | 'messages' | 'faq';\n  label: string;\n  enabled: boolean;\n  icon: {\n    type: 'builtin' | 'emoji' | 'image';\n    value: string | null;\n  };\n};\n\nexport type StorefrontThemeInstallPrompt = {\n  enabled: boolean;\n  delaySeconds: number;\n  title: string;\n  description: string;\n  iosDescription: string;\n  installLabel: string;\n  dismissLabel: string;\n};\n\nexport type StorefrontTheme = {\n  key: string;\n  colorScheme: 'light' | 'dark';\n  density: 'compact' | 'standard' | 'comfortable';\n  productMediaRatio: '1:1';\n  recipe: {\n    version: 2;\n    fontPack: 'modern' | 'editorial' | 'compact' | 'technical';\n    buttonStyle: 'refined' | 'minimal' | 'soft-pill';\n    mediaStyle: 'precise' | 'soft' | 'editorial';\n    motionStyle: 'restrained' | 'gentle' | 'active';\n    navigationStyle: 'quiet' | 'tinted' | 'solid';\n  };\n  installPrompt: StorefrontThemeInstallPrompt;\n  tokens: {\n    brand: string;\n    brandStrong: string;\n    text: string;\n    muted: string;\n    surface: string;\n    surfaceSoft: string;\n    line: string;\n    pageBg: string;\n    heroStart: string;\n    heroEnd: string;\n    heroGlow: string;\n    shadow: string;\n  };\n};\n\n",
          )
          replace(
              path,
              "  home: HomeSnapshot;\n  bottomNavigation: BottomNavigationItemConfig[];",
              "  home: HomeSnapshot;\n  theme: StorefrontTheme;\n  bottomNavigation: BottomNavigationItemConfig[];",
          )
          replace(
              path,
              "  configuredMediaBaseUrl: string | null;\n  bottomNavigation: BottomNavigationItemConfig[];",
              "  configuredMediaBaseUrl: string | null;\n  theme: StorefrontTheme;\n  bottomNavigation: BottomNavigationItemConfig[];",
          )
          replace(
              path,
              "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nfunction isBottomNavigationKey(",
              "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nconst STOREFRONT_THEME_TOKEN_KEYS = [\n  'brand',\n  'brandStrong',\n  'text',\n  'muted',\n  'surface',\n  'surfaceSoft',\n  'line',\n  'pageBg',\n  'heroStart',\n  'heroEnd',\n  'heroGlow',\n  'shadow',\n] as const;\n\nfunction parseStorefrontTheme(value: unknown): StorefrontTheme {\n  if (\n    !isRecord(value) ||\n    typeof value.key !== 'string' ||\n    (value.colorScheme !== 'light' && value.colorScheme !== 'dark') ||\n    (value.density !== 'compact' &&\n      value.density !== 'standard' &&\n      value.density !== 'comfortable') ||\n    value.productMediaRatio !== '1:1' ||\n    !isRecord(value.recipe) ||\n    value.recipe.version !== 2 ||\n    !['modern', 'editorial', 'compact', 'technical'].includes(String(value.recipe.fontPack)) ||\n    !['refined', 'minimal', 'soft-pill'].includes(String(value.recipe.buttonStyle)) ||\n    !['precise', 'soft', 'editorial'].includes(String(value.recipe.mediaStyle)) ||\n    !['restrained', 'gentle', 'active'].includes(String(value.recipe.motionStyle)) ||\n    !['quiet', 'tinted', 'solid'].includes(String(value.recipe.navigationStyle)) ||\n    !isRecord(value.installPrompt) ||\n    typeof value.installPrompt.enabled !== 'boolean' ||\n    !Number.isInteger(value.installPrompt.delaySeconds) ||\n    Number(value.installPrompt.delaySeconds) < 5 ||\n    Number(value.installPrompt.delaySeconds) > 120 ||\n    typeof value.installPrompt.title !== 'string' ||\n    typeof value.installPrompt.description !== 'string' ||\n    typeof value.installPrompt.iosDescription !== 'string' ||\n    typeof value.installPrompt.installLabel !== 'string' ||\n    typeof value.installPrompt.dismissLabel !== 'string' ||\n    !isRecord(value.tokens) ||\n    !STOREFRONT_THEME_TOKEN_KEYS.every((key) => typeof value.tokens[key] === 'string')\n  ) {\n    throw new Error('THEME_INVALID');\n  }\n  return value as StorefrontTheme;\n}\n\nasync function loadTheme(signal?: AbortSignal): Promise<StorefrontTheme> {\n  const response = await fetch('/api/public/theme', {\n    method: 'GET',\n    cache: 'no-cache',\n    credentials: 'same-origin',\n    headers: { Accept: 'application/json' },\n    ...(signal ? { signal } : {}),\n  });\n  if (!response.ok) throw new Error('THEME_UNAVAILABLE');\n  const body = (await response.json()) as unknown;\n  if (!isRecord(body)) throw new Error('THEME_INVALID');\n  return parseStorefrontTheme(body.theme);\n}\n\nfunction isBottomNavigationKey(",
          )
          replace(
              path,
              "  const [rawSite, rawIndex, configuredMediaBaseUrl, bottomNavigation] = bundle\n    ? [\n        bundle.rawSite,\n        bundle.rawIndex,\n        bundle.configuredMediaBaseUrl,\n        bundle.bottomNavigation,\n      ]\n    : await Promise.all([",
              "  const [rawSite, rawIndex, configuredMediaBaseUrl, bottomNavigation, theme] = bundle\n    ? [\n        bundle.rawSite,\n        bundle.rawIndex,\n        bundle.configuredMediaBaseUrl,\n        bundle.bottomNavigation,\n        bundle.theme,\n      ]\n    : await Promise.all([",
          )
          replace(
              path,
              "        resolveMediaBaseUrl(signal),\n        loadBottomNavigation(signal),\n      ]);",
              "        resolveMediaBaseUrl(signal),\n        loadBottomNavigation(signal),\n        loadTheme(signal),\n      ]);",
              1,
          )
          replace(
              path,
              "    bottomNavigation,\n    sectionSnapshots,",
              "    theme,\n    bottomNavigation,\n    sectionSnapshots,",
              1,
          )
          replace(
              path,
              "  let bottomNavigation: BottomNavigationItemConfig[];\n  try {\n    bottomNavigation = parseBottomNavigationItems(value.bottomNavigation);\n  } catch {\n    return null;\n  }\n  return {",
              "  let bottomNavigation: BottomNavigationItemConfig[];\n  let theme: StorefrontTheme;\n  try {\n    bottomNavigation = parseBottomNavigationItems(value.bottomNavigation);\n    theme = parseStorefrontTheme(value.theme);\n  } catch {\n    return null;\n  }\n  return {",
          )
          replace(
              path,
              "    configuredMediaBaseUrl: normalizeContentOrigin(\n      typeof value.mediaBaseUrl === 'string' ? value.mediaBaseUrl : null,\n    ),\n    bottomNavigation,",
              "    configuredMediaBaseUrl: normalizeContentOrigin(\n      typeof value.mediaBaseUrl === 'string' ? value.mediaBaseUrl : null,\n    ),\n    theme,\n    bottomNavigation,",
          )
          replace(
              path,
              "  const [site, rawHome, bottomNavigation] = await Promise.all([\n    loadV1File<SiteSnapshot>(origin, pointer.contentVersion, 'site.json', signal),\n    loadV1File<HomeSnapshot>(origin, pointer.contentVersion, 'home.json', signal),\n    loadBottomNavigation(signal),\n  ]);",
              "  const [site, rawHome, bottomNavigation, theme] = await Promise.all([\n    loadV1File<SiteSnapshot>(origin, pointer.contentVersion, 'site.json', signal),\n    loadV1File<HomeSnapshot>(origin, pointer.contentVersion, 'home.json', signal),\n    loadBottomNavigation(signal),\n    loadTheme(signal),\n  ]);",
          )
          replace(
              path,
              "    home: normalizeV1HomeSnapshot(rawHome),\n    bottomNavigation,",
              "    home: normalizeV1HomeSnapshot(rawHome),\n    theme,\n    bottomNavigation,",
          )

          # Theme runtime: keep synchronous cached theme for first paint; expose an idempotent
          # live-theme application hook for bootstrap data. Keep old endpoint loader for fallback use.
          path = 'apps/storefront/src/theme-runtime.ts'
          replace(
              path,
              "export async function installStorefrontTheme(): Promise<PublicTheme | null> {\n  const cached = readCachedTheme();\n  if (cached) applyTheme(cached);\n\n  try {",
              "function cacheTheme(theme: PublicTheme): void {\n  try {\n    window.localStorage.setItem(CACHE_KEY, JSON.stringify(theme));\n  } catch {\n    // Theme caching is optional; the live runtime remains authoritative.\n  }\n}\n\nexport function installCachedStorefrontTheme(): PublicTheme | null {\n  const cached = readCachedTheme();\n  if (cached) applyTheme(cached);\n  return cached;\n}\n\nexport function applyStorefrontTheme(theme: PublicTheme): boolean {\n  if (!validTheme(theme)) return false;\n  applyTheme(theme);\n  cacheTheme(theme);\n  return true;\n}\n\nexport async function installStorefrontTheme(): Promise<PublicTheme | null> {\n  const cached = installCachedStorefrontTheme();\n\n  try {",
          )
          replace(
              path,
              "    if (!isRecord(body) || !validTheme(body.theme)) return cached;\n    applyTheme(body.theme);\n    try {\n      window.localStorage.setItem(CACHE_KEY, JSON.stringify(body.theme));\n    } catch {\n      // Theme caching is optional; the live response remains authoritative.\n    }\n    return body.theme;",
              "    if (!isRecord(body) || !validTheme(body.theme)) return cached;\n    applyStorefrontTheme(body.theme);\n    return body.theme;",
          )

          # Small local runtime store lets the PWA listener mount immediately while app/config
          # arrive from bootstrap later, so beforeinstallprompt capture timing is preserved.
          Path('apps/storefront/src/pwa-install-runtime.ts').write_text("""import type { ThemeInstallPrompt } from './theme-runtime';

export type PwaInstallRuntime = {
  appName: string;
  config: ThemeInstallPrompt;
};

type Listener = () => void;

let currentRuntime: PwaInstallRuntime | null = null;
const listeners = new Set<Listener>();

export function publishPwaInstallRuntime(runtime: PwaInstallRuntime): void {
  currentRuntime = runtime;
  for (const listener of listeners) listener();
}

export function subscribePwaInstallRuntime(listener: Listener): () => void {
  listeners.add(listener);
  return () => listeners.delete(listener);
}

export function getPwaInstallRuntime(): PwaInstallRuntime | null {
  return currentRuntime;
}
""")

          # Main: apply only cached theme synchronously; live theme comes with bootstrap.
          path = 'apps/storefront/src/main.tsx'
          replace(
              path,
              "import { installStorefrontTheme } from './theme-runtime';",
              "import { installCachedStorefrontTheme } from './theme-runtime';",
          )
          replace(
              path,
              "const storefrontThemePromise = installStorefrontTheme();",
              "installCachedStorefrontTheme();",
          )
          replace(
              path,
              "      <PwaInstallPrompt themePromise={storefrontThemePromise} />",
              "      <PwaInstallPrompt />",
          )

          # Root: apply live bootstrap theme before paint and publish PWA app/config locally.
          path = 'apps/storefront/src/StorefrontRoot.tsx'
          replace(
              path,
              "  Suspense,\n  useEffect,\n  useSyncExternalStore,",
              "  Suspense,\n  useEffect,\n  useLayoutEffect,\n  useSyncExternalStore,",
          )
          replace(
              path,
              "import { primaryNavigationItems } from './storefront-navigation';",
              "import { publishPwaInstallRuntime } from './pwa-install-runtime';\nimport { primaryNavigationItems } from './storefront-navigation';",
          )
          replace(
              path,
              "import { SYSTEM_UI } from './system-ui';",
              "import { SYSTEM_UI } from './system-ui';\nimport { applyStorefrontTheme } from './theme-runtime';",
          )
          replace(
              path,
              "  const supportConversationsQuery = useQuery({\n    queryKey: ['support-conversations'],\n    queryFn: ({ signal }) => siteSupportGateway.listConversations(signal),\n    enabled: supportRuntimeEnabled,\n    staleTime: Number.POSITIVE_INFINITY,\n    retry: 1,\n    refetchOnWindowFocus: false,\n  });\n  const unreadMessages =",
              "  const supportConversationsQuery = useQuery({\n    queryKey: ['support-conversations'],\n    queryFn: ({ signal }) => siteSupportGateway.listConversations(signal),\n    enabled: supportRuntimeEnabled,\n    staleTime: Number.POSITIVE_INFINITY,\n    retry: 1,\n    refetchOnWindowFocus: false,\n  });\n\n  useLayoutEffect(() => {\n    const bootstrap = bootstrapQuery.data;\n    if (!bootstrap) return;\n    applyStorefrontTheme(bootstrap.theme);\n    publishPwaInstallRuntime({\n      appName: bootstrap.site.site.name,\n      config: bootstrap.theme.installPrompt,\n    });\n  }, [bootstrapQuery.data]);\n\n  const unreadMessages =",
          )

          # PWA prompt: retain immediate listener mount, remove the second manual manifest fetch.
          path = 'apps/storefront/src/PwaInstallPrompt.tsx'
          replace(
              path,
              "import { useEffect, useState } from 'react';\nimport { type PublicTheme, type ThemeInstallPrompt } from './theme-runtime';",
              "import { useEffect, useState, useSyncExternalStore } from 'react';\nimport {\n  getPwaInstallRuntime,\n  subscribePwaInstallRuntime,\n} from './pwa-install-runtime';",
          )
          replace(
              path,
              "type PwaManifest = {\n  name?: unknown;\n};\n\n",
              "",
          )
          replace(
              path,
              "export function PwaInstallPrompt({\n  themePromise,\n}: {\n  themePromise: Promise<PublicTheme | null>;\n}) {\n  const [appName, setAppName] = useState<string | null>(null);\n  const [config, setConfig] = useState<ThemeInstallPrompt | null>(null);",
              "export function PwaInstallPrompt() {\n  const runtime = useSyncExternalStore(\n    subscribePwaInstallRuntime,\n    getPwaInstallRuntime,\n    getPwaInstallRuntime,\n  );\n  const appName = runtime?.appName ?? null;\n  const config = runtime?.config ?? null;",
          )
          replace(
              path,
              "  useEffect(() => {\n    const controller = new AbortController();\n    void themePromise.then((theme) => {\n      setConfig(theme?.installPrompt ?? null);\n    });\n    void fetch('/manifest.webmanifest', { signal: controller.signal })\n      .then(async (response) => {\n        if (!response.ok) return null;\n        return response.json() as Promise<PwaManifest>;\n      })\n      .then((manifest) => {\n        if (!manifest || typeof manifest.name !== 'string' || !manifest.name.trim())\n          return;\n        const name = manifest.name.trim();\n        setAppName(name);\n        syncAppMetadata(name);\n      })\n      .catch(() => undefined);\n\n    return () => controller.abort();\n  }, [themePromise]);",
              "  useEffect(() => {\n    if (appName) syncAppMetadata(appName);\n  }, [appName]);",
          )

          # Storefront content tests: theme fixture, compact one-request contract, and fallback endpoint.
          path = 'apps/storefront/test/content.test.mjs'
          replace(
              path,
              "function bottomNavigation() {",
              "function storefrontTheme() {\n  return {\n    key: 'saas',\n    colorScheme: 'light',\n    density: 'comfortable',\n    productMediaRatio: '1:1',\n    recipe: {\n      version: 2,\n      fontPack: 'modern',\n      buttonStyle: 'refined',\n      mediaStyle: 'precise',\n      motionStyle: 'restrained',\n      navigationStyle: 'tinted',\n    },\n    installPrompt: {\n      enabled: true,\n      delaySeconds: 30,\n      title: 'Install app',\n      description: 'Add it to your desktop for faster access.',\n      iosDescription: 'Use Share, then Add to Home Screen.',\n      installLabel: 'Install',\n      dismissLabel: 'Not now',\n    },\n    tokens: {\n      brand: '#4f46e5',\n      brandStrong: '#3730a3',\n      text: '#111827',\n      muted: '#6b7280',\n      surface: '#ffffff',\n      surfaceSoft: '#f7f8fc',\n      line: '#e5e7eb',\n      pageBg: '#f8fafc',\n      heroStart: '#4f46e5',\n      heroEnd: '#2563eb',\n      heroGlow: '#bfdbfe',\n      shadow: '0 14px 34px rgb(79 70 229 / 10%)',\n    },\n  };\n}\n\nfunction bottomNavigation() {",
          )
          replace(
              path,
              "        mediaBaseUrl: 'https://media.example.com',\n        bottomNavigation: bottomNavigation(),",
              "        mediaBaseUrl: 'https://media.example.com',\n        theme: storefrontTheme(),\n        bottomNavigation: bottomNavigation(),",
          )
          replace(
              path,
              "    if (url === '/api/public/storefront/media-base-url') {\n      return jsonResponse({ mediaBaseUrl: 'https://media.example.com' });\n    }",
              "    if (url === '/api/public/storefront/media-base-url') {\n      return jsonResponse({ mediaBaseUrl: 'https://media.example.com' });\n    }\n    if (url === '/api/public/theme') {\n      return jsonResponse({ theme: storefrontTheme() });\n    }",
          )
          replace(
              path,
              "    if (url === '/api/public/bottom-navigation/') {\n      return jsonResponse({ items: bottomNavigation() });\n    }\n    if (url.endsWith('/public/current.json')) {",
              "    if (url === '/api/public/bottom-navigation/') {\n      return jsonResponse({ items: bottomNavigation() });\n    }\n    if (url === '/api/public/theme') {\n      return jsonResponse({ theme: storefrontTheme() });\n    }\n    if (url.endsWith('/public/current.json')) {",
              1,
          )
          replace(
              path,
              "    assert.equal(result.bottomNavigation[0].key, 'home');",
              "    assert.equal(result.bottomNavigation[0].key, 'home');\n    assert.equal(result.theme.key, 'saas');\n    assert.equal(result.theme.installPrompt.delaySeconds, 30);",
          )
          replace(
              path,
              "    assert.equal(bootstrap.bottomNavigation.length, 4);\n    assert.equal(bootstrap.bottomNavigation[2].key, 'messages');",
              "    assert.equal(bootstrap.bottomNavigation.length, 4);\n    assert.equal(bootstrap.bottomNavigation[2].key, 'messages');\n    assert.equal(bootstrap.theme.key, 'saas');\n    assert.equal(bootstrap.theme.installPrompt.delaySeconds, 30);",
          )

          # Worker request-budget tests: theme must ride the same single D1 query.
          for path in [
              'apps/worker/test/public-bootstrap-runtime.test.mjs',
              'apps/worker/test/modular-publication.test.mjs',
          ]:
              text = Path(path).read_text()
              text = text.replace(
                  "media_base_url: 'https://media.example.com',\n                item_key:",
                  "media_base_url: 'https://media.example.com',\n                theme_key: 'saas',\n                theme_overrides_json: '{}',\n                item_key:",
              )
              Path(path).write_text(text)

          path = 'apps/worker/test/public-bootstrap-runtime.test.mjs'
          replace(
              path,
              "      assert.match(sql, /CROSS JOIN site_bottom_navigation nav/u);",
              "      assert.match(sql, /ss\\.theme_key/u);\n      assert.match(sql, /ss\\.theme_overrides_json/u);\n      assert.match(sql, /CROSS JOIN site_bottom_navigation nav/u);",
          )
          replace(
              path,
              "  assert.equal(runtime.mediaBaseUrl, 'https://media.example.com');",
              "  assert.equal(runtime.mediaBaseUrl, 'https://media.example.com');\n  assert.equal(runtime.theme.key, 'saas');\n  assert.equal(runtime.theme.installPrompt.delaySeconds, 30);",
          )

          path = 'apps/worker/test/modular-publication.test.mjs'
          replace(
              path,
              "import { publicStorefrontConfigRoutes } from '../src/routes/public-storefront-config.ts';",
              "import { publicStorefrontConfigRoutes } from '../src/routes/public-storefront-config.ts';\nimport { resolveTheme } from '../src/theme/theme-center.ts';",
          )
          replace(
              path,
              "      assert.match(sql, /CROSS JOIN site_bottom_navigation nav/u);",
              "      assert.match(sql, /ss\\.theme_key/u);\n      assert.match(sql, /ss\\.theme_overrides_json/u);\n      assert.match(sql, /CROSS JOIN site_bottom_navigation nav/u);",
              1,
          )
          replace(
              path,
              "    mediaBaseUrl: 'https://media.example.com',\n    bottomNavigation,",
              "    mediaBaseUrl: 'https://media.example.com',\n    theme: resolveTheme({ key: 'saas', overrides: {} }),\n    bottomNavigation,",
          )

          # Regression contract: no normal standalone theme request and no JS manifest refetch.
          Path('apps/storefront/test/storefront-bootstrap-theme-pwa.test.mjs').write_text("""import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';
import test from 'node:test';

test('Storefront startup reuses bootstrap for live theme and PWA runtime data', async () => {
  const [mainSource, rootSource, pwaSource, contentSource] = await Promise.all([
    readFile(new URL('../src/main.tsx', import.meta.url), 'utf8'),
    readFile(new URL('../src/StorefrontRoot.tsx', import.meta.url), 'utf8'),
    readFile(new URL('../src/PwaInstallPrompt.tsx', import.meta.url), 'utf8'),
    readFile(new URL('../src/content.ts', import.meta.url), 'utf8'),
  ]);

  assert.match(mainSource, /installCachedStorefrontTheme\(\)/u);
  assert.doesNotMatch(mainSource, /installStorefrontTheme\(\)/u);
  assert.match(rootSource, /applyStorefrontTheme\(bootstrap\.theme\)/u);
  assert.match(rootSource, /publishPwaInstallRuntime/u);
  assert.doesNotMatch(pwaSource, /fetch\(['\"]\/manifest\.webmanifest/u);
  assert.match(pwaSource, /beforeinstallprompt/u);
  assert.match(contentSource, /loadTheme\(signal\)/u);
});
""")

          # README: document the stronger startup budget while retaining compatibility behavior.
          path = 'README.md'
          replace(
              path,
              "→ 当前 mediaBaseUrl\n→ Bottom Navigation",
              "→ 当前 mediaBaseUrl\n→ 当前 Theme Runtime\n→ Bottom Navigation",
          )
          replace(
