name: Admin format one-shot

on:
  push:
    branches: [optimize/closure-performance]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: optimize/closure-performance

      - name: Format Dashboard
        run: npx --yes prettier@3.9.6 --write apps/admin/src/Dashboard.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/Dashboard.tsx
          git commit -m 'style(admin): format lazy view split'
          git push origin HEAD:optimize/closure-performance
