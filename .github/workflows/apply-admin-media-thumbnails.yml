name: Apply admin media thumbnails

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/admin-media-thumbnails'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${HEAD_REF}"
          git checkout -B "${HEAD_REF}" FETCH_HEAD

      - name: Apply media center thumbnail previews
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const viewPath = 'apps/admin/src/AssetLibraryView.tsx';
          let source = fs.readFileSync(viewPath, 'utf8');

          const importNeedle = "import { AdminApiError } from './api';\n";
          const importLine = "import { adminMediaThumbnailUrl } from './branding-media/api';\n";
          if (!source.includes(importLine)) {
            if (!source.includes(importNeedle)) throw new Error('AdminApiError import anchor not found');
            source = source.replace(importNeedle, importNeedle + importLine);
          }

          const start = source.indexOf('                        {asset.publicUrl ? (');
          const endMarker = '                        <b>{kindLabel(asset.mediaKind)}</b>';
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Managed media preview block not found');

          const replacement = `                        {asset.mediaKind === 'video' ? (\n                          <span>视频</span>\n                        ) : (\n                          <img\n                            src={adminMediaThumbnailUrl(asset.id)}\n                            alt=""\n                            loading="lazy"\n                          />\n                        )}\n`;
          source = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(viewPath, source);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.scripts.format = 'prettier --check .';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/admin/src/AssetLibraryView.tsx package.json

      - name: Commit clean business changes
        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .github/workflows/apply-admin-media-thumbnails.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/AssetLibraryView.tsx package.json .github/workflows/apply-admin-media-thumbnails.yml
          git commit -m 'Use thumbnails across admin media center'
          git push origin "HEAD:${HEAD_REF}"
