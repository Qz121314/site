name: Format chat media

on:
  push:
    branches: [feat/chat-media]
    paths:
      - .github/workflows/format-chat-media.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-media
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/storefront/src/support-image-compress.ts apps/storefront/src/support-media-gateway.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/support-image-compress.ts apps/storefront/src/support-media-gateway.ts
          git commit -m "格式化访客图片媒体代码"
          git push origin HEAD:feat/chat-media
