name: Storefront M Preflight

on:
  push:
    branches:
      - refactor/storefront-bottom-chrome

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storefront-bottom-chrome
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/storefront/src/StorefrontRoot.tsx
          apps/storefront/src/app-shell.css
          apps/storefront/src/pwa.css
          apps/storefront/src/section-ui.css
          apps/storefront/src/storefront-viewport-runtime.ts
          apps/storefront/test/mobile-fixed-surface-ownership-contract.test.mjs
          apps/storefront/test/product-detail-conversion-contract.test.mjs
          apps/storefront/test/production-visual-system-contract.test.mjs
          apps/storefront/test/storefront-full-polish-contract.test.mjs
          apps/storefront/test/storefront-visual-viewport-contract.test.mjs
          docs/storefront-viewport-runtime.md
          scripts/check-repository-guardrails.mjs
          tests/e2e/production-smoke.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit --no-verify -m "style: apply storefront preflight formatting"
          git push
      - run: pnpm guardrails
      - run: pnpm --filter @site/storefront lint
      - run: pnpm --filter @site/storefront test
      - run: pnpm --filter @site/storefront typecheck
      - run: pnpm --filter @site/storefront build
