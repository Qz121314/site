name: Temp Capture Test Failure

on:
  pull_request:
    branches:
      - main

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture compact test failure
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test-output.txt 2>&1
          status=$?
          set -e
          echo '--- TEST FAILURE TAIL ---'
          tail -n 180 /tmp/test-output.txt
          echo '--- END TEST FAILURE TAIL ---'
          exit "$status"
