name: Temp Capture Test Failure

on:
  push:
    branches:
      - agent/storefront-bootstrap-navigation

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js and pnpm
        run: |
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Capture exact Storefront test failure
        shell: bash
        run: |
          set +e
          pnpm --filter @site/storefront test > /tmp/test-output.txt 2>&1
          status=$?
          set -e
          echo '--- FAILURE MATCHES ---'
          grep -n -B 20 -A 45 -E 'not ok|AssertionError|failureType|ERR_ASSERTION|error:' /tmp/test-output.txt || true
          echo '--- END FAILURE MATCHES ---'
          exit "$status"
