name: Temp Capture Test Failure

on:
  push:
    branches:
      - agent/storefront-bootstrap-navigation

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-navigation
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture tests
        shell: bash
        run: |
          set +e
          pnpm test > test-failure-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Tests passed in diagnostic run." > test-failure-output.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-failure-output.txt
          git commit -m "Capture test failure output"
          git push origin HEAD:agent/storefront-bootstrap-navigation
