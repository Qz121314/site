name: Temp Apply Content Transport Fix

on:
  push:
    branches:
      - agent/storefront-bootstrap-navigation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-navigation
      - name: Apply transport-safe navigation helpers and restore diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          content_path = Path('apps/storefront/src/content.ts')
          content = content_path.read_text()
          import_block = """import {
            loadBottomNavigation,
            parseBottomNavigationItems,
            type BottomNavigationItemConfig,
          } from './bottom-navigation';

          """
          type_block = """export type BottomNavigationItemConfig = {
            key: 'home' | 'browse' | 'messages' | 'faq';
            label: string;
            enabled: boolean;
            icon: {
              type: 'builtin' | 'emoji' | 'image';
              value: string | null;
            };
          };

          """
          if import_block not in content:
              raise SystemExit('content.ts bottom-navigation import block not found')
          content = content.replace(import_block, type_block, 1)

          marker = """function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === 'object' && value !== null && !Array.isArray(value);
          }
          """
          helpers = """

          function isBottomNavigationKey(
            value: unknown,
          ): value is BottomNavigationItemConfig['key'] {
            return (
              value === 'home' ||
              value === 'browse' ||
              value === 'messages' ||
              value === 'faq'
            );
          }

          function parseBottomNavigationItem(value: unknown): BottomNavigationItemConfig | null {
            if (
              !isRecord(value) ||
              !isBottomNavigationKey(value.key) ||
              typeof value.label !== 'string' ||
              typeof value.enabled !== 'boolean' ||
              !isRecord(value.icon) ||
              (value.icon.type !== 'builtin' &&
                value.icon.type !== 'emoji' &&
                value.icon.type !== 'image') ||
              (typeof value.icon.value !== 'string' && value.icon.value !== null)
            ) {
              return null;
            }
            return {
              key: value.key,
              label: value.label,
              enabled: value.enabled,
              icon: { type: value.icon.type, value: value.icon.value },
            };
          }

          export function parseBottomNavigationItems(
            value: unknown,
          ): BottomNavigationItemConfig[] {
            if (!Array.isArray(value)) throw new Error('BOTTOM_NAVIGATION_INVALID');
            const items = value.map(parseBottomNavigationItem);
            if (items.some((item) => item === null)) throw new Error('BOTTOM_NAVIGATION_INVALID');
            const parsed = items as BottomNavigationItemConfig[];
            const keys = new Set(parsed.map((item) => item.key));
            if (parsed.length !== 4 || keys.size !== 4) {
              throw new Error('BOTTOM_NAVIGATION_INVALID');
            }
            return parsed;
          }

          async function loadBottomNavigation(
            signal?: AbortSignal,
          ): Promise<BottomNavigationItemConfig[]> {
            const response = await fetch('/api/public/bottom-navigation/', {
              method: 'GET',
              cache: 'no-cache',
              credentials: 'same-origin',
              headers: { Accept: 'application/json' },
              ...(signal ? { signal } : {}),
            });
            if (!response.ok) throw new Error('BOTTOM_NAVIGATION_UNAVAILABLE');
            const body = (await response.json()) as unknown;
            if (!isRecord(body)) throw new Error('BOTTOM_NAVIGATION_INVALID');
            return parseBottomNavigationItems(body.items);
          }
          """
          if marker not in content:
              raise SystemExit('content.ts isRecord marker not found')
          content = content.replace(marker, marker + helpers, 1)
          content_path.write_text(content)

          package_path = Path('apps/storefront/package.json')
          package = package_path.read_text()
          diagnostic_script = 'node --test --test-reporter=spec --experimental-strip-types test/*.test.mjs'
          original_script = 'node --test --experimental-strip-types test/*.test.mjs'
          if diagnostic_script not in package:
              raise SystemExit('diagnostic Storefront test script not found')
          package_path.write_text(package.replace(diagnostic_script, original_script, 1))

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          diagnostic_test = """      - name: Test
                  shell: bash
                  run: |
                    set +e
                    pnpm test > /tmp/test-output.txt 2>&1
                    status=$?
                    set -e
                    tail -n 180 /tmp/test-output.txt
                    exit \"$status\"
          """
          original_test = """      - name: Test
                  run: pnpm test
          """
          if diagnostic_test not in ci:
              raise SystemExit('diagnostic CI Test step not found')
          ci_path.write_text(ci.replace(diagnostic_test, original_test, 1))

          Path('.github/workflows/temp-capture-test-failure.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep storefront content transport directly loadable"
          git push origin HEAD:agent/storefront-bootstrap-navigation
