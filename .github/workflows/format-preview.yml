name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Print formatted contract
        run: pnpm exec prettier apps/storefront/test/first-paint-app-shell-contract.test.mjs
