name: Article C0 Validation

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted Article C0 contracts
        run: |
          node --test \
            apps/worker/test/message-article-migration.test.mjs \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs \
            apps/worker/test/asset-cleanup-integration.test.mjs \
            apps/storefront/test/messages-articles.test.mjs

      - name: Full repository verify
        run: pnpm verify
