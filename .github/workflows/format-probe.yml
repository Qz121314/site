name: Format Probe

on:
  push:
    branches:
      - ui/product-detail-gallery-affordance

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/product-detail-gallery-affordance
      - name: Set up Node.js and pnpm
        run: |
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          set -euo pipefail
          TARGET=apps/storefront/test/product-detail-mobile-gallery-affordance.test.mjs
          pnpm exec prettier --write "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'style(storefront): format gallery contract test'
          git push origin HEAD:ui/product-detail-gallery-affordance
