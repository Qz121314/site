name: Viewport preflight

on:
  push:
    branches:
      - refactor/storefront-visual-viewport

permissions:
  contents: write

jobs:
  preflight:
    if: ${{ !contains(github.event.head_commit.message, '[viewport-preflight-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact repository output
        run: |
          pnpm exec prettier --write \
            AGENTS.md \
            README.md \
            apps/storefront/index.html \
            apps/storefront/src/StorefrontRoot.tsx \
            apps/storefront/src/app-shell.css \
            apps/storefront/src/loading-states.css \
            apps/storefront/src/main.tsx \
            apps/storefront/src/pwa.css \
            apps/storefront/src/section-ui.css \
            apps/storefront/src/storefront-viewport-runtime.ts \
            apps/storefront/src/styles.css \
            apps/storefront/src/theme-runtime.ts \
            apps/storefront/test/mobile-fixed-surface-ownership-contract.test.mjs \
            apps/storefront/test/product-detail-conversion-contract.test.mjs \
            apps/storefront/test/production-visual-system-contract.test.mjs \
            apps/storefront/test/storefront-full-polish-contract.test.mjs \
            apps/storefront/test/storefront-visual-viewport-contract.test.mjs \
            docs/storefront-viewport-runtime.md \
            scripts/check-repository-guardrails.mjs \
            tests/e2e/mobile-input-viewport.spec.ts \
            tests/e2e/production-smoke.spec.ts
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "chore: apply viewport preflight formatting [viewport-preflight-formatted]"
            git push
          fi
      - run: pnpm guardrails
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cf:check
