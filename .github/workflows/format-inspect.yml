name: Format Inspect

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'feat/storefront-mobile-visual-polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier apps/storefront/src/home-feed.css --write
          git diff -- apps/storefront/src/home-feed.css || true
