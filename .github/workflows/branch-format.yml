name: Branch Format

on:
  push:
    branches:
      - refine-media-pagination-product-drag

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refine-media-pagination-product-drag
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/admin/src/asset-library/MediaAssetPreviewDialog.tsx
          apps/admin/src/AssetLibraryView.tsx
          apps/admin/src/media-center-preview.css
          apps/admin/src/product-management/ProductTable.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/asset-library/MediaAssetPreviewDialog.tsx \
            apps/admin/src/AssetLibraryView.tsx \
            apps/admin/src/media-center-preview.css \
            apps/admin/src/product-management/ProductTable.tsx
          git commit -m "Format admin media and sorting changes"
          git push origin HEAD:refine-media-pagination-product-drag
