name: One-time Prettier Probe

on:
  push:
    branches: [fix/storefront-go-navigation]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          set -euo pipefail
          pnpm exec prettier tests/e2e/customer-service-cta-navigation.spec.ts --write
          git diff -- tests/e2e/customer-service-cta-navigation.spec.ts
