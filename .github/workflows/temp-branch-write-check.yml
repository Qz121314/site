name: Temp Branch Write Check

on:
  push:
    branches:
      - agent/storefront-bootstrap-theme-pwa

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-theme-pwa
      - name: Confirm branch workflow writeback
        run: |
          printf 'branch-workflow-ran\n' > .github/temp-branch-write-check-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temp-branch-write-check-result.txt
          git commit -m "Confirm branch workflow writeback"
          git push origin HEAD:agent/storefront-bootstrap-theme-pwa
