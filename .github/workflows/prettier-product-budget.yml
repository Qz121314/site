name: Prettier Product Budget

on:
  pull_request:
    paths:
      - 'apps/storefront/src/LegacyProductRoute.tsx'
      - 'apps/storefront/test/product-detail-request-budget-contract.test.mjs'
      - '.github/workflows/prettier-product-budget.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs
          if git diff --quiet -- \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs
          git commit -m 'style: apply Prettier to product detail budget'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
