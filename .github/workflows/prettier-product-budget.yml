name: Prettier Product Budget

on:
  pull_request:
    paths:
      - 'apps/storefront/src/ProductDetailPage.tsx'
      - 'apps/storefront/src/LegacyProductRoute.tsx'
      - 'apps/storefront/test/product-detail-request-budget-contract.test.mjs'
      - '.github/workflows/prettier-product-budget.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply typed placeholder and exact Prettier output
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const detailPath = 'apps/storefront/src/ProductDetailPage.tsx';
          const detail = fs.readFileSync(detailPath, 'utf8');
          const before = `  const query = useQuery({\n    queryKey: [\n      'storefront-product',\n      bootstrap.pointer.contentVersion,\n      sectionRef,\n      productRef,\n    ],\n    queryFn: ({ signal }) =>\n      loadProductSnapshot(bootstrap, productRef, signal, sectionRef),\n    placeholderData: knownProduct\n      ? placeholderProductSnapshot(bootstrap, knownProduct)\n      : undefined,\n    staleTime: Number.POSITIVE_INFINITY,\n  });`;
          const after = `  const query = useQuery<ProductSnapshot>({\n    queryKey: [\n      'storefront-product',\n      bootstrap.pointer.contentVersion,\n      sectionRef,\n      productRef,\n    ],\n    queryFn: ({ signal }) =>\n      loadProductSnapshot(bootstrap, productRef, signal, sectionRef),\n    ...(knownProduct\n      ? { placeholderData: placeholderProductSnapshot(bootstrap, knownProduct) }\n      : {}),\n    staleTime: Number.POSITIVE_INFINITY,\n  });`;
          if (!detail.includes(before)) throw new Error('Expected product query block not found');
          fs.writeFileSync(detailPath, detail.replace(before, after));

          const testPath = 'apps/storefront/test/product-detail-request-budget-contract.test.mjs';
          const contract = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = `  assert.ok(detail.includes('placeholderData: knownProduct'));`;
          const newAssertion = `  assert.ok(\n    detail.includes('placeholderData: placeholderProductSnapshot(bootstrap, knownProduct)'),\n  );`;
          if (!contract.includes(oldAssertion)) throw new Error('Expected placeholder contract assertion not found');
          fs.writeFileSync(testPath, contract.replace(oldAssertion, newAssertion));
          NODE
          pnpm exec prettier --write \
            apps/storefront/src/ProductDetailPage.tsx \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs
          if git diff --quiet -- \
            apps/storefront/src/ProductDetailPage.tsx \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/storefront/src/ProductDetailPage.tsx \
            apps/storefront/src/LegacyProductRoute.tsx \
            apps/storefront/test/product-detail-request-budget-contract.test.mjs
          git commit -m 'fix: type product detail placeholder data'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
