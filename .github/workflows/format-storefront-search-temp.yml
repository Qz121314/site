name: Temp Format Storefront Search

on:
  push:
    branches:
      - agent/storefront-search-index
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-search-index
      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format search files
        run: |
          pnpm exec prettier --write \
            apps/storefront/src/search-index.ts \
            apps/worker/test/public-search-index.test.mjs
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/storefront/src/search-index.ts apps/worker/test/public-search-index.test.mjs
          git commit -m "Format storefront search files"
          git push origin HEAD:agent/storefront-search-index
