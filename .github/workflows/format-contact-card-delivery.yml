name: Format contact card delivery

on:
  push:
    branches:
      - fix/contact-card-delivery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/contact-card-delivery
      - run: |
          node --version
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/storefront/src/support-contract.ts
          apps/storefront/src/support-media-gateway.ts
          apps/storefront/src/support-realtime.ts
          apps/storefront/test/chat-attachment-icon-contract.test.mjs
          apps/storefront/test/support-message-attachments.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/storefront/src/support-contract.ts \
            apps/storefront/src/support-media-gateway.ts \
            apps/storefront/src/support-realtime.ts \
            apps/storefront/test/chat-attachment-icon-contract.test.mjs \
            apps/storefront/test/support-message-attachments.test.mjs
          git commit -m "chore: format contact card delivery fix"
          git push origin HEAD:fix/contact-card-delivery
