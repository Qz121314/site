name: Product Detail Format Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          set -euo pipefail
          cp apps/storefront/src/ProductDetailPage.tsx /tmp/ProductDetailPage.tsx
          cp apps/storefront/src/product-detail-ui.css /tmp/product-detail-ui.css
          cp apps/storefront/src/product-detail-shell.css /tmp/product-detail-shell.css
          cp apps/storefront/test/product-detail-conversion-contract.test.mjs /tmp/product-detail-conversion-contract.test.mjs

          pnpm exec prettier --write \
            apps/storefront/src/ProductDetailPage.tsx \
            apps/storefront/src/product-detail-ui.css \
            apps/storefront/src/product-detail-shell.css \
            apps/storefront/test/product-detail-conversion-contract.test.mjs

          diff -u /tmp/ProductDetailPage.tsx apps/storefront/src/ProductDetailPage.tsx || true
          diff -u /tmp/product-detail-ui.css apps/storefront/src/product-detail-ui.css || true
          diff -u /tmp/product-detail-shell.css apps/storefront/src/product-detail-shell.css || true
          diff -u /tmp/product-detail-conversion-contract.test.mjs apps/storefront/test/product-detail-conversion-contract.test.mjs || true
