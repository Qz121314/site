name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: site-cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve active R2 custom domain
        id: r2_origin
        run: |
          set -euo pipefail
          preferred_result="$(pnpm exec wrangler d1 execute DB --remote --command "SELECT media_base_url FROM site_settings WHERE id = 1;" --json)"
          preferred="$(printf '%s' "$preferred_result" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const entries = Array.isArray(payload) ? payload : [payload];
            const row = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []).find(Boolean);
            if (typeof row?.media_base_url === "string") process.stdout.write(row.media_base_url.trim());
          ')"
          origin="$(PREFERRED_R2_PUBLIC_ORIGIN="$preferred" \
            R2_BUCKET_NAME='service-catalog-site-assets' \
            node scripts/resolve-r2-public-origin.mjs)"
          test -n "$origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Resolved active R2 custom-domain read origin: $origin"

          escaped_origin="${origin//\'/\'\'}"
          pnpm exec wrangler d1 execute DB --remote \
            --command "UPDATE site_settings SET media_base_url = '$escaped_origin' WHERE id = 1 AND COALESCE(media_base_url, '') <> '$escaped_origin';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify selected R2 custom domain
        env:
          R2_ORIGIN: ${{ steps.r2_origin.outputs.origin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domain="$(node -e 'process.stdout.write(new URL(process.env.R2_ORIGIN).hostname)')"
          pnpm exec wrangler r2 bucket domain get service-catalog-site-assets --domain "$domain"

      - name: Configure public R2 CORS
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bucket cors set service-catalog-site-assets \
            --file config/r2-public-cors.json \
            --force
          pnpm exec wrangler r2 bucket cors list service-catalog-site-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe direct R2 snapshot reads
        id: r2_probe
        env:
          R2_ORIGIN: ${{ steps.r2_origin.outputs.origin }}
        run: |
          set -euo pipefail
          probe_origin='https://storefront-probe.invalid'
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Origin: $probe_origin" \
            -D "$headers" \
            -o "$body" \
            -w '%{http_code}' \
            "$R2_ORIGIN/public/current.json" || true)"
          cors="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$headers")"
          json_ok=false
          if [[ "$status" =~ ^2 ]] && node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value.schemaVersion !== 1 && value.schemaVersion !== 2) process.exit(1);
          ' "$body"; then
            json_ok=true
          fi

          ready=false
          if [[ "$json_ok" == true && ( "$cors" == '*' || "$cors" == "$probe_origin" ) ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Direct R2 probe: HTTP $status, CORS='${cors:-missing}', ready=$ready"

          if [[ "$ready" != true ]]; then
            echo '::warning::DIRECT_R2_BLOCKED - Storefront will use its same-origin /public/* runtime fallback until the R2 custom domain becomes directly readable.'
            if grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$headers"; then
              echo 'Direct R2 diagnosis: Cloudflare challenge (cf-mitigated: challenge).'
            fi
            echo '--- direct R2 response headers ---'
            cat "$headers"
            echo '--- direct R2 response body preview ---'
            head -c 800 "$body" || true
            echo
          fi

      - name: Build production assets
        run: pnpm build
        env:
          VITE_PUBLIC_CONTENT_ORIGIN: ${{ steps.r2_origin.outputs.origin }}

      - name: Deploy business platform Worker
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --keep-vars | tee /tmp/wrangler-deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          R2_ORIGIN: ${{ steps.r2_origin.outputs.origin }}
          DIRECT_R2_READY: ${{ steps.r2_probe.outputs.ready }}
        run: |
          set -euo pipefail

          health="$(curl --fail --silent --show-error "$BASE_URL/api/health")"
          printf '%s' "$health" | grep -F '"ok":true'
          printf '%s' "$health" | grep -F '"environment":"production"'
          printf '%s' "$health" | grep -F '"publicLanguage":"en"'

          content_config="$(curl --fail --silent --show-error "$BASE_URL/api/public/storefront/content-origin")"
          printf '%s' "$content_config" | BASE_URL="$BASE_URL" node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync(0, "utf8"));
            if (value.contentOrigin !== process.env.BASE_URL) process.exit(1);
          '

          curl --fail --silent --show-error \
            -D /tmp/public-theme.headers \
            -o /tmp/public-theme.json \
            "$BASE_URL/api/public/theme"
          grep -Eqi '^content-type: application/json' /tmp/public-theme.headers
          grep -Eqi '^cache-control: public, max-age=30, must-revalidate' /tmp/public-theme.headers
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("/tmp/public-theme.json", "utf8"));
            const theme = value?.theme;
            const keys = new Set(["marketplace", "noir", "live", "saas", "travel", "tech", "custom"]);
            const tokenKeys = ["brand", "brandStrong", "text", "muted", "surface", "surfaceSoft", "line", "pageBg", "heroStart", "heroEnd", "heroGlow", "shadow"];
            if (!theme || !keys.has(theme.key)) process.exit(1);
            if (theme.colorScheme !== "light" && theme.colorScheme !== "dark") process.exit(1);
            if (theme.productMediaRatio !== "1:1") process.exit(1);
            if (!theme.tokens || tokenKeys.some((key) => typeof theme.tokens[key] !== "string" || !theme.tokens[key])) process.exit(1);
          '

          curl --fail --silent --show-error \
            -D /tmp/storefront-current.headers \
            -o /tmp/storefront-current.json \
            "$BASE_URL/public/current.json"
          grep -Eqi '^content-type: application/json' /tmp/storefront-current.headers
          grep -Eqi '^cache-control: public, max-age=30, must-revalidate' /tmp/storefront-current.headers
          node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('/tmp/storefront-current.json','utf8')); if(value.schemaVersion!==1&&value.schemaVersion!==2) process.exit(1);"
          curl --fail --silent --show-error --head "$BASE_URL/public/current.json" >/dev/null

          direct_headers="$(mktemp)"
          direct_body="$(mktemp)"
          direct_status="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Origin: $BASE_URL" \
            -D "$direct_headers" \
            -o "$direct_body" \
            -w '%{http_code}' \
            "$R2_ORIGIN/public/current.json" || true)"
          direct_cors="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' "$direct_headers")"
          if [[ "$direct_status" =~ ^2 ]] \
            && [[ "$direct_cors" == '*' || "$direct_cors" == "$BASE_URL" ]] \
            && node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (value.schemaVersion !== 1 && value.schemaVersion !== 2) process.exit(1);
            ' "$direct_body"; then
            echo 'DIRECT_R2_READ=ready'
          else
            echo '::warning::DIRECT_R2_READ=blocked - production remains available through the tested same-origin /public/* fallback.'
            echo "Direct R2 post-deploy status: HTTP $direct_status, CORS='${direct_cors:-missing}', predeploy_ready=$DIRECT_R2_READY"
            if grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$direct_headers"; then
              echo 'Direct R2 diagnosis: Cloudflare challenge (cf-mitigated: challenge).'
            fi
          fi

          auth_session="$(curl --fail --silent --show-error "$BASE_URL/api/admin/auth/session")"
          printf '%s' "$auth_session" | grep -F '"authenticated":false'

          auth_session_with_slash="$(curl --fail --silent --show-error "$BASE_URL/api/admin/auth/session/")"
          printf '%s' "$auth_session_with_slash" | grep -F '"authenticated":false'

          for path in / /admin/; do
            curl --fail --silent --show-error "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done

          for path in "/sections/storefront-smoke-${GITHUB_SHA}/" "/products/storefront-smoke-${GITHUB_SHA}/"; do
            curl --fail --silent --show-error \
              -H 'Accept: text/html' \
              -H 'Sec-Fetch-Mode: navigate' \
              "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done
