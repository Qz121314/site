name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_PUBLIC_CONTENT_ORIGIN: ${{ vars.PUBLIC_CONTENT_ORIGIN }}

      - name: Validate Worker bundle
        run: pnpm cf:check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: site-cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve active R2 custom domain
        id: public_content
        run: |
          set -euo pipefail
          preferred_result="$(pnpm exec wrangler d1 execute DB --remote --command "SELECT media_base_url FROM site_settings WHERE id = 1;" --json)"
          preferred="$(printf '%s' "$preferred_result" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const entries = Array.isArray(payload) ? payload : [payload];
            const row = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []).find(Boolean);
            if (typeof row?.media_base_url === "string") process.stdout.write(row.media_base_url.trim());
          ')"
          origin="$(PREFERRED_R2_PUBLIC_ORIGIN="$preferred" \
            R2_BUCKET_NAME='service-catalog-site-assets' \
            node scripts/resolve-r2-public-origin.mjs)"
          test -n "$origin"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Resolved active R2 read origin from bucket binding: $origin"

          escaped_origin="${origin//\'/\'\'}"
          pnpm exec wrangler d1 execute DB --remote \
            --command "UPDATE site_settings SET media_base_url = '$escaped_origin' WHERE id = 1 AND COALESCE(media_base_url, '') <> '$escaped_origin';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify selected R2 custom domain
        env:
          PUBLIC_CONTENT_ORIGIN: ${{ steps.public_content.outputs.origin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domain="$(node -e 'process.stdout.write(new URL(process.env.PUBLIC_CONTENT_ORIGIN).hostname)')"
          pnpm exec wrangler r2 bucket domain get service-catalog-site-assets --domain "$domain"

      - name: Build production assets
        run: pnpm build
        env:
          VITE_PUBLIC_CONTENT_ORIGIN: ${{ steps.public_content.outputs.origin }}

      - name: Configure public R2 CORS
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bucket cors set service-catalog-site-assets \
            --file config/r2-public-cors.json \
            --force
          pnpm exec wrangler r2 bucket cors list service-catalog-site-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy business platform Worker
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --keep-vars | tee /tmp/wrangler-deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_CONTENT_ORIGIN: ${{ steps.public_content.outputs.origin }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "$BASE_URL/api/health")"
          printf '%s' "$health" | grep -F '"ok":true'
          printf '%s' "$health" | grep -F '"environment":"production"'
          printf '%s' "$health" | grep -F '"publicLanguage":"en"'

          test -n "$PUBLIC_CONTENT_ORIGIN"
          r2_url="$PUBLIC_CONTENT_ORIGIN/public/current.json"

          plain_headers="$(mktemp)"
          plain_status="$(curl --silent --show-error \
            -D "$plain_headers" \
            -o /tmp/storefront-current-plain.json \
            -w '%{http_code}' \
            "$r2_url")"
          echo "R2 direct GET without Origin: HTTP $plain_status"
          if [[ ! "$plain_status" =~ ^2 ]]; then
            echo '--- R2 response headers (without Origin) ---'
            cat "$plain_headers"
            echo '--- R2 response body preview (without Origin) ---'
            head -c 1600 /tmp/storefront-current-plain.json || true
            echo
            if grep -Eqi '^cf-mitigated:' "$plain_headers"; then
              echo 'R2_DIAGNOSIS=WAF_OR_CHALLENGE'
            elif ! grep -Eqi '^cf-cache-status:' "$plain_headers"; then
              echo 'R2_DIAGNOSIS=HOTLINK_PROTECTION_OR_PRE_R2_BLOCK'
            else
              echo 'R2_DIAGNOSIS=R2_CUSTOM_DOMAIN_HTTP_ERROR'
            fi
            exit 22
          fi

          cors_headers="$(mktemp)"
          cors_status="$(curl --silent --show-error \
            -H "Origin: $BASE_URL" \
            -D "$cors_headers" \
            -o /tmp/storefront-current.json \
            -w '%{http_code}' \
            "$r2_url")"
          echo "R2 cross-origin GET: HTTP $cors_status"
          if [[ ! "$cors_status" =~ ^2 ]]; then
            echo '--- R2 response headers (with Origin) ---'
            cat "$cors_headers"
            echo '--- R2 response body preview (with Origin) ---'
            head -c 1600 /tmp/storefront-current.json || true
            echo
            if grep -Eqi '^cf-mitigated:' "$cors_headers"; then
              echo 'R2_DIAGNOSIS=WAF_OR_CHALLENGE'
            elif ! grep -Eqi '^cf-cache-status:' "$cors_headers"; then
              echo 'R2_DIAGNOSIS=HOTLINK_PROTECTION_OR_PRE_R2_BLOCK'
            else
              echo 'R2_DIAGNOSIS=R2_CUSTOM_DOMAIN_HTTP_ERROR'
            fi
            exit 22
          fi
          grep -Eqi '^access-control-allow-origin: (\*|https://[^[:space:]]+)\r?$' "$cors_headers"
          node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('/tmp/storefront-current.json','utf8')); if(value.schemaVersion!==1&&value.schemaVersion!==2) process.exit(1);"

          auth_session="$(curl --fail --silent --show-error "$BASE_URL/api/admin/auth/session")"
          printf '%s' "$auth_session" | grep -F '"authenticated":false'

          auth_session_with_slash="$(curl --fail --silent --show-error "$BASE_URL/api/admin/auth/session/")"
          printf '%s' "$auth_session_with_slash" | grep -F '"authenticated":false'

          for path in / /admin/; do
            curl --fail --silent --show-error "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done

          for path in "/sections/storefront-smoke-${GITHUB_SHA}/" "/products/storefront-smoke-${GITHUB_SHA}/"; do
            curl --fail --silent --show-error \
              -H 'Accept: text/html' \
              -H 'Sec-Fetch-Mode: navigate' \
              "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done
