name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --local --env preview

      - name: Validate Worker bundle
        run: pnpm cf:check

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: site-cloudflare-preview
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --env preview | tee /tmp/wrangler-preview.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply preview D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test preview
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "$BASE_URL/api/health")"
          printf '%s' "$health" | grep -F '"ok":true'
          printf '%s' "$health" | grep -F '"environment":"preview"'
          for path in /en/ /es/ /admin/; do
            curl --fail --silent --show-error "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done
          curl --fail --silent --show-error "$BASE_URL/en/manifest.webmanifest" | grep -F '"lang": "en"'
          curl --fail --silent --show-error "$BASE_URL/es/manifest.webmanifest" | grep -F '"lang": "es"'
          auth_status="$(curl --silent --output /tmp/admin-session.json --write-out '%{http_code}' "$BASE_URL/api/admin/auth/session")"
          test "$auth_status" = '401'
          grep -F '"code":"AUTH_REQUIRED"' /tmp/admin-session.json

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: site-cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy production to Cloudflare
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --env production | tee /tmp/wrangler-production.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-production.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error "$BASE_URL/api/health")"
          printf '%s' "$health" | grep -F '"ok":true'
          printf '%s' "$health" | grep -F '"environment":"production"'
          for path in /en/ /es/ /admin/; do
            curl --fail --silent --show-error "$BASE_URL$path" | grep -F '<div id="root"></div>'
          done
          auth_status="$(curl --silent --output /tmp/admin-session.json --write-out '%{http_code}' "$BASE_URL/api/admin/auth/session")"
          test "$auth_status" = '401'
          grep -F '"code":"AUTH_REQUIRED"' /tmp/admin-session.json
