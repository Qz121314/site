name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Force a production Worker deploy even when the classifier reports no deploy-impacting diff
        required: false
        default: false
        type: boolean
      force_cloudflare_validation:
        description: Force migration/R2/deep production validation for an explicit operator-run release check
        required: false
        default: false
        type: boolean
      force_d1_migrations:
        description: Explicitly run remote D1 migration recovery/apply without a migration diff (main only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: site-deploy-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      deployed: ${{ steps.deploy.outputs.deployed }}
      production_browser_relevant: ${{ steps.changes.outputs.production_browser_relevant }}
      force_cloudflare_validation: ${{ steps.manual.outputs.force_cloudflare_validation }}
      force_d1_migrations: ${{ steps.manual.outputs.force_d1_migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve manual release flags
        id: manual
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy || false }}
          FORCE_CLOUDFLARE_VALIDATION: ${{ inputs.force_cloudflare_validation || false }}
          FORCE_D1_MIGRATIONS: ${{ inputs.force_d1_migrations || false }}
        run: |
          echo "force_deploy=$FORCE_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "force_cloudflare_validation=$FORCE_CLOUDFLARE_VALIDATION" >> "$GITHUB_OUTPUT"
          echo "force_d1_migrations=$FORCE_D1_MIGRATIONS" >> "$GITHUB_OUTPUT"

      - name: Classify Cloudflare-impacting changes
        id: changes
        env:
          CF_CHANGE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/classify-cloudflare-changes.mjs --head "$GITHUB_SHA"

      - name: Publish Cloudflare classification summary
        env:
          MIGRATION_CHANGED: ${{ steps.changes.outputs.migration_changed }}
          R2_VALIDATION_REQUIRED: ${{ steps.changes.outputs.r2_validation_required }}
          DEPLOY_REQUIRED: ${{ steps.changes.outputs.deploy_required }}
          BROWSER_RELEVANT: ${{ steps.changes.outputs.production_browser_relevant }}
          FORCE_DEPLOY: ${{ steps.manual.outputs.force_deploy }}
          FORCE_CF: ${{ steps.manual.outputs.force_cloudflare_validation }}
          FORCE_D1_MIGRATIONS: ${{ steps.manual.outputs.force_d1_migrations }}
        run: |
          {
            echo '## Cloudflare change classification'
            echo '```text'
            echo "migration_changed=${{ steps.changes.outputs.migration_changed }}"
            echo "worker_changed=${{ steps.changes.outputs.worker_changed }}"
            echo "storefront_changed=${{ steps.changes.outputs.storefront_changed }}"
            echo "admin_changed=${{ steps.changes.outputs.admin_changed }}"
            echo "r2_config_changed=${{ steps.changes.outputs.r2_config_changed }}"
            echo "wrangler_config_changed=${{ steps.changes.outputs.wrangler_config_changed }}"
            echo "wrangler_worker_config_changed=${{ steps.changes.outputs.wrangler_worker_config_changed }}"
            echo "wrangler_d1_config_changed=${{ steps.changes.outputs.wrangler_d1_config_changed }}"
            echo "wrangler_r2_config_changed=${{ steps.changes.outputs.wrangler_r2_config_changed }}"
            echo "wrangler_assets_config_changed=${{ steps.changes.outputs.wrangler_assets_config_changed }}"
            echo "public_runtime_changed=${{ steps.changes.outputs.public_runtime_changed }}"
            echo "production_browser_relevant=${{ steps.changes.outputs.production_browser_relevant }}"
            echo "deploy_required=${{ steps.changes.outputs.deploy_required }}"
            echo "docs_only=${{ steps.changes.outputs.docs_only }}"
            echo "verification_profile=${{ steps.changes.outputs.verification_profile }}"
            echo '```'
            if [[ "$MIGRATION_CHANGED" != true && "$FORCE_D1_MIGRATIONS" != true ]]; then echo 'Skip remote D1: no migration diff or explicit migration override.'; fi
            if [[ "$R2_VALIDATION_REQUIRED" != true && "$FORCE_CF" != true ]]; then echo 'Skip R2 validation: no R2 config diff.'; fi
            if [[ "$DEPLOY_REQUIRED" != true && "$FORCE_DEPLOY" != true ]]; then echo 'Skip production deploy: no deploy-impacting diff.'; fi
            if [[ "$BROWSER_RELEVANT" != true && "$FORCE_CF" != true ]]; then echo 'Skip production browser acceptance: no relevant public/browser diff.'; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full local-first verification
        if: steps.changes.outputs.verification_profile == 'full'
        run: pnpm verify

      - name: Cloudflare-only verification
        if: steps.changes.outputs.verification_profile == 'cloudflare'
        run: pnpm guardrails && pnpm format && pnpm lint && pnpm typecheck

      - name: Tests-only verification
        if: steps.changes.outputs.verification_profile == 'tests'
        run: pnpm guardrails && pnpm test

      - name: Quality-only verification
        if: steps.changes.outputs.verification_profile == 'quality'
        run: pnpm guardrails && pnpm format && pnpm lint && pnpm typecheck

      - name: Docs-only verification
        if: steps.changes.outputs.verification_profile == 'docs'
        run: pnpm guardrails && pnpm format

      - name: Verify published bootstrap compatibility
        if: github.ref == 'refs/heads/main' && ((steps.changes.outputs.public_runtime_changed == 'true' && steps.changes.outputs.deploy_required == 'true') || steps.manual.outputs.force_deploy == 'true')
        run: node scripts/check-storefront-bootstrap-compatibility.mjs
        env:
          R2_BUCKET_NAME: service-catalog-site-assets
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record D1 recovery bookmark
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.migration_changed == 'true' || steps.manual.outputs.force_d1_migrations == 'true')
        run: pnpm exec wrangler d1 time-travel info DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.migration_changed == 'true' || steps.manual.outputs.force_d1_migrations == 'true')
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Read R2 validation metadata from production D1
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.r2_validation_required == 'true' || steps.manual.outputs.force_cloudflare_validation == 'true')
        id: r2_origin
        run: |
          set -euo pipefail
          configured_result="$(pnpm exec wrangler d1 execute DB --remote --command "SELECT media_base_url, (SELECT object_key FROM media_assets WHERE status = 'ready' AND deleted_at IS NULL ORDER BY updated_at DESC LIMIT 1) AS media_object_key FROM site_settings WHERE id = 1;" --json)"
          configured="$(printf '%s' "$configured_result" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const entries = Array.isArray(payload) ? payload : [payload];
            const row = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []).find(Boolean);
            if (typeof row?.media_base_url === "string") process.stdout.write(row.media_base_url.trim());
          ')"
          media_key="$(printf '%s' "$configured_result" | node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const entries = Array.isArray(payload) ? payload : [payload];
            const row = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []).find(Boolean);
            if (typeof row?.media_object_key === "string") process.stdout.write(row.media_object_key.trim());
          ')"
          echo "media_key=$media_key" >> "$GITHUB_OUTPUT"

          if [[ -z "$configured" ]]; then
            echo '::warning::R2 custom domain is not configured in Admin > Site Settings.'
            echo 'origin=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          origin="$(PREFERRED_R2_PUBLIC_ORIGIN="$configured" R2_BUCKET_NAME='service-catalog-site-assets' node scripts/resolve-r2-public-origin.mjs)"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "Verified admin-configured R2 custom-domain read origin: $origin"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify selected R2 custom domain
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.r2_validation_required == 'true' || steps.manual.outputs.force_cloudflare_validation == 'true') && steps.r2_origin.outputs.origin != ''
        env:
          R2_ORIGIN: ${{ steps.r2_origin.outputs.origin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          domain="$(node -e 'process.stdout.write(new URL(process.env.R2_ORIGIN).hostname)')"
          pnpm exec wrangler r2 bucket domain get service-catalog-site-assets --domain "$domain"

      - name: Configure and verify public R2 CORS
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.r2_validation_required == 'true' || steps.manual.outputs.force_cloudflare_validation == 'true')
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 bucket cors set service-catalog-site-assets --file config/r2-public-cors.json --force
          pnpm exec wrangler r2 bucket cors list service-catalog-site-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe direct R2 media reads
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.r2_validation_required == 'true' || steps.manual.outputs.force_cloudflare_validation == 'true')
        env:
          R2_ORIGIN: ${{ steps.r2_origin.outputs.origin }}
          MEDIA_OBJECT_KEY: ${{ steps.r2_origin.outputs.media_key }}
        run: |
          set -euo pipefail
          if [[ -z "$R2_ORIGIN" ]]; then
            echo '::warning::DIRECT_R2_NOT_CONFIGURED - configure and test the R2 custom domain in Admin > Site Settings.'
            exit 0
          fi
          if [[ -z "$MEDIA_OBJECT_KEY" ]]; then
            echo '::warning::DIRECT_R2_MEDIA_UNTESTED - no ready media asset exists yet.'
            exit 0
          fi
          media_path="$(MEDIA_OBJECT_KEY="$MEDIA_OBJECT_KEY" node -e '
            const key = process.env.MEDIA_OBJECT_KEY;
            const segments = key.split("/");
            if (segments.some((segment) => !segment || segment === "." || segment === "..")) process.exit(1);
            process.stdout.write(segments.map(encodeURIComponent).join("/"));
          ')"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --range 0-0 -H 'Origin: https://storefront-probe.invalid' -D "$headers" -o "$body" -w '%{http_code}' "$R2_ORIGIN/$media_path")"
          test "$status" = '206'
          test "$(wc -c < "$body")" = '1'
          grep -Eqi '^content-type: (image|video)/' "$headers"
          grep -Eqi '^access-control-allow-origin: (\*|https://storefront-probe\.invalid)' "$headers"
          echo 'DIRECT_R2_MEDIA_READ=ready'

      - name: Deploy business platform Workers
        if: github.ref == 'refs/heads/main' && (steps.changes.outputs.deploy_required == 'true' || steps.manual.outputs.force_deploy == 'true')
        id: deploy
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --keep-vars | tee /tmp/wrangler-deploy.log
          pnpm exec wrangler deploy --config wrangler.h5.jsonc --keep-vars | tee /tmp/wrangler-h5-deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1)"
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/wrangler-deploy.log | tail -n 1 | awk '{print $4}')"
          h5_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-h5-deploy.log | tail -n 1)"
          h5_version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/wrangler-h5-deploy.log | tail -n 1 | awk '{print $4}')"
          test -n "$url"
          test -n "$version_id"
          test -n "$h5_url"
          test -n "$h5_version_id"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Minimal production smoke
        if: steps.deploy.outputs.deployed == 'true'
        run: node scripts/production-smoke.mjs
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_WORKER_VERSION_ID: ${{ steps.deploy.outputs.version_id }}

      - name: Deep production HTTP acceptance
        if: steps.deploy.outputs.deployed == 'true' && (steps.changes.outputs.deep_smoke_relevant == 'true' || steps.manual.outputs.force_cloudflare_validation == 'true')
        run: node scripts/production-deep-smoke.mjs
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}

  production-browser-acceptance:
    name: Production Browser Acceptance
    if: needs.pipeline.outputs.deployed == 'true' && (needs.pipeline.outputs.production_browser_relevant == 'true' || needs.pipeline.outputs.force_cloudflare_validation == 'true')
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Browser acceptance test production
        timeout-minutes: 5
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ needs.pipeline.outputs.deployment_url }}

      - name: Upload production browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-acceptance-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
