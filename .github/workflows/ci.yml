name: Apply original media aspect ratios

on:
  push:
    branches:
      - fix/media-center-square-thumbnails

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-center-square-thumbnails
          fetch-depth: 0

      - name: Apply media preview fix
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          css_path = Path('apps/admin/src/media-center.css')
          css = css_path.read_text()

          css = css.replace('  min-height: 38px;\n', '  min-height: 32px;\n', 1)
          css = css.replace('  gap: 16px;\n', '  gap: 10px;\n', 1)
          css = css.replace('  padding: 0 2px 6px;\n', '  padding: 0 2px 4px;\n', 1)

          start = css.index('.media-center-heading::after {')
          end = css.index('\n}\n', start) + 3
          css = css[:start] + css[end:]

          preview_start = css.index('.media-center-preview {')
          preview_end = css.index('\n}\n', preview_start) + 3
          preview = css[preview_start:preview_end]
          preview = preview.replace('  aspect-ratio: 4 / 3;\n', '')
          css = css[:preview_start] + preview + css[preview_end:]

          media_start = css.index('.media-center-preview img,')
          media_end = css.index('\n}\n', media_start) + 3
          media = css[media_start:media_end]
          media = media.replace(
              '  width: 100%;\n  height: 100%;\n  object-fit: cover;\n',
              '  display: block;\n  width: 100%;\n  height: auto;\n',
          )
          css = css[:media_start] + media + css[media_end:]

          helper_start = css.index('.media-center-upload-bar > small {')
          helper_end = css.index('\n}\n', helper_start) + 3
          css = css[:helper_start] + '.media-center-upload-bar > small {\n  display: none;\n}\n\n' + css[helper_end:]

          responsive_heading = '''  .media-center-heading::after {
            display: none;
          }

'''
          css = css.replace(responsive_heading, '', 1)
          css_path.write_text(css)

          test_path = Path('apps/admin/test/media-center-density-contract.test.mjs')
          test = test_path.read_text()
          old = "  assert.match(cssSource, /aspect-ratio: 4 \\/ 3/);\n"
          new = "  assert.doesNotMatch(cssSource, /\\.media-center-preview\\s*\\{[^}]*aspect-ratio/s);\n  assert.match(cssSource, /\\.media-center-preview img,[\\s\\S]*height: auto/);\n  assert.doesNotMatch(cssSource, /\\.media-center-preview img,[\\s\\S]*object-fit: cover/);\n"
          if old not in test:
              raise SystemExit('old ratio contract not found')
          test_path.write_text(test.replace(old, new, 1))

          Path('.github/workflows/agent-media-original-ratio.yml').unlink(missing_ok=True)
          PY

          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve original media preview ratios"
          git push origin HEAD:fix/media-center-square-thumbnails
