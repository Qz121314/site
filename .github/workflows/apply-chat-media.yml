name: Apply chat image UI

on:
  push:
    branches: [feat/chat-media]
    paths:
      - scripts/patch-messages-image-ui.mjs
      - scripts/patch-support-ui-media.mjs
      - .github/workflows/apply-chat-media.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-media
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/patch-messages-image-ui.mjs
      - run: node scripts/patch-support-ui-media.mjs
      - run: pnpm exec prettier --write apps/storefront/src/MessagesPage.tsx apps/storefront/src/support-ui.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/MessagesPage.tsx apps/storefront/src/support-ui.tsx
          git commit -m "接入访客图片聊天UI"
          git push origin HEAD:feat/chat-media
