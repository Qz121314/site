name: Apply Home Layout Snapshot Patch

on:
  push:
    branches: [fix/publish-home-layout-in-site-snapshot]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[home-layout-patch]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout patch branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Apply published Home Layout patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          publisher = 'apps/worker/src/publishing/modular-publisher.ts'
          replace_once(
              publisher,
              "} from '../products/product-tags';\n\nconst CURRENT_KEY",
              "} from '../products/product-tags';\nimport { getHomeLayout, type HomeLayout } from '../settings/home-layout';\n\nconst CURRENT_KEY",
          )
          replace_once(
              publisher,
              "type Source = {\n  site: SiteRow;\n  heroSlides: HeroSlideRow[];\n  sections: SectionRow[];",
              "type Source = {\n  site: SiteRow;\n  heroSlides: HeroSlideRow[];\n  homeLayout: HomeLayout;\n  sections: SectionRow[];",
          )
          replace_once(
              publisher,
              "  const [publicTags, tagsByProduct] = await Promise.all([\n    listEnabledPublicProductTags(db),\n    listProductTagsByProductIds(\n      db,\n      products.map((product) => product.id),\n      true,\n    ),\n  ]);",
              "  const [publicTags, tagsByProduct, homeLayout] = await Promise.all([\n    listEnabledPublicProductTags(db),\n    listProductTagsByProductIds(\n      db,\n      products.map((product) => product.id),\n      true,\n    ),\n    getHomeLayout(db),\n  ]);",
          )
          replace_once(
              publisher,
              "  return {\n    site,\n    heroSlides,\n    sections,",
              "  return {\n    site,\n    heroSlides,\n    homeLayout,\n    sections,",
          )
          replace_once(
              publisher,
              "function sitePublicModel(site: SiteRow, heroSlides: HeroSlideRow[]) {",
              "function sitePublicModel(\n  site: SiteRow,\n  heroSlides: HeroSlideRow[],\n  homeLayout: HomeLayout,\n) {",
          )
          replace_once(
              publisher,
              "    homeSectionLimit: site.home_section_limit,\n    hero:",
              "    homeSectionLimit: site.home_section_limit,\n    homeLayout,\n    hero:",
          )
          replace_once(
              publisher,
              "    const site = sitePublicModel(source.site, source.heroSlides);",
              "    const site = sitePublicModel(source.site, source.heroSlides, source.homeLayout);",
          )

          content = 'apps/storefront/src/content.ts'
          replace_once(
              content,
              "export type PublicHero = {\n  slides: PublicHeroSlide[];\n};\n\nexport type PublicSite = {",
              "export type PublicHero = {\n  slides: PublicHeroSlide[];\n};\n\nexport type HomeLayout = {\n  shortcutSectionIds: string[];\n  recommendationSectionIds: string[];\n};\n\nexport type PublicSite = {",
          )
          replace_once(
              content,
              "  logoUrl: string | null;\n  homeSectionLimit?: number;\n  hero?: PublicHero | null;",
              "  logoUrl: string | null;\n  homeSectionLimit?: number;\n  homeLayout?: HomeLayout;\n  hero?: PublicHero | null;",
          )
          replace_once(
              content,
              "    logoObjectKey: string | null;\n    homeSectionLimit: number;\n    hero?: {",
              "    logoObjectKey: string | null;\n    homeSectionLimit: number;\n    homeLayout?: HomeLayout;\n    hero?: {",
          )
          replace_once(
              content,
              "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nexport function normalizeContentOrigin",
              "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nfunction normalizeHomeLayoutSectionIds(value: unknown, max: number): string[] {\n  if (!Array.isArray(value)) return [];\n  const output: string[] = [];\n  const seen = new Set<string>();\n  for (const item of value) {\n    if (\n      typeof item !== 'string' ||\n      !item ||\n      item.length > 120 ||\n      seen.has(item)\n    ) {\n      continue;\n    }\n    seen.add(item);\n    output.push(item);\n    if (output.length === max) break;\n  }\n  return output;\n}\n\nfunction normalizeHomeLayout(value: unknown): HomeLayout {\n  if (!isRecord(value)) {\n    return { shortcutSectionIds: [], recommendationSectionIds: [] };\n  }\n  return {\n    shortcutSectionIds: normalizeHomeLayoutSectionIds(value.shortcutSectionIds, 7),\n    recommendationSectionIds: normalizeHomeLayoutSectionIds(\n      value.recommendationSectionIds,\n      3,\n    ),\n  };\n}\n\nexport function normalizeContentOrigin",
          )
          replace_once(
              content,
              "    logoUrl: mediaUrl(mediaBaseUrl, rawSite.site.logoObjectKey),\n    homeSectionLimit: rawSite.site.homeSectionLimit,\n    hero: resolveV2Hero",
              "    logoUrl: mediaUrl(mediaBaseUrl, rawSite.site.logoObjectKey),\n    homeSectionLimit: rawSite.site.homeSectionLimit,\n    homeLayout: normalizeHomeLayout(rawSite.site.homeLayout),\n    hero: resolveV2Hero",
          )

          Path('apps/storefront/src/home-layout.ts').write_text("""import type { HomeLayout } from './content';\n\nexport type { HomeLayout } from './content';\n\nfunction resolveIds(\n  configuredIds: string[] | undefined,\n  fallbackIds: string[],\n  publishedSectionIds: ReadonlySet<string>,\n  max: number,\n): string[] {\n  const configured = (configuredIds ?? []).filter((id) => publishedSectionIds.has(id));\n  if (configured.length > 0) return configured.slice(0, max);\n  return fallbackIds.filter((id) => publishedSectionIds.has(id)).slice(0, max);\n}\n\nexport function resolveHomeLayout(\n  configured: HomeLayout | null | undefined,\n  fallback: HomeLayout,\n  publishedSectionIds: ReadonlySet<string>,\n): HomeLayout {\n  return {\n    shortcutSectionIds: resolveIds(\n      configured?.shortcutSectionIds,\n      fallback.shortcutSectionIds,\n      publishedSectionIds,\n      7,\n    ),\n    recommendationSectionIds: resolveIds(\n      configured?.recommendationSectionIds,\n      fallback.recommendationSectionIds,\n      publishedSectionIds,\n      3,\n    ),\n  };\n}\n""")

          feed = 'apps/storefront/src/HomeFeed.tsx'
          replace_once(
              feed,
              "import { loadHomeLayout, resolveHomeLayout } from './home-layout';",
              "import { resolveHomeLayout } from './home-layout';",
          )
          replace_once(
              feed,
              "  const layoutQuery = useQuery({\n    queryKey: ['storefront-home-layout', bootstrap.pointer.contentVersion],\n    queryFn: ({ signal }) => loadHomeLayout(bootstrap.pointer.contentVersion, signal),\n    staleTime: 30_000,\n  });\n",
              "",
          )
          replace_once(
              feed,
              "  const layout = resolveHomeLayout(layoutQuery.data, fallbackLayout, publishedSectionIds);",
              "  const layout = resolveHomeLayout(site.homeLayout, fallbackLayout, publishedSectionIds);",
          )

          settings = 'apps/worker/src/settings/home-layout.ts'
          replace_once(
              settings,
              "export function filterHomeLayoutByPublishedSections(\n  layout: HomeLayout,\n  publishedSectionIds: ReadonlySet<string>,\n): HomeLayout {\n  return {\n    shortcutSectionIds: layout.shortcutSectionIds.filter((id) =>\n      publishedSectionIds.has(id),\n    ),\n    recommendationSectionIds: layout.recommendationSectionIds.filter((id) =>\n      publishedSectionIds.has(id),\n    ),\n  };\n}\n\n",
              "",
          )

          index = 'apps/worker/src/index.ts'
          replace_once(
              index,
              "import { publicHomeLayoutRoutes } from './routes/public-home-layout';\n",
              "",
          )
          replace_once(
              index,
              "app.route('/api/public/home-layout', publicHomeLayoutRoutes);\n",
              "",
          )

          public_route = Path('apps/worker/src/routes/public-home-layout.ts')
          if not public_route.exists():
              raise SystemExit('public Home Layout route is already missing')
          public_route.unlink()

          Path('apps/worker/test/home-layout.test.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\nimport { validateHomeLayoutInput } from '../src/settings/home-layout.ts';\n\nconst migrationSource = await readFile(\n  new URL('../../../migrations/0019_home_layout.sql', import.meta.url),\n  'utf8',\n);\nconst adminRouteSource = await readFile(\n  new URL('../src/routes/admin-site-settings.ts', import.meta.url),\n  'utf8',\n);\nconst publisherSource = await readFile(\n  new URL('../src/publishing/modular-publisher.ts', import.meta.url),\n  'utf8',\n);\nconst workerIndexSource = await readFile(new URL('../src/index.ts', import.meta.url), 'utf8');\n\ntest('home layout accepts at most seven shortcuts and three recommendation sections', () => {\n  const result = validateHomeLayoutInput({\n    shortcutSectionIds: ['s1', 's2', 's3', 's4', 's5', 's6', 's7'],\n    recommendationSectionIds: ['s1', 's3', 's5'],\n  });\n  assert.equal(result.ok, true);\n  assert.equal(result.ok && result.provided, true);\n});\n\ntest('home layout rejects overflow and duplicate slots', () => {\n  assert.equal(\n    validateHomeLayoutInput({\n      shortcutSectionIds: ['1', '2', '3', '4', '5', '6', '7', '8'],\n      recommendationSectionIds: [],\n    }).ok,\n    false,\n  );\n  assert.equal(\n    validateHomeLayoutInput({\n      shortcutSectionIds: ['one', 'one'],\n      recommendationSectionIds: [],\n    }).ok,\n    false,\n  );\n  assert.equal(\n    validateHomeLayoutInput({\n      shortcutSectionIds: [],\n      recommendationSectionIds: ['one', 'two', 'three', 'four'],\n    }).ok,\n    false,\n  );\n});\n\ntest('home layout is part of the immutable Site publication source', () => {\n  assert.match(publisherSource, /getHomeLayout/u);\n  assert.match(publisherSource, /homeLayout:\\s*HomeLayout/u);\n  assert.match(\n    publisherSource,\n    /sitePublicModel\\(source\\.site, source\\.heroSlides, source\\.homeLayout\\)/u,\n  );\n  assert.match(publisherSource, /homeSectionLimit:\\s*site\\.home_section_limit,\\s*homeLayout,/u);\n});\n\ntest('home layout remains Admin-edited but is not exposed through a realtime public D1 route', () => {\n  assert.match(migrationSource, /placement IN \\('shortcut', 'recommendation'\\)/u);\n  assert.match(migrationSource, /placement = 'shortcut' AND sort_order BETWEEN 0 AND 6/u);\n  assert.match(\n    migrationSource,\n    /placement = 'recommendation' AND sort_order BETWEEN 0 AND 2/u,\n  );\n  assert.match(adminRouteSource, /validateHomeLayoutInput/u);\n  assert.match(adminRouteSource, /getActiveHomeSectionIds/u);\n  assert.doesNotMatch(workerIndexSource, /publicHomeLayoutRoutes/u);\n});\n""")

          home_feed_test = 'apps/storefront/test/home-feed-contract.test.mjs'
          replace_once(
              home_feed_test,
              "test('Home layout is version-bound runtime config with safe published-content fallback', () => {\n  assert.match(layoutSource, /fetch\\('\\/api\\/public\\/home-layout\\/'/u);\n  assert.match(layoutSource, /expectedPointerVersion/u);\n  assert.match(layoutSource, /body\\.pointerVersion !== expectedPointerVersion/u);\n  assert.match(layoutSource, /resolveHomeLayout/u);\n  assert.match(feedSource, /bootstrap\\.pointer\\.contentVersion/u);\n  assert.match(feedSource, /fallbackRecommendationSectionIds\\(bootstrap\\)/u);\n  assert.match(feedSource, /resolveHomeLayout\\(/u);\n});",
              "test('Home layout comes from the published Site snapshot with published-content auto mode', () => {\n  assert.doesNotMatch(layoutSource, /fetch\\(/u);\n  assert.doesNotMatch(feedSource, /loadHomeLayout|storefront-home-layout/u);\n  assert.match(layoutSource, /resolveHomeLayout/u);\n  assert.match(feedSource, /site\\.homeLayout/u);\n  assert.match(feedSource, /fallbackRecommendationSectionIds\\(bootstrap\\)/u);\n  assert.match(feedSource, /resolveHomeLayout\\(/u);\n});",
          )

          Path('apps/storefront/test/home-layout-snapshot-contract.test.mjs').write_text("""import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst contentSource = await readFile(new URL('../src/content.ts', import.meta.url), 'utf8');\nconst feedSource = await readFile(new URL('../src/HomeFeed.tsx', import.meta.url), 'utf8');\nconst layoutSource = await readFile(new URL('../src/home-layout.ts', import.meta.url), 'utf8');\n\ntest('schema-v2 Site snapshots carry Home Layout into Storefront bootstrap', () => {\n  assert.match(contentSource, /homeLayout\\?: HomeLayout/u);\n  assert.match(contentSource, /homeLayout:\\s*normalizeHomeLayout\\(rawSite\\.site\\.homeLayout\\)/u);\n  assert.match(feedSource, /resolveHomeLayout\\(site\\.homeLayout,/u);\n});\n\ntest('Home Layout resolution is pure published-state logic with no runtime API fetch', () => {\n  assert.doesNotMatch(layoutSource, /fetch\\(/u);\n  assert.doesNotMatch(feedSource, /loadHomeLayout/u);\n  assert.match(layoutSource, /publishedSectionIds/u);\n});\n""")
          PY

          if grep -R --line-number --fixed-strings '/api/public/home-layout' apps; then
            echo 'Legacy public Home Layout endpoint reference remains.' >&2
            exit 1
          fi

      - name: Format and verify focused tests
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/worker/src/publishing/modular-publisher.ts \
            apps/worker/src/settings/home-layout.ts \
            apps/worker/src/index.ts \
            apps/worker/test/home-layout.test.mjs \
            apps/storefront/src/content.ts \
            apps/storefront/src/HomeFeed.tsx \
            apps/storefront/src/home-layout.ts \
            apps/storefront/test/home-feed-contract.test.mjs \
            apps/storefront/test/home-layout-snapshot-contract.test.mjs
          pnpm --filter @site/worker test
          pnpm --filter @site/storefront test
          git diff --check

      - name: Commit patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No patch changes produced.' >&2; exit 1; }
          git commit -m '[home-layout-patch] Publish Home Layout in Site snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
