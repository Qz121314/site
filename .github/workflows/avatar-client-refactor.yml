name: Avatar Client Refactor

on:
  push:
    branches:
      - feature/customer-service-agent-avatar

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-service-agent-avatar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-agent-avatar-client-refactor.mjs
      - run: npx prettier --write apps/storefront/src/support-gateway.ts apps/storefront/src/support-realtime.ts apps/storefront/src/support-ui.tsx
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/support-gateway.ts apps/storefront/src/support-realtime.ts apps/storefront/src/support-ui.tsx
          git commit -m "Render customer-service agent avatars in storefront chat"
          git push origin HEAD:feature/customer-service-agent-avatar
