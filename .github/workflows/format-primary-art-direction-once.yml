name: Format Primary Art Direction Once

on:
  push:
    branches:
      - refactor/storefront-primary-surface-art-direction

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storefront-primary-surface-art-direction
          fetch-depth: 0
      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, restore CI script, and self-clean
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- package.json
          pnpm exec prettier --write \
            apps/storefront/test/storefront-full-polish-contract.test.mjs \
            packages/storefront-ui/src/art-direction-primary-surfaces.css
          git rm .github/workflows/format-primary-art-direction-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json \
            apps/storefront/test/storefront-full-polish-contract.test.mjs \
            packages/storefront-ui/src/art-direction-primary-surfaces.css
          git commit -m "style(storefront): format primary art direction"
          git push origin HEAD:refactor/storefront-primary-surface-art-direction
