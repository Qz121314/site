name: Cleanup stale Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-cloudflare-workers.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove historical project Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          before="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          printf '%s' "$before" | jq -e '.success == true' >/dev/null
          printf '%s' "$before" | jq -e '.result[] | select(.id == "service-catalog-site")' >/dev/null

          removed='[]'
          for stale in service-catalog-site-preview service-catalog-site-dev service-catalog-site-production; do
            if printf '%s' "$before" | jq -e --arg stale "$stale" '.result[] | select(.id == $stale)' >/dev/null; then
              echo "Deleting stale Worker: $stale"
              status="$(curl --silent --show-error -o /tmp/cloudflare-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "$api/$stale?force=true")"
              test "$status" = "200" -o "$status" = "204"
              removed="$(printf '%s' "$removed" | jq --arg stale "$stale" '. + [$stale]')"
            fi
          done

          after="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          printf '%s' "$after" | jq -e '.success == true' >/dev/null
          printf '%s' "$after" | jq -e '.result[] | select(.id == "service-catalog-site")' >/dev/null
          ! printf '%s' "$after" | jq -e '.result[] | select(.id == "service-catalog-site-preview" or .id == "service-catalog-site-dev" or .id == "service-catalog-site-production")' >/dev/null

          mkdir -p ops
          jq -n \
            --arg kept "service-catalog-site" \
            --argjson removed "$removed" \
            --argjson remaining "$(printf '%s' "$after" | jq '[.result[].id]')" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{kept: $kept, removed: $removed, remaining: $remaining, completedAt: $completedAt}' \
            > ops/cloudflare-worker-cleanup-result.json

      - name: Commit cleanup result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/cloudflare-worker-cleanup-result.json
          git commit -m "ops: record Cloudflare Worker cleanup"
          git push
