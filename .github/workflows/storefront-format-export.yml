name: Storefront Format Export

on:
  push:
    branches: [fix/storefront-navigation-continuity]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply storefront prettier') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/storefront-navigation-continuity

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: pnpm exec prettier --write apps/storefront/src/product-detail-shell.css apps/storefront/src/ProductDetailPage.tsx apps/storefront/src/storefront-history.ts

      - name: Commit formatted sources
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/storefront/src/product-detail-shell.css apps/storefront/src/ProductDetailPage.tsx apps/storefront/src/storefront-history.ts; then
            echo 'Target files already match Prettier.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/storefront/src/product-detail-shell.css apps/storefront/src/ProductDetailPage.tsx apps/storefront/src/storefront-history.ts
          git commit -m 'chore: apply storefront prettier'
          git push origin HEAD:fix/storefront-navigation-continuity
