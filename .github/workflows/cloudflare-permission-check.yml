name: Cloudflare Permission Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-permission-check
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Cloudflare access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Cloudflare permission check
        shell: bash
        run: bash .github/scripts/check-cloudflare-permissions.sh
