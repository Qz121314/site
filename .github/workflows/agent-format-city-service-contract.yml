name: Format city service contract

on:
  push:
    branches:
      - agent/city-service-products

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/city-service-products
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format contract
        run: pnpm exec prettier --write apps/storefront/test/city-service-product-contract.test.mjs

      - name: Commit formatted file
        shell: bash
        run: |
          rm .github/workflows/agent-format-city-service-contract.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format city service product contract"
          git push origin HEAD:agent/city-service-products
