name: One-shot format CTA support contract

on:
  push:
    branches: [fix/cta-starts-support-conversation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cta-starts-support-conversation
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format contract test
        run: pnpm exec prettier --write apps/storefront/test/cta-support-start-contract.test.mjs
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-format-cta-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Format CTA support contract with Prettier'
          git push origin HEAD:fix/cta-starts-support-conversation
