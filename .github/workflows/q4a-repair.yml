name: Q4A one-shot repair

on:
  push:
    branches:
      - perf/storefront-public-snapshot-direct-cdn

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: perf/storefront-public-snapshot-direct-cdn
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair Q4A fixture and format with repository Prettier
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/storefront/test/public-content-transport.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const declaration = 'const WORKER_BOOTSTRAP_URL = `${APP_ORIGIN}/api/public/storefront/bootstrap`;';
          if (!source.includes(declaration)) {
            source = source.replace(
              /const POINTER_VERSION = ["']content-20260908-abcdef["'];/,
              (match) => `${match}\n${declaration}`,
            );
          }
          source = source.replace(
            /["']\/api\/public\/storefront\/bootstrap["']/g,
            'WORKER_BOOTSTRAP_URL',
          );
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write \
            apps/storefront/src/public-content-transport.ts \
            apps/storefront/test/public-content-transport.test.mjs
          rm -f tests/ci/q4a-prettier-dump.test.mjs .github/workflows/q4a-repair.yml

      - name: Targeted Storefront gate
        run: |
          pnpm exec prettier --check \
            apps/storefront/src/public-content-transport.ts \
            apps/storefront/test/public-content-transport.test.mjs
          pnpm --filter @site/storefront test

      - name: Commit one-shot repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(storefront): fix direct bootstrap fallback fixture formatting'
          git push origin HEAD:perf/storefront-public-snapshot-direct-cdn
