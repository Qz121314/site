name: Rebuild empty D1 media domain baseline

on:
  push:
    branches: [agent/r2-custom-domain-baseline]
    paths:
      - .github/workflows/rebuild-d1-media-domain.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify existing D1 contains no business data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          sql='SELECT
            (SELECT COUNT(*) FROM media_assets) +
            (SELECT COUNT(*) FROM sections) +
            (SELECT COUNT(*) FROM conversion_methods) +
            (SELECT COUNT(*) FROM products) +
            (SELECT COUNT(*) FROM product_media) +
            (SELECT COUNT(*) FROM faqs) +
            (SELECT COUNT(*) FROM publish_jobs) +
            (SELECT COUNT(*) FROM publish_versions) +
            (SELECT COUNT(*) FROM conversion_events) +
            (SELECT COUNT(*) FROM audit_logs) +
            (SELECT COUNT(*) FROM idempotency_keys)
            AS total_rows;'

          result="$(pnpm exec wrangler d1 execute DB --remote --json --command "$sql")"
          total_rows="$(printf '%s' "$result" | jq -r '.. | objects | select(has("total_rows")) | .total_rows' | head -n 1)"
          test -n "$total_rows"
          test "$total_rows" = "0"

      - name: Recreate formal D1 and apply corrected initial schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          old_id="$(jq -r '.d1_databases[] | select(.binding == "DB") | .database_id' wrangler.jsonc)"
          test -n "$old_id"
          test "$old_id" != "null"

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          auth=(
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            -H "Content-Type: application/json"
          )

          delete_response="$(curl --fail --silent --show-error -X DELETE "${auth[@]}" "$api/$old_id")"
          printf '%s' "$delete_response" | jq -e '.success == true' >/dev/null

          create_response="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
            --data '{"name":"service-catalog-site-db"}' \
            "$api")"
          printf '%s' "$create_response" | jq -e '.success == true' >/dev/null
          new_id="$(printf '%s' "$create_response" | jq -r '.result.uuid // .result.id')"
          test -n "$new_id"
          test "$new_id" != "null"

          jq --arg id "$new_id" \
            '(.d1_databases[] | select(.binding == "DB") | .database_id) = $id' \
            wrangler.jsonc > /tmp/wrangler.jsonc
          mv /tmp/wrangler.jsonc wrangler.jsonc

          pnpm exec wrangler d1 migrations apply DB --remote

          column_result="$(pnpm exec wrangler d1 execute DB --remote --json \
            --command 'SELECT name FROM pragma_table_info("site_settings") WHERE name = "media_base_url";')"
          printf '%s' "$column_result" | jq -e '.. | objects | select(.name? == "media_base_url")' >/dev/null

          settings_result="$(pnpm exec wrangler d1 execute DB --remote --json \
            --command 'SELECT COUNT(*) AS row_count, media_base_url FROM site_settings WHERE id = 1;')"
          row_count="$(printf '%s' "$settings_result" | jq -r '.. | objects | select(has("row_count")) | .row_count' | head -n 1)"
          test "$row_count" = "1"
          printf '%s' "$settings_result" | jq -e '.. | objects | select(has("media_base_url") and .media_base_url == null)' >/dev/null

          fk_result="$(pnpm exec wrangler d1 execute DB --remote --json --command 'PRAGMA foreign_key_check;')"
          violations="$(printf '%s' "$fk_result" | jq '[.. | objects | select(has("table") and has("rowid"))] | length')"
          test "$violations" = "0"

      - name: Commit new D1 binding
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wrangler.jsonc
          git commit -m "ops: bind rebuilt D1 media domain baseline"
          git push origin HEAD:agent/r2-custom-domain-baseline
