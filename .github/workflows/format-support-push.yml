name: Format support push

on:
  push:
    branches: [feat/support-web-push]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/support-web-push
      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/storefront/public/sw.js apps/storefront/src/support-push.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/public/sw.js apps/storefront/src/support-push.ts
          git commit -m "格式化后台 Push 代码"
          git push origin HEAD:feat/support-web-push
