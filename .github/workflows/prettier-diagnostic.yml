name: Prettier Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format storefront polish
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/storefront/src/browse-ui.css \
            apps/storefront/src/faq-ui.css \
            apps/storefront/src/messages-ui.css \
            apps/storefront/src/product-detail-ui.css \
            apps/storefront/src/section-ui.css \
            apps/storefront/test/storefront-full-polish-contract.test.mjs

      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/storefront/src/browse-ui.css \
            apps/storefront/src/faq-ui.css \
            apps/storefront/src/messages-ui.css \
            apps/storefront/src/product-detail-ui.css \
            apps/storefront/src/section-ui.css \
            apps/storefront/test/storefront-full-polish-contract.test.mjs
          git commit -m 'chore(storefront): apply prettier formatting'
          git push origin HEAD:${{ github.head_ref }}
