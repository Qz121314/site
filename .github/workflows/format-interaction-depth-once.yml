name: Format Interaction Depth Once

on:
  push:
    branches:
      - ui/interaction-depth
    paths:
      - apps/storefront/src/interaction-depth.css
      - .github/workflows/format-interaction-depth-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: remove temporary formatter'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/interaction-depth
      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format interaction depth stylesheet
        run: pnpm exec prettier --write apps/storefront/src/interaction-depth.css
      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/storefront/src/interaction-depth.css; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/storefront/src/interaction-depth.css
          git commit -m 'style(storefront): format interaction depth css'
          git push origin HEAD:ui/interaction-depth
