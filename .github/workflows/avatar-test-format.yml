name: Avatar Test Format

on:
  push:
    branches:
      - feature/customer-service-agent-avatar

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-service-agent-avatar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/storefront/test/support-agent-avatar.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/test/support-agent-avatar.test.mjs
          git commit -m "Format storefront avatar contract test"
          git push origin HEAD:feature/customer-service-agent-avatar
