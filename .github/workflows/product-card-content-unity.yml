name: Product Card Content Unity

on:
  push:
    branches: [fix/product-card-content-unity]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[content-unity]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/product-card-content-unity

      - name: Apply focused storefront refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'apps/storefront/src/HomeFeed.tsx',
              """  const contextLabel =
              product.category.name?.trim() ||
              product.tags[0]?.name.trim() ||
              product.sectionName.trim();

          """,
              '',
          )
          replace(
              'apps/storefront/src/HomeFeed.tsx',
              """          width={640}
                />
              </span>
              <span className=\"home-product-meta\">
                {contextLabel && contextLabel !== product.title ? (
                  <span className=\"home-product-kicker\">{contextLabel}</span>
                ) : null}
                <strong>{product.title}</strong>
              </span>
          """,
              """          width={640}
                />
                <strong className=\"home-product-title\">{product.title}</strong>
              </span>
          """,
          )

          replace(
              'apps/storefront/src/BrowsePage.tsx',
              """                const contextLabel = [product.sectionName, product.category.name]
                  .filter((value): value is string => Boolean(value?.trim()))
                  .join(' · ');
          """,
              '',
          )
          replace(
              'apps/storefront/src/BrowsePage.tsx',
              """                        width={640}
                      />
                    </span>
                    {contextLabel ? (
                      <span className=\"browse-search-product-kicker\">{contextLabel}</span>
                    ) : null}
                    <strong>{product.title}</strong>
          """,
              """                        width={640}
                      />
                      <strong className=\"browse-search-product-title\">{product.title}</strong>
                    </span>
          """,
          )

          replace(
              'apps/storefront/src/SectionPage.tsx',
              """              const contextLabel =
                product.category.name?.trim() || product.tags[0]?.name.trim() || '';
          """,
              '',
          )
          replace(
              'apps/storefront/src/SectionPage.tsx',
              """                      width={640}
                    />
                  </div>
                  <span className=\"section-product-meta\">
                    {contextLabel && contextLabel !== product.title ? (
                      <span className=\"section-product-kicker\">{contextLabel}</span>
                    ) : null}
                    <h2>{product.title}</h2>
                  </span>
          """,
              """                      width={640}
                    />
                    <h2 className=\"section-product-title\">{product.title}</h2>
                  </div>
          """,
          )

          replace(
              'apps/storefront/src/ProductDetailPage.tsx',
              """          <span className=\"is-context loading-skeleton\" />
          """,
              '',
          )
          replace(
              'apps/storefront/src/ProductDetailPage.tsx',
              """          <div className=\"product-detail-loading-tags\">
            <span className=\"loading-skeleton\" />
            <span className=\"loading-skeleton\" />
          </div>
          """,
              '',
          )
          replace(
              'apps/storefront/src/ProductDetailPage.tsx',
              """  const detailContext = product.category.name?.trim() || product.sectionName.trim();
          """,
              '',
          )
          replace(
              'apps/storefront/src/ProductDetailPage.tsx',
              """            <section className=\"product-detail-summary\">
              {detailContext ? (
                <p className=\"product-detail-context\">{detailContext}</p>
              ) : null}
              <h1 id=\"product-detail-title\">{product.title}</h1>

              {product.tags.length > 0 ? (
                <div className=\"product-detail-tags\" aria-label=\"Tags\">
                  {product.tags.map((tag) => (
                    <span key={tag.id}>{tag.name}</span>
                  ))}
                </div>
              ) : null}
            </section>
          """,
              """            <section className=\"product-detail-summary\">
              <h1 id=\"product-detail-title\">{product.title}</h1>
            </section>
          """,
          )

          replace(
              'apps/storefront/src/home-feed.css',
              """.home-product-tile {
            display: grid;
            min-width: 0;
            align-content: start;
            gap: 9px;
            color: var(--text);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
          }
          """,
              """.home-product-tile {
            display: block;
            min-width: 0;
            color: var(--text);
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
          }
          """,
          )
          replace(
              'apps/storefront/src/home-feed.css',
              """.home-product-cover::after {
          """,
              """.home-product-cover::before {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
              180deg,
              transparent 48%,
              rgb(0 0 0 / 8%) 62%,
              rgb(0 0 0 / 72%) 100%
            );
            content: '';
            pointer-events: none;
          }

          .home-product-cover::after {
          """,
          )
          replace(
              'apps/storefront/src/home-feed.css',
              """.home-product-meta {
            display: grid;
            min-width: 0;
            gap: 4px;
            padding: 0 1px;
          }

          .home-product-kicker {
            overflow: hidden;
            color: var(--v2-muted, var(--muted));
            font-size: 0.62rem;
            font-weight: 560;
            line-height: 1.2;
            letter-spacing: 0.025em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .home-product-meta strong {
            display: -webkit-box;
            min-width: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 590;
            line-height: 1.28;
            letter-spacing: -0.014em;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
              """.home-product-title {
            position: absolute;
            right: 10px;
            bottom: 9px;
            left: 10px;
            z-index: 2;
            display: -webkit-box;
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-size: 0.84rem;
            font-weight: 620;
            line-height: 1.2;
            letter-spacing: -0.018em;
            text-shadow: 0 1px 12px rgb(0 0 0 / 38%);
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
          )
          replace(
              'apps/storefront/src/home-feed.css',
              """  .home-product-meta strong {
              font-size: 0.92rem;
            }
          """,
              """  .home-product-title {
              right: 12px;
              bottom: 11px;
              left: 12px;
              font-size: 0.92rem;
            }
          """,
          )

          replace(
              'apps/storefront/src/browse-ui.css',
              """.browse-search-product-cover::after {
          """,
              """.browse-search-product-cover::before {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
              180deg,
              transparent 48%,
              rgb(0 0 0 / 8%) 62%,
              rgb(0 0 0 / 72%) 100%
            );
            content: '';
            pointer-events: none;
          }

          .browse-search-product-cover::after {
          """,
          )
          replace(
              'apps/storefront/src/browse-ui.css',
              """.browse-search-product-kicker {
            margin: 9px 1px 0;
            overflow: hidden;
            color: var(--v2-muted, var(--muted));
            font-size: 0.62rem;
            font-weight: 560;
            letter-spacing: 0.025em;
            line-height: 1.2;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .browse-search-product-card > strong {
            display: -webkit-box;
            margin: 4px 1px 0;
            overflow: hidden;
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 590;
            line-height: 1.28;
            letter-spacing: -0.014em;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
              """.browse-search-product-title {
            position: absolute;
            right: 10px;
            bottom: 9px;
            left: 10px;
            z-index: 2;
            display: -webkit-box;
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-size: 0.84rem;
            font-weight: 620;
            line-height: 1.2;
            letter-spacing: -0.018em;
            text-shadow: 0 1px 12px rgb(0 0 0 / 38%);
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
          )
          replace(
              'apps/storefront/src/browse-ui.css',
              """  .browse-search-product-card > strong {
              font-size: 0.92rem;
            }
          """,
              """  .browse-search-product-title {
              right: 12px;
              bottom: 11px;
              left: 12px;
              font-size: 0.92rem;
            }
          """,
          )

          replace(
              'apps/storefront/src/section-ui.css',
              """.section-product-cover::after {
          """,
              """.section-product-cover::before {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
              180deg,
              transparent 48%,
              rgb(0 0 0 / 8%) 62%,
              rgb(0 0 0 / 72%) 100%
            );
            content: '';
            pointer-events: none;
          }

          .section-product-cover::after {
          """,
          )
          replace(
              'apps/storefront/src/section-ui.css',
              """.section-product-meta {
            display: grid;
            min-width: 0;
            gap: 4px;
            margin: 9px 1px 0;
          }

          .section-product-kicker {
            overflow: hidden;
            color: var(--v2-muted, var(--muted));
            font-size: 0.62rem;
            font-weight: 560;
            line-height: 1.2;
            letter-spacing: 0.025em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .section-product-card h2 {
            display: -webkit-box;
            margin: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 590;
            line-height: 1.28;
            letter-spacing: -0.014em;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
              """.section-product-title {
            position: absolute;
            right: 10px;
            bottom: 9px;
            left: 10px;
            z-index: 2;
            display: -webkit-box;
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-size: 0.84rem;
            font-weight: 620;
            line-height: 1.2;
            letter-spacing: -0.018em;
            text-shadow: 0 1px 12px rgb(0 0 0 / 38%);
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          }
          """,
          )
          replace(
              'apps/storefront/src/section-ui.css',
              """  .section-product-card h2 {
              font-size: 0.94rem;
            }
          """,
              """  .section-product-title {
              right: 12px;
              bottom: 11px;
              left: 12px;
              font-size: 0.94rem;
            }
          """,
          )

          replace(
              'apps/storefront/src/product-detail-ui.css',
              """.product-detail-tags {
            display: flex;
            min-width: 0;
            gap: 0;
            margin-top: 12px;
            flex-wrap: wrap;
            color: color-mix(in srgb, var(--text) 55%, var(--muted));
            font-size: var(--storefront-text-caption, 0.6875rem);
            font-weight: 520;
            line-height: 1.5;
          }

          .product-detail-tags span {
            display: inline-flex;
            min-width: 0;
            align-items: center;
          }

          .product-detail-tags span + span::before {
            margin-inline: 6px;
            color: color-mix(in srgb, var(--muted) 64%, transparent);
            content: '·';
          }

          """,
              '',
          )
          replace(
              'apps/storefront/src/product-detail-ui.css',
              """  .product-detail-tags {
              margin-top: 11px;
            }

          """,
              '',
          )

          replace(
              'apps/storefront/src/product-detail-shell.css',
              """.product-detail-loading-copy > .is-context {
            width: 88px;
            height: 11px;
            border-radius: 5px;
          }

          """,
              '',
          )
          replace(
              'apps/storefront/src/product-detail-shell.css',
              """.product-detail-loading-tags {
            display: flex;
            gap: 7px;
            margin-top: 2px;
          }

          .product-detail-loading-tags span {
            width: 62px;
            height: 26px;
            border-radius: 999px;
          }

          .product-detail-loading-tags span:last-child {
            width: 82px;
          }

          """,
              '',
          )

          test_path = Path('apps/storefront/test/product-filter-metadata-visibility-contract.test.mjs')
          test_path.write_text("""import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const homeSource = readFileSync(new URL('../src/HomeFeed.tsx', import.meta.url), 'utf8');
          const browseSource = readFileSync(new URL('../src/BrowsePage.tsx', import.meta.url), 'utf8');
          const sectionSource = readFileSync(new URL('../src/SectionPage.tsx', import.meta.url), 'utf8');
          const detailSource = readFileSync(
            new URL('../src/ProductDetailPage.tsx', import.meta.url),
            'utf8',
          );

          test('classification metadata remains filter-only across product presentation', () => {
            assert.match(homeSource, /home-product-title/u);
            assert.doesNotMatch(homeSource, /home-product-kicker|contextLabel/u);

            assert.match(browseSource, /browse-search-product-title/u);
            assert.match(browseSource, /product\.category\.name \?\? ''/u);
            assert.match(browseSource, /product\.tags\.map/u);
            assert.doesNotMatch(browseSource, /browse-search-product-kicker|contextLabel/u);

            assert.match(sectionSource, /section-product-title/u);
            assert.match(
              sectionSource,
              /if \(categoryId && product\.category\.id !== categoryId\) return false;/u,
            );
            assert.match(sectionSource, /product\.tags\.map/u);
            assert.doesNotMatch(sectionSource, /section-product-kicker|contextLabel/u);

            assert.doesNotMatch(detailSource, /product-detail-context|product-detail-tags|detailContext/u);
          });
          """)
          PY

      - name: Commit focused changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src apps/storefront/test/product-filter-metadata-visibility-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(storefront): unify product card identity [content-unity]"
            git push origin HEAD:fix/product-card-content-unity
          fi
