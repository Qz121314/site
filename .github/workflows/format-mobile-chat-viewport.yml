name: Format mobile chat viewport

on:
  push:
    branches: [agent/mobile-chat-keyboard-viewport]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-chat-keyboard-viewport

      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format target file
        run: pnpm exec prettier --write apps/storefront/src/mobile-chat-viewport.ts

      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/mobile-chat-viewport.ts
          git commit --no-verify -m "按仓库标准归一化聊天视口格式"
          git push
