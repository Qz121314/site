name: One-time Live Support Probe

on:
  push:
    branches: [fix/storefront-go-navigation]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production support and CTA
        run: |
          set -euo pipefail
          base='https://service-catalog-site.fcqz121314.workers.dev'
          echo '--- support connections ---'
          curl --fail --silent --show-error "$base/api/public/storefront/support/connections"
          echo
          echo '--- product CTA ---'
          curl --fail --silent --show-error "$base/api/public/storefront/cta/265308a6-18c3-44e6-bf8e-27aba220d312"
          echo
