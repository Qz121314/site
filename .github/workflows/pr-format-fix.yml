name: PR Format Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/storefront-visual-continuity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/theme-center-preview.css \
            apps/admin/src/theme-center/diagnostics.ts \
            apps/admin/src/ThemeCenterPreview.tsx \
            apps/admin/src/ThemeCenterView.tsx \
            apps/admin/test/theme-center-live-preview-contract.test.mjs \
            apps/storefront/src/support-ui.tsx \
            apps/storefront/test/storefront-visual-continuity-contract.test.mjs \
            apps/storefront/test/support-lifecycle-resilience-contract.test.mjs

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/admin/src/theme-center-preview.css \
            apps/admin/src/theme-center/diagnostics.ts \
            apps/admin/src/ThemeCenterPreview.tsx \
            apps/admin/src/ThemeCenterView.tsx \
            apps/admin/test/theme-center-live-preview-contract.test.mjs \
            apps/storefront/src/support-ui.tsx \
            apps/storefront/test/storefront-visual-continuity-contract.test.mjs \
            apps/storefront/test/support-lifecycle-resilience-contract.test.mjs
          git commit -m 'style: apply prettier to visual polish changes'
          git push origin HEAD:${{ github.head_ref }}
