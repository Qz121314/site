name: Update offline product worker contract

on:
  push:
    branches:
      - agent/city-service-products

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/city-service-products
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch stale worker contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/worker/test/admin-crud-constraints.test.mjs')
          text = path.read_text()
          old = """test('published products reject missing media and offline products require an address', async () => {\n  const noMedia = validateProductInput(\n    baseProductInput({ mediaAssetIds: [], coverAssetId: null }),\n  );\n  assert.equal(noMedia.ok, true);\n  if (!noMedia.ok) return;\n  const missingMedia = await validateProductDependencies(\n    productDependencyDb({ mediaIds: [] }),\n    'section-1',\n    noMedia.value,\n  );\n  assert.equal(missingMedia.ok, false);\n  if (!missingMedia.ok) assert.equal(missingMedia.code, 'PRODUCT_IMAGE_REQUIRED');\n\n  const offline = validateProductInput(\n    baseProductInput({\n      serviceMode: 'offline',\n      address: '',\n      conversionGroupId: 'group-1',\n    }),\n  );\n  assert.equal(offline.ok, true);\n  if (!offline.ok) return;\n  const missingAddress = await validateProductDependencies(\n    productDependencyDb({\n      group: conversionGroupRow({\n        mode: 'customer_service',\n        targetCount: 1,\n        activeTargetCount: 1,\n      }),\n    }),\n    'section-1',\n    offline.value,\n  );\n  assert.equal(missingAddress.ok, false);\n  if (!missingAddress.ok) assert.equal(missingAddress.code, 'ADDRESS_REQUIRED');\n});\n"""
          new = """test('published products reject missing media while offline products may omit an address', async () => {\n  const noMedia = validateProductInput(\n    baseProductInput({ mediaAssetIds: [], coverAssetId: null }),\n  );\n  assert.equal(noMedia.ok, true);\n  if (!noMedia.ok) return;\n  const missingMedia = await validateProductDependencies(\n    productDependencyDb({ mediaIds: [] }),\n    'section-1',\n    noMedia.value,\n  );\n  assert.equal(missingMedia.ok, false);\n  if (!missingMedia.ok) assert.equal(missingMedia.code, 'PRODUCT_IMAGE_REQUIRED');\n\n  const offline = validateProductInput(\n    baseProductInput({\n      serviceMode: 'offline',\n      address: '',\n      conversionGroupId: 'group-1',\n    }),\n  );\n  assert.equal(offline.ok, true);\n  if (!offline.ok) return;\n  const validWithoutAddress = await validateProductDependencies(\n    productDependencyDb({\n      group: conversionGroupRow({\n        mode: 'customer_service',\n        targetCount: 1,\n        activeTargetCount: 1,\n      }),\n    }),\n    'section-1',\n    offline.value,\n  );\n  assert.deepEqual(validWithoutAddress, { ok: true });\n});\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale contract, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format updated test
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/worker/test/admin-crud-constraints.test.mjs

      - name: Commit contract update
        shell: bash
        run: |
          rm .github/workflows/agent-update-offline-product-test.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update offline product worker contract"
          git push origin HEAD:agent/city-service-products
