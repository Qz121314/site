name: One-shot workflow newline cleanup

on:
  push:
    branches: [chore/checkout-v7]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/checkout-v7
          fetch-depth: 0

      - name: Restore newline and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          path.write_text(path.read_text().rstrip('\n') + '\n')
          PY
          rm .github/workflows/fix-ci-newline-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'style: restore workflow eof newline'
          git push origin HEAD:chore/checkout-v7
