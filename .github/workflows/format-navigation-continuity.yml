name: Format navigation continuity

on:
  push:
    branches:
      - ui/app-navigation-continuity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/app-navigation-continuity

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed navigation files
        run: |
          pnpm exec prettier --write \
            apps/storefront/src/StorefrontPresentation.tsx \
            apps/storefront/test/route-transition-continuity-contract.test.mjs

      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/storefront/src/StorefrontPresentation.tsx apps/storefront/test/route-transition-continuity-contract.test.mjs
          git commit -m "style: format navigation continuity files"
          git push origin HEAD:ui/app-navigation-continuity
