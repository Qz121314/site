name: Codex storefront image variants

on:
  push:
    branches: [codex/storefront-image-variants-20260815]

permissions:
  contents: write

concurrency:
  group: codex-site-storefront-image-variants
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/storefront-image-variants-20260815
          fetch-depth: 0
      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node.js 22 or newer is required')"
          npm install --global pnpm@11.19.0
      - name: Apply responsive image patch
        run: python .github/scripts/apply_storefront_image_variants.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm format:write
      - name: Verify project
        run: pnpm verify
      - name: Commit verified image optimization
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-storefront-image-variants.yml .github/scripts/apply_storefront_image_variants.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'perf: serve responsive product images across catalogs'
          git push origin HEAD:codex/storefront-image-variants-20260815
