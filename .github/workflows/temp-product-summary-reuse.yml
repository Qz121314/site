name: Temp Product Summary Format

on:
  push:
    branches:
      - agent/product-detail-summary-reuse

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-detail-summary-reuse
      - name: Format changed files
        shell: bash
        run: |
          npx --yes prettier@3.9.6 --write README.md apps/storefront/src/content.ts apps/storefront/src/search-index.ts apps/storefront/test/content.test.mjs apps/storefront/test/product-summary-reuse-contract.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/storefront/src/content.ts apps/storefront/src/search-index.ts apps/storefront/test/content.test.mjs apps/storefront/test/product-summary-reuse-contract.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format product summary reuse changes"
          git push origin HEAD:agent/product-detail-summary-reuse
