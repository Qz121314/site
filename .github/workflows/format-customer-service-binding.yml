name: Format customer service binding patch

on:
  push:
    branches:
      - fix/customer-service-service-binding
    paths:
      - .github/workflows/format-customer-service-binding.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-service-service-binding

      - name: Format changed files
        run: >-
          npx --yes prettier@3.9.6 --write
          apps/worker/src/customer-service/customer-service-provider.ts
          apps/worker/test/customer-service-provider.test.mjs

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/customer-service/customer-service-provider.ts apps/worker/test/customer-service-provider.test.mjs
          git commit -m 'style: format customer service binding patch'
          git push origin HEAD:fix/customer-service-service-binding
