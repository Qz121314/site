name: Diagnose Mobile Viewport

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-mobile-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Probe production viewport geometry
        env:
          BASE_URL: https://service-catalog-site.fcqz121314.workers.dev
        run: pnpm exec playwright test tests/e2e/viewport-diagnostic.spec.ts --project=mobile-chromium --reporter=line
