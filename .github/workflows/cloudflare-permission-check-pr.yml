name: Cloudflare Permission Check (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/permission-check-trigger
      - .github/scripts/check-cloudflare-permissions.sh
      - .github/workflows/cloudflare-permission-check-pr.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-permission-check-pr
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Cloudflare access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Cloudflare permission check
        shell: bash
        run: bash .github/scripts/check-cloudflare-permissions.sh
