name: One-shot checkout v7 migration

on:
  push:
    branches: [chore/checkout-v7]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/checkout-v7
          fetch-depth: 0

      - name: Upgrade checkout actions and remove this workflow
        run: |
          set -euo pipefail
          sed -i 's#actions/checkout@v4#actions/checkout@v7#g' \
            .github/workflows/ci.yml \
            .github/workflows/cloudflare-permission-check.yml \
            .github/workflows/storefront-critical-e2e.yml
          rm .github/workflows/checkout-v7-once.yml

          git diff --check
          test "$(grep -R 'actions/checkout@v4' .github/workflows --include='*.yml' | wc -l)" -eq 0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: upgrade checkout action to v7'
          git push origin HEAD:chore/checkout-v7
