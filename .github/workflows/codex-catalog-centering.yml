name: Codex catalog centering

on:
  push:
    branches: [codex/catalog-desktop-centering-20260815]

permissions:
  contents: write

concurrency:
  group: codex-site-catalog-centering
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/catalog-desktop-centering-20260815
          fetch-depth: 0
      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node.js 22 or newer is required')"
          npm install --global pnpm@11.19.0
      - name: Apply catalog centering
        run: python .github/scripts/apply_catalog_desktop_centering.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm format:write
      - name: Verify project
        run: pnpm verify
      - name: Commit verified layout polish
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-catalog-centering.yml .github/scripts/apply_catalog_desktop_centering.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'ui: center desktop catalog and browse surfaces'
          git push origin HEAD:codex/catalog-desktop-centering-20260815
