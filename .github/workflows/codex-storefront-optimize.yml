name: Codex storefront realtime optimization

on:
  push:
    branches: [codex/realtime-consumer-opt-20260814]

permissions:
  contents: write

concurrency:
  group: codex-site-realtime-optimization
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: codex/realtime-consumer-opt-20260814
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) { throw new Error('Node.js 22 or newer is required') }"
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Apply realtime consumer optimization
        run: python .github/scripts/apply_realtime_consumer_optimization.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: pnpm format:write

      - name: Verify project
        run: pnpm verify

      - name: Commit verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-storefront-optimize.yml .github/scripts/apply_realtime_consumer_optimization.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'perf: consume support realtime deltas without polling'
          git push origin HEAD:codex/realtime-consumer-opt-20260814
