name: Phase C Append Style Once

on:
  push:
    branches:
      - refactor/admin-commercial-ui-patterns

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Append shared styles once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          faq = Path('apps/admin/src/FaqManagementView.tsx')
          faq.write_text(faq.read_text().replace('className="scope-tabs"', 'className="faq-scope-segmented"'))
          target = Path('apps/admin/src/admin-ui-system.css')
          snippet = Path('apps/admin/src/.phase-c-commercial-patterns.css').read_text()
          current = target.read_text()
          if '/* ---------- Commercial patterns ---------- */' not in current:
              target.write_text(current.rstrip() + '\n\n' + snippet.lstrip())
          PY
      - name: Commit shared styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/src/admin-ui-system.css apps/admin/src/FaqManagementView.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(admin): apply Phase C commercial patterns"
          git push
