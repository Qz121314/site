name: Deploy Probe

on:
  push:
    branches:
      - ui/product-detail-gallery-affordance

permissions:
  actions: read
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/product-detail-gallery-affordance
      - name: Record main deployment run
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: 762519c25ad5eaf6a059443c27dd946c1ee64a72
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MERGE_SHA}&event=push&per_page=10"
          run_id=""
          status="not_found"
          conclusion=""
          html_url=""
          for _ in $(seq 1 30); do
            response=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")
            run_id=$(printf '%s' "$response" | jq -r '.workflow_runs[] | select(.name == "CI and Deploy") | .id' | head -n 1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              run=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
              status=$(printf '%s' "$run" | jq -r '.status')
              conclusion=$(printf '%s' "$run" | jq -r '.conclusion // empty')
              html_url=$(printf '%s' "$run" | jq -r '.html_url')
              break
            fi
            sleep 2
          done
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            jq -n --arg head_sha "$MERGE_SHA" --arg run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --arg html_url "$html_url" '{head_sha:$head_sha,run_id:($run_id|tonumber),status:$status,conclusion:(if $conclusion == "" then null else $conclusion end),html_url:$html_url}' > .deploy-probe-id.json
          else
            jq -n --arg head_sha "$MERGE_SHA" '{head_sha:$head_sha,run_id:null,status:"not_found",conclusion:null,html_url:null}' > .deploy-probe-id.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-probe-id.json
          git commit -m 'chore(ci): record deployment run id'
          git push origin HEAD:ui/product-detail-gallery-affordance
