name: PR Test Diagnostics

on:
  pull_request:
    branches:
      - main

jobs:
  test-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-diagnostics
          path: test.log
          if-no-files-found: error

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
