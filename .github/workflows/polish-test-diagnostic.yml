name: Storefront Test Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  storefront-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Storefront tests with concise failure output
        run: |
          set +e
          pnpm --filter @site/storefront test > /tmp/storefront-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E -C 12 'not ok|AssertionError|ERR_ASSERTION|ERR_TEST_FAILURE|actual:|expected:' /tmp/storefront-test.log | tail -220 || true
            echo '--- tail ---'
            tail -120 /tmp/storefront-test.log
          else
            tail -40 /tmp/storefront-test.log
          fi
          exit "$status"
