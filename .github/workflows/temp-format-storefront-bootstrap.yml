name: Temp Storefront Bootstrap Format

on:
  push:
    branches:
      - agent/storefront-bootstrap-navigation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-navigation
      - name: Format changed files
        run: |
          npm install --global prettier@3.9.6
          prettier --write \
            apps/storefront/src/bottom-navigation.ts \
            apps/storefront/test/content.test.mjs \
            apps/storefront/test/storefront-bootstrap-navigation.test.mjs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/storefront/src/bottom-navigation.ts \
            apps/storefront/test/content.test.mjs \
            apps/storefront/test/storefront-bootstrap-navigation.test.mjs
          git commit -m "Format storefront bootstrap changes"
          git push origin HEAD:agent/storefront-bootstrap-navigation
