name: Article C0 Correction Rerun

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-correction-rerun.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply verified correction script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/article-c0-corrections.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, 'article-c0-corrections-inline.py', 'exec'), {'__name__': '__main__'})

          test_path = Path('apps/worker/test/article-message-contract.test.mjs')
          test_source = test_path.read_text()
          old_mock = "              is_enabled: statement.args[3],\n"
          if test_source.count(old_mock) != 1:
              raise SystemExit(f'expected one old enabled mock binding, found {test_source.count(old_mock)}')
          test_source = test_source.replace(old_mock, "              is_enabled: 1,\n", 1)
          test_path.write_text(test_source)

          contract_path = Path('apps/worker/test/message-article-background-contract.test.mjs')
          contract = contract_path.read_text()
          old_assertion = "  assert.doesNotMatch(source, /\\bisEnabled\\b/u);\n"
          new_assertions = (
              "  assert.match(source, /'isEnabled' in value/u);\n"
              "  assert.doesNotMatch(source, /isEnabled:\\s*boolean/u);\n"
              "  assert.doesNotMatch(source, /isEnabled:\\s*row\\.is_enabled/u);\n"
              "  assert.doesNotMatch(source, /placement\\.isEnabled/u);\n"
          )
          if contract.count(old_assertion) != 1:
              raise SystemExit(f'expected one broad isEnabled assertion, found {contract.count(old_assertion)}')
          contract_path.write_text(contract.replace(old_assertion, new_assertions, 1))
          PY
      - name: Run changed-file fixer
        run: pnpm fix:changed
      - name: Run formatting check
        run: pnpm format
      - name: Run targeted C0 contracts
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs
      - name: Run full repository verify
        run: pnpm verify
      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/src/routes/admin-message-articles.ts \
                  apps/worker/test/article-message-contract.test.mjs \
                  apps/worker/test/message-article-background-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(content): tighten message article placement contract"
          git push origin HEAD:feat/message-article-background-media-contract
