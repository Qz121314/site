name: Article C0 Finalize

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final contract normalization
        run: python scripts/article-c0-finalize.py

      - name: Format C0 files
        run: |
          pnpm exec prettier --write \
            apps/storefront/src/messages-articles.ts \
            apps/storefront/test/messages-articles.test.mjs \
            apps/worker/src/assets/asset-library.ts \
            apps/worker/src/media/media-delete.ts \
            apps/worker/src/publishing/modular-publisher.ts \
            apps/worker/src/publishing/storefront-bootstrap-snapshot.ts \
            apps/worker/src/routes/admin-message-articles.ts \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs \
            apps/worker/test/message-article-migration.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs

      - name: Commit normalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/storefront/src/messages-articles.ts \
            apps/storefront/test/messages-articles.test.mjs \
            apps/worker/src/assets/asset-library.ts \
            apps/worker/src/media/media-delete.ts \
            apps/worker/src/publishing/modular-publisher.ts \
            apps/worker/src/publishing/storefront-bootstrap-snapshot.ts \
            apps/worker/src/routes/admin-message-articles.ts \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs \
            apps/worker/test/message-article-migration.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs \
            migrations/0032_message_article_background_media.sql
          git commit -m "fix(content): finalize message article media contract"
          git push origin HEAD:feat/message-article-background-media-contract
