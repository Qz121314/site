name: Initialize clean Cloudflare data baseline

on:
  push:
    branches: [agent/cloudflare-data-baseline]
    paths:
      - .github/workflows/provision-cloudflare-data.yml

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply initial D1 migration
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify D1 schema and R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          database_id="cdd6642d-6114-4340-8fd8-b72b5d947e69"
          d1_query_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${database_id}/query"
          r2_bucket_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/service-catalog-site-assets"
          auth=(
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            -H "Content-Type: application/json"
          )

          query_d1() {
            local sql="$1"
            curl --fail --silent --show-error -X POST "${auth[@]}" \
              --data "$(jq -n --arg sql "$sql" '{sql: $sql}')" \
              "$d1_query_api"
          }

          tables_response="$(query_d1 "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name")"
          printf '%s' "$tables_response" | jq -e '.success == true' >/dev/null
          tables="$(printf '%s' "$tables_response" | jq -c '[.result[0].results[].name]')"

          for table in \
            audit_logs \
            conversion_events \
            conversion_methods \
            faqs \
            idempotency_keys \
            media_assets \
            product_media \
            products \
            publish_jobs \
            publish_versions \
            sections \
            site_settings
          do
            printf '%s' "$tables" | jq -e --arg table "$table" 'index($table) != null' >/dev/null
          done

          foreign_key_response="$(query_d1 "PRAGMA foreign_key_check")"
          printf '%s' "$foreign_key_response" | jq -e '.success == true and (.result[0].results | length) == 0' >/dev/null

          settings_response="$(query_d1 "SELECT id, site_name, location_label FROM site_settings WHERE id = 1")"
          printf '%s' "$settings_response" | jq -e '.success == true and .result[0].results[0].site_name == "Service Catalog"' >/dev/null

          r2_response="$(curl --fail --silent --show-error "${auth[@]}" "$r2_bucket_api")"
          printf '%s' "$r2_response" | jq -e '.success == true and .result.name == "service-catalog-site-assets"' >/dev/null

          mkdir -p ops
          jq -n \
            --arg databaseName "service-catalog-site-db" \
            --arg databaseId "$database_id" \
            --arg bucketName "service-catalog-site-assets" \
            --argjson tables "$tables" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{databaseName: $databaseName, databaseId: $databaseId, bucketName: $bucketName, tables: $tables, foreignKeyCheck: "clean", siteSettingsSeed: "verified", r2Bucket: "verified", completedAt: $completedAt}' \
            > ops/cloudflare-data-resources.json

      - name: Commit verification result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/cloudflare-data-resources.json
          git commit -m "ops: verify clean Cloudflare data baseline"
          git push origin HEAD:agent/cloudflare-data-baseline
