name: Capture message attachment test diagnostics

on:
  push:
    branches:
      - feat/message-attachments
    paths:
      - .github/workflows/capture-message-attachment-test.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-attachments
      - run: |
          node --version
          npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Capture tests
        run: |
          set +e
          pnpm test > site-test-errors.txt 2>&1
          code=$?
          echo "exit_code=$code" >> site-test-errors.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-test-errors.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture test diagnostics"
          git push origin HEAD:feat/message-attachments
