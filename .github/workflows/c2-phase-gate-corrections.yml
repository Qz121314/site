name: C2 Phase Gate Corrections Validation

on:
  push:
    branches:
      - feat/messages-article-cards-admin-ui

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: feat/messages-article-cards-admin-ui
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose PR files to changed-file formatter
        shell: bash
        run: |
          git fetch origin main
          while IFS= read -r file; do
            if [ -f "$file" ]; then printf '\n' >> "$file"; fi
          done < <(git diff --name-only origin/main...HEAD -- 'apps/admin/**')

      - name: Run changed-file fixer
        run: pnpm fix:changed

      - name: Check repository formatting
        run: pnpm format

      - name: Run targeted C2 and Admin ownership tests
        working-directory: apps/admin
        run: >-
          node --test --experimental-strip-types --import ./test/register-ts-resolver.mjs
          test/messages-articles-admin.test.mjs
          test/media-picker-selection.test.mjs
          test/admin-commercial-ui-patterns.test.mjs
          test/settings-decomposition.test.mjs

      - name: Run canonical repository verification
        run: pnpm verify

      - name: Publish verified candidate and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/c2-phase-gate-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(admin): satisfy C2 phase gate corrections'
          git push origin HEAD:feat/messages-article-cards-admin-ui
