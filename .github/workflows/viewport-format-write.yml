name: Viewport exact format write

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'refactor/storefront-visual-viewport' && !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier output
        run: |
          pnpm exec prettier --write \
            apps/storefront/src/app-shell.css \
            apps/storefront/test/storefront-visual-viewport-contract.test.mjs
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/storefront/src/app-shell.css apps/storefront/test/storefront-visual-viewport-contract.test.mjs
            git commit -m "chore: apply exact viewport formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi
