name: Prettier Diagnose

on:
  pull_request:
    paths:
      - 'apps/storefront/src/MessagesPage.tsx'
      - '.github/workflows/prettier-diagnose.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier apps/storefront/src/MessagesPage.tsx > /tmp/formatted.tsx
          diff -u apps/storefront/src/MessagesPage.tsx /tmp/formatted.tsx || true
