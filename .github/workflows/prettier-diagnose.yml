name: Prettier Diagnose

on:
  pull_request:
    paths:
      - 'apps/storefront/src/MessagesPage.tsx'
      - '.github/workflows/prettier-diagnose.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/storefront/src/MessagesPage.tsx
          if git diff --quiet -- apps/storefront/src/MessagesPage.tsx; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/storefront/src/MessagesPage.tsx
          git commit -m 'style: apply Prettier to chat state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
