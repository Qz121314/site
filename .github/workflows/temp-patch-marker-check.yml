name: Temp Patch Marker Check

on:
  push:
    branches:
      - agent/storefront-bootstrap-theme-pwa

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-theme-pwa
      - name: Check protected patch markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = [
            ('worker-import', 'apps/worker/src/routes/public-storefront-config.ts', "import { BOTTOM_NAVIGATION_KEYS } from '../settings/bottom-navigation';\nimport type { AppEnvironment } from '../types';"),
            ('worker-row', 'apps/worker/src/routes/public-storefront-config.ts', "type StorefrontRuntimeRow = {\n  media_base_url: string | null;\n  item_key: string;"),
            ('worker-runtime', 'apps/worker/src/routes/public-storefront-config.ts', "type StorefrontBootstrapRuntime = {\n  mediaBaseUrl: string | null;\n  bottomNavigation:"),
            ('worker-select', 'apps/worker/src/routes/public-storefront-config.ts', "        `SELECT\n           ss.media_base_url,\n           nav.item_key,"),
            ('worker-consistency', 'apps/worker/src/routes/public-storefront-config.ts', "  const mediaBaseUrl = first.media_base_url;\n  if (rows.some((row) => row.media_base_url !== mediaBaseUrl)) return null;\n\n  const bottomNavigation:"),
            ('worker-return', 'apps/worker/src/routes/public-storefront-config.ts', "  return { mediaBaseUrl, bottomNavigation };"),
            ('worker-response', 'apps/worker/src/routes/public-storefront-config.ts', "    mediaBaseUrl: runtime.mediaBaseUrl,\n    bottomNavigation: runtime.bottomNavigation,"),
            ('content-top', 'apps/storefront/src/content.ts', "export type BottomNavigationItemConfig = {"),
            ('content-bootstrap-type', 'apps/storefront/src/content.ts', "  home: HomeSnapshot;\n  bottomNavigation: BottomNavigationItemConfig[];"),
            ('content-bundle-type', 'apps/storefront/src/content.ts', "  configuredMediaBaseUrl: string | null;\n  bottomNavigation: BottomNavigationItemConfig[];"),
            ('content-isrecord', 'apps/storefront/src/content.ts', "function isRecord(value: unknown): value is Record<string, unknown> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nfunction isBottomNavigationKey("),
            ('content-v2-destructure', 'apps/storefront/src/content.ts', "  const [rawSite, rawIndex, configuredMediaBaseUrl, bottomNavigation] = bundle"),
            ('content-fallback-promise', 'apps/storefront/src/content.ts', "        resolveMediaBaseUrl(signal),\n        loadBottomNavigation(signal),\n      ]);"),
            ('content-v2-output', 'apps/storefront/src/content.ts', "    bottomNavigation,\n    sectionSnapshots,"),
            ('content-bundle-parse', 'apps/storefront/src/content.ts', "  let bottomNavigation: BottomNavigationItemConfig[];\n  try {\n    bottomNavigation = parseBottomNavigationItems(value.bottomNavigation);"),
            ('content-bundle-return', 'apps/storefront/src/content.ts', "    configuredMediaBaseUrl: normalizeContentOrigin(\n      typeof value.mediaBaseUrl === 'string' ? value.mediaBaseUrl : null,\n    ),\n    bottomNavigation,"),
            ('content-v1', 'apps/storefront/src/content.ts', "  const [site, rawHome, bottomNavigation] = await Promise.all(["),
            ('theme-install', 'apps/storefront/src/theme-runtime.ts', "export async function installStorefrontTheme(): Promise<PublicTheme | null> {\n  const cached = readCachedTheme();"),
            ('theme-live', 'apps/storefront/src/theme-runtime.ts', "    if (!isRecord(body) || !validTheme(body.theme)) return cached;\n    applyTheme(body.theme);"),
            ('main-live', 'apps/storefront/src/main.tsx', "const storefrontThemePromise = installStorefrontTheme();"),
            ('root-hooks', 'apps/storefront/src/StorefrontRoot.tsx', "  Suspense,\n  useEffect,\n  useSyncExternalStore,"),
            ('root-support-query', 'apps/storefront/src/StorefrontRoot.tsx', "  const supportConversationsQuery = useQuery({"),
            ('pwa-import', 'apps/storefront/src/PwaInstallPrompt.tsx', "import { useEffect, useState } from 'react';\nimport { type PublicTheme, type ThemeInstallPrompt } from './theme-runtime';"),
            ('pwa-signature', 'apps/storefront/src/PwaInstallPrompt.tsx', "export function PwaInstallPrompt({\n  themePromise,"),
            ('pwa-fetch', 'apps/storefront/src/PwaInstallPrompt.tsx', "    void fetch('/manifest.webmanifest', { signal: controller.signal })"),
            ('content-test-bootstrap', 'apps/storefront/test/content.test.mjs', "        mediaBaseUrl: 'https://media.example.com',\n        bottomNavigation: bottomNavigation(),"),
            ('worker-test-sql', 'apps/worker/test/public-bootstrap-runtime.test.mjs', "      assert.match(sql, /CROSS JOIN site_bottom_navigation nav/u);"),
            ('modular-import', 'apps/worker/test/modular-publication.test.mjs', "import { publicStorefrontConfigRoutes } from '../src/routes/public-storefront-config.ts';"),
            ('readme-flow', 'README.md', "→ 当前 mediaBaseUrl\n→ Bottom Navigation"),
            ('readme-rules', 'README.md', "- 正常启动不再额外请求 `/api/public/bottom-navigation/`；"),
          ]
          missing = []
          for label, path, marker in checks:
              if marker not in Path(path).read_text():
                  missing.append(f'{label}: {path}')
          report = 'all-markers-present\n' if not missing else 'missing-markers:\n' + '\n'.join(missing) + '\n'
          Path('.github/temp-patch-marker-report.txt').write_text(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/temp-patch-marker-report.txt
          git commit -m "Report bootstrap theme patch markers"
          git push origin HEAD:agent/storefront-bootstrap-theme-pwa
