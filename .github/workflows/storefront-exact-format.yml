name: Storefront Exact Format

on:
  push:
    branches:
      - refactor/storefront-bottom-chrome

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/storefront-bottom-chrome
      - run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --version
          pnpm exec prettier --write apps/storefront/src/app-shell.css
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/storefront/src/app-shell.css
          git commit --no-verify -m "style: apply exact storefront formatting"
          git push
