name: Inspect workflow formatting

on:
  push:
    branches:
      - fix/customer-service-worker-fetch
    paths:
      - .github/workflows/show-prettier-diff.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/customer-service-worker-fetch

      - name: Show Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.6 --write .github/workflows/ci.yml
          git diff -- .github/workflows/ci.yml
