name: Apply customer service binding patch

on:
  push:
    branches:
      - fix/customer-service-service-binding
    paths:
      - .github/workflows/patch-customer-service-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-service-service-binding

      - name: Patch route and provider regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          route = Path('apps/worker/src/routes/admin-customer-service.ts')
          text = route.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)const result = await testCustomerServiceConnection\(\{\n'
              r'\s*\.\.\.connection,\n\s*isEnabled: true,\n\s*\}\);'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Connection test call not found')
          i = match.group('i')
          replacement = (
              f'{i}const result = await testCustomerServiceConnection(\n'
              f'{i}  {{\n'
              f'{i}    ...connection,\n'
              f'{i}    isEnabled: true,\n'
              f'{i}  }},\n'
              f'{i}  {{ internalService: context.env.CUSTOMER_SERVICE_APP }},\n'
              f'{i});'
          )
          text = pattern.sub(replacement, text, count=1)

          groups_pattern = re.compile(
              r'(?m)^(?P<i>\s*)return context\.json\(\{ groups: await listRemoteCustomerServiceGroups\(connection\) \}\);'
          )
          match = groups_pattern.search(text)
          if not match:
              raise SystemExit('Group listing call not found')
          i = match.group('i')
          replacement = (
              f'{i}return context.json({{\n'
              f'{i}  groups: await listRemoteCustomerServiceGroups(connection, {{\n'
              f'{i}    internalService: context.env.CUSTOMER_SERVICE_APP,\n'
              f'{i}  }}),\n'
              f'{i}}});'
          )
          route.write_text(groups_pattern.sub(replacement, text, count=1))

          test = Path('apps/worker/test/customer-service-provider.test.mjs')
          text = test.read_text()
          marker = "test('connection test reports the number of readable remote groups', async () => {"
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one test insertion marker, found {text.count(marker)}')
          addition = """test('same-account customer-service workers.dev uses the Service Binding', async () => {
            let boundRequest;
            let publicFetchCalled = false;
            const internalService = {
              async fetch(url, init) {
                boundRequest = { url, init };
                return new Response(JSON.stringify({ groups: [{ id: 'general', name: 'General' }] }), {
                  status: 200,
                  headers: { 'content-type': 'application/json' },
                });
              },
            };

            const groups = await withFetch(
              async () => {
                publicFetchCalled = true;
                throw new Error('public fetch must not be used');
              },
              () =>
                listRemoteCustomerServiceGroups(
                  connection({
                    baseUrl: 'https://customer-service-app.fcqz121314.workers.dev',
                    projectId: null,
                    apiToken: null,
                  }),
                  { internalService },
                ),
            );

            assert.equal(publicFetchCalled, false);
            assert.equal(
              boundRequest.url,
              'https://customer-service-app.fcqz121314.workers.dev/management/v1/groups',
            );
            assert.deepEqual(groups, [{ id: 'general', name: 'General', isEnabled: true }]);
          });

          """
          test.write_text(text.replace(marker, addition + marker))
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/routes/admin-customer-service.ts apps/worker/test/customer-service-provider.test.mjs
          git commit -m 'test: cover bound customer service transport'
          git push origin HEAD:fix/customer-service-service-binding
