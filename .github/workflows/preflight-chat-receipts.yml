name: Preflight chat receipts branch

on:
  push:
    branches: [agent/chat-receipts-status]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/chat-receipts-status

      - name: Set up Node.js and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize formatting
        run: pnpm format:write

      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "按仓库标准归一化聊天状态格式"
          git push

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
