name: Temp Run Patcher With Report

on:
  push:
    branches:
      - agent/storefront-bootstrap-theme-pwa

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-theme-pwa
      - name: Execute embedded patch script with traceback
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          workflow = Path('.github/workflows/temp-apply-bootstrap-theme-pwa.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start + 1:end]))
          try:
              exec(compile(script, 'embedded-bootstrap-theme-patch.py', 'exec'), {'__name__': '__main__'})
          except BaseException:
              Path('/tmp/bootstrap-theme-patch-error.txt').write_text(traceback.format_exc())
              raise
          PY
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/bootstrap-theme-patch-error.txt .github/temp-bootstrap-theme-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/temp-bootstrap-theme-patch-error.txt
            git commit -m "Report bootstrap theme patch failure"
            git push origin HEAD:agent/storefront-bootstrap-theme-pwa
            exit 0
          fi

          npm install --global prettier@3.9.6
          prettier --write \
            apps/worker/src/routes/public-storefront-config.ts \
            apps/storefront/src/content.ts \
            apps/storefront/src/theme-runtime.ts \
            apps/storefront/src/pwa-install-runtime.ts \
            apps/storefront/src/main.tsx \
            apps/storefront/src/StorefrontRoot.tsx \
            apps/storefront/src/PwaInstallPrompt.tsx \
            apps/storefront/test/content.test.mjs \
            apps/storefront/test/storefront-bootstrap-theme-pwa.test.mjs \
            apps/worker/test/public-bootstrap-runtime.test.mjs \
            apps/worker/test/modular-publication.test.mjs \
            README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse storefront bootstrap for theme and PWA runtime"
          git push origin HEAD:agent/storefront-bootstrap-theme-pwa
