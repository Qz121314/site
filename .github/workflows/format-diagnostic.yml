name: Format Diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed customer-service files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/admin/src/ConversionPoolView.tsx
            apps/admin/src/customer-service/api.ts
            apps/storefront/src/support-gateway.ts
            apps/worker/src/conversion-pool/conversion-pool.ts
            apps/worker/src/customer-service/customer-service-provider.ts
            apps/worker/src/routes/admin-customer-service.ts
            apps/worker/src/routes/public-storefront-config.ts
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "---FORMAT_FILE_START:$file---"
            cat "$file"
            echo "---FORMAT_FILE_END:$file---"
          done
