name: Phase D Validation

on:
  push:
    branches:
      - refactor/admin-management-workspaces
    paths:
      - .github/workflows/phase-d-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Targeted Admin behavior and workspace tests
        run: |
          node --test apps/admin/test/admin-management-workspace-behavior.test.mjs apps/admin/test/admin-management-workspaces.test.mjs
          pnpm --filter @site/admin test

      - name: Full repository verify
        run: pnpm verify
