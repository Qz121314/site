name: Apply media center density

on:
  push:
    branches:
      - ui/media-center-density
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/media-center-density
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply media center changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          view_path = Path('apps/admin/src/AssetLibraryView.tsx')
          view = view_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          view = replace_once(
              view,
              "import { MediaUploadQueuePanel } from './asset-library/MediaUploadQueuePanel';\n",
              '',
              'queue panel import',
          )
          view = replace_once(
              view,
              "import {\n  useMediaUploadQueue,\n  type MediaUploadBatchSummary,\n} from './asset-library/media-upload-queue';",
              "import {\n  useMediaUploadQueue,\n  type MediaUploadBatchSummary,\n  type MediaUploadQueueItem,\n} from './asset-library/media-upload-queue';",
              'queue item type import',
          )

          kind_anchor = """function kindLabel(kind: MediaKind): string {
            if (kind === 'video') return '视频';
            if (kind === 'animated_image') return 'GIF / 动图';
            return '图片';
          }
          """
          upload_helpers = """function kindLabel(kind: MediaKind): string {
            if (kind === 'video') return '视频';
            if (kind === 'animated_image') return 'GIF / 动图';
            return '图片';
          }

          function uploadStatusLabel(item: MediaUploadQueueItem): string {
            switch (item.status) {
              case 'queued':
                return '等待';
              case 'processing':
                return item.file.type.startsWith('image/') && item.file.type !== 'image/gif'
                  ? '优化上传中'
                  : '上传中';
              case 'uploaded':
                return '完成';
              case 'reused':
                return '已存在';
              case 'error':
                return '失败';
            }
          }

          function UploadMediaCard({ item }: { item: MediaUploadQueueItem }) {
            const [previewUrl, setPreviewUrl] = useState('');

            useEffect(() => {
              const url = URL.createObjectURL(item.file);
              setPreviewUrl(url);
              return () => URL.revokeObjectURL(url);
            }, [item.file]);

            return (
              <article className={`media-center-card media-center-upload-card is-${item.status}`}>
                <div className="media-center-preview">
                  {previewUrl ? (
                    item.file.type.startsWith('video/') ? (
                      <video src={previewUrl} muted playsInline preload="metadata" />
                    ) : (
                      <img src={previewUrl} alt="" />
                    )
                  ) : null}
                  <b>{uploadStatusLabel(item)}</b>
                  <i className="media-center-upload-progress" aria-hidden="true" />
                </div>
                <div className="media-center-card-body">
                  <strong title={item.fileName}>{item.fileName}</strong>
                  <small>
                    {formatBytes(item.byteSize)}
                    {item.message ? ` · ${item.message}` : ''}
                  </small>
                  <div className="media-center-role-list">
                    <span>{roleLabel(item.role)}</span>
                  </div>
                </div>
              </article>
            );
          }
          """
          view = replace_once(view, kind_anchor, upload_helpers, 'upload card helpers')

          old_summary = """  function reportUploadSummary(summary: MediaUploadBatchSummary, retry = false) {
            const successful = summary.uploaded + summary.reused;
            const parts = [
              summary.uploaded > 0 ? `新增 ${summary.uploaded} 个` : '',
              summary.reused > 0 ? `复用 ${summary.reused} 个` : '',
              summary.skipped > 0 ? `忽略不支持文件 ${summary.skipped} 个` : '',
            ].filter(Boolean);
            if (successful > 0 || summary.skipped > 0) {
              setMediaSuccess(
                `${retry ? '重试' : '素材处理'}完成${parts.length ? `：${parts.join('，')}` : ''}。`,
              );
            }
            if (summary.failed > 0) {
              setMediaError(
                `${summary.failed} 个素材处理失败，失败项已保留在上传队列中，可直接重试。`,
              );
            } else if (summary.total === 0 && summary.skipped > 0) {
              setMediaError('所选内容中没有支持的 JPG、PNG、WebP、GIF、MP4 或 WebM。');
            }
          }
          """
          new_summary = """  function reportUploadSummary(summary: MediaUploadBatchSummary) {
            if (summary.failed > 0) {
              setMediaError(`${summary.failed} 个素材处理失败，可在素材区直接重试。`);
              return;
            }
            if (summary.total === 0 && summary.skipped > 0) {
              setMediaError('所选内容中没有支持的 JPG、PNG、WebP、GIF、MP4 或 WebM。');
              return;
            }
            if (summary.skipped > 0) {
              setMediaError(`已忽略 ${summary.skipped} 个不支持的文件。`);
            }
          }
          """
          view = replace_once(view, old_summary, new_summary, 'upload summary')
          view = replace_once(
              view,
              '    reportUploadSummary(summary, true);',
              '    reportUploadSummary(summary);',
              'retry summary',
          )

          queue_panel = """          <MediaUploadQueuePanel
            items={uploadQueue.items}
            running={uploadQueue.running}
            progress={uploadQueue.progress}
            onRetryFailed={() => void retryFailedUploads()}
            onClearFinished={uploadQueue.clearFinished}
          />

          """
          view = replace_once(view, queue_panel, '', 'queue panel jsx')

          old_results = """            <span>
              {mediaTotal} 个结果
              {managedAssets.length < mediaTotal
                ? ` · 已加载 ${managedAssets.length}`
                : ''}
            </span>
          </div>

          {mediaLoading ? (
          """
          new_results = """            <div className="media-center-result-summary">
              {uploadQueue.progress.total > 0 ? (
                <span className="media-center-upload-summary">
                  上传 {uploadQueue.progress.done} / {uploadQueue.progress.total}
                  {uploadQueue.progress.active > 0
                    ? ` · ${uploadQueue.progress.active} 个处理中`
                    : ''}
                  {uploadQueue.progress.failed > 0
                    ? ` · ${uploadQueue.progress.failed} 个失败`
                    : ''}
                </span>
              ) : null}
              {uploadQueue.progress.failed > 0 && !uploadQueue.running ? (
                <button type="button" onClick={() => void retryFailedUploads()}>
                  重试失败项
                </button>
              ) : null}
              <span>
                {mediaTotal} 个结果
                {managedAssets.length < mediaTotal
                  ? ` · 已加载 ${managedAssets.length}`
                  : ''}
              </span>
            </div>
          </div>

          {mediaLoading && uploadQueue.items.length === 0 ? (
          """
          view = replace_once(view, old_results, new_results, 'grid result summary')
          view = replace_once(
              view,
              '          ) : managedAssets.length > 0 ? (',
              '          ) : managedAssets.length > 0 || uploadQueue.items.length > 0 ? (',
              'grid visibility condition',
          )
          view = replace_once(
              view,
              '              <div className="media-center-grid">\n                {managedAssets.map((asset) => {',
              '              <div className="media-center-grid">\n                {uploadQueue.items.map((item) => (\n                  <UploadMediaCard item={item} key={item.id} />\n                ))}\n                {managedAssets.map((asset) => {',
              'upload cards in grid',
          )
          view_path.write_text(view)

          queue_path = Path('apps/admin/src/asset-library/media-upload-queue.ts')
          queue = queue_path.read_text()
          queue = replace_once(
              queue,
              """        await Promise.all(Array.from({ length: concurrency }, () => worker()));
                if (!sessionExpired) await callbacksRef.current.onBatchComplete();
          """,
              """        await Promise.all(Array.from({ length: concurrency }, () => worker()));
                if (!sessionExpired) {
                  await callbacksRef.current.onBatchComplete();
                  setItems((current) => current.filter((item) => item.status === 'error'));
                }
          """,
              'successful upload cleanup',
          )
          queue_path.write_text(queue)

          main_path = Path('apps/admin/src/main.tsx')
          main = main_path.read_text()
          main = replace_once(
              main,
              "import './media-upload-queue.css';\n",
              '',
              'queue css import',
          )
          main_path.write_text(main)

          css_path = Path('apps/admin/src/media-center.css')
          css = css_path.read_text()
          css = replace_once(
              css,
              """  grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
            align-content: start;
            gap: 8px;
          """,
              """  grid-template-columns: repeat(auto-fill, minmax(138px, 156px));
            align-content: start;
            justify-content: start;
            gap: 6px;
          """,
              'dense grid columns',
          )
          css = replace_once(css, '  border-radius: 10px;\n  background: #fff;\n  box-shadow: 0 1px 2px rgb(16 24 40 / 2%);', '  border-radius: 8px;\n  background: #fff;\n  box-shadow: 0 1px 2px rgb(16 24 40 / 2%);', 'card radius')
          css = replace_once(
              css,
              """  top: 7px;
            left: 7px;
            display: grid;
            width: 23px;
            height: 23px;
            place-items: center;
            border: 1px solid rgb(255 255 255 / 65%);
            border-radius: 7px;
          """,
              """  top: 5px;
            left: 5px;
            display: grid;
            width: 20px;
            height: 20px;
            place-items: center;
            border: 1px solid rgb(255 255 255 / 65%);
            border-radius: 6px;
          """,
              'card select size',
          )
          css = replace_once(css, '  aspect-ratio: 1 / 1;', '  aspect-ratio: 4 / 3;', 'preview ratio')
          css = replace_once(
              css,
              """  right: 7px;
            bottom: 7px;
            padding: 3px 6px;
          """,
              """  right: 5px;
            bottom: 5px;
            padding: 2px 5px;
          """,
              'preview badge spacing',
          )
          css = replace_once(
              css,
              """  display: grid;
            gap: 4px;
            padding: 7px 8px 6px;
          """,
              """  display: grid;
            gap: 3px;
            padding: 5px 6px 4px;
          """,
              'card body spacing',
          )
          css = replace_once(css, '  font-size: 0.68rem;\n  font-weight: 760;', '  font-size: 0.63rem;\n  font-weight: 760;', 'card title size')
          css = replace_once(
              css,
              """  display: -webkit-box;
            min-height: 2.45em;
            overflow: hidden;
            color: #7a8492;
            font-size: 0.59rem;
            line-height: 1.25;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
          """,
              """  display: block;
            min-height: 1.25em;
            overflow: hidden;
            color: #7a8492;
            font-size: 0.55rem;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
          """,
              'card metadata density',
          )
          css = replace_once(css, '  min-height: 19px;\n  flex-wrap: wrap;', '  min-height: 16px;\n  flex-wrap: wrap;', 'role row height')
          css = replace_once(css, '  padding: 2px 5px;\n  border-radius: 5px;', '  padding: 1px 4px;\n  border-radius: 4px;', 'role chip size')
          css = replace_once(css, '  font-size: 0.55rem;\n  font-weight: 690;', '  font-size: 0.5rem;\n  font-weight: 690;', 'role font size')
          css = replace_once(css, '  padding: 5px 8px 7px;\n  border-top:', '  padding: 4px 6px 5px;\n  border-top:', 'action spacing')
          css = replace_once(css, '  min-height: 24px;\n  padding: 0 7px;', '  min-height: 22px;\n  padding: 0 6px;', 'action button size')

          marker = """.media-center-card-actions button:hover {
            color: #344054;
            border-color: #ccd3dd;
            background: #f8f9fb;
          }

          """
          addition = marker + """.media-center-result-summary {
            display: inline-flex;
            min-width: 0;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
          }

          .media-center-result-summary button {
            min-height: 22px;
            padding: 0 6px;
            border: 1px solid #e2e6ec;
            border-radius: 6px;
            color: #475467;
            background: #fff;
            cursor: pointer;
            font-size: 0.56rem;
            font-weight: 700;
          }

          .media-center-upload-summary {
            color: #536174;
            font-variant-numeric: tabular-nums;
          }

          .media-center-upload-card {
            border-style: dashed;
          }

          .media-center-upload-card .media-center-preview {
            isolation: isolate;
          }

          .media-center-upload-card .media-center-preview img,
          .media-center-upload-card .media-center-preview video {
            opacity: 0.76;
          }

          .media-center-upload-card.is-error {
            border-color: #e6a49d;
          }

          .media-center-upload-progress {
            position: absolute;
            z-index: 2;
            right: 0;
            bottom: 0;
            left: 0;
            height: 2px;
            overflow: hidden;
          }

          .media-center-upload-card.is-processing .media-center-upload-progress::after {
            position: absolute;
            width: 42%;
            height: 100%;
            border-radius: 999px;
            background: var(--brand, #ff5a1f);
            content: '';
            animation: media-center-upload-progress 1s ease-in-out infinite alternate;
          }

          @keyframes media-center-upload-progress {
            from {
              transform: translateX(-15%);
            }
            to {
              transform: translateX(155%);
            }
          }

          """
          css = replace_once(css, marker, addition, 'upload card styles')
          css_path.write_text(css)

          test_path = Path('apps/admin/test/media-center-density-contract.test.mjs')
          test_path.write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const viewSource = await readFile(
            new URL('../src/AssetLibraryView.tsx', import.meta.url),
            'utf8',
          );
          const mainSource = await readFile(new URL('../src/main.tsx', import.meta.url), 'utf8');
          const cssSource = await readFile(
            new URL('../src/media-center.css', import.meta.url),
            'utf8',
          );

          test('media center keeps uploads inside the dense asset grid without a queue panel', () => {
            assert.doesNotMatch(viewSource, /MediaUploadQueuePanel/);
            assert.doesNotMatch(mainSource, /media-upload-queue\.css/);
            assert.match(viewSource, /<UploadMediaCard item=\{item\}/);
            assert.match(viewSource, /上传 \{uploadQueue\.progress\.done\}/);
            assert.match(cssSource, /minmax\(138px, 156px\)/);
            assert.match(cssSource, /aspect-ratio: 4 \/ 3/);
          });
          """)

          Path('apps/admin/src/asset-library/MediaUploadQueuePanel.tsx').unlink()
          Path('apps/admin/src/media-upload-queue.css').unlink()
          PY

          pnpm exec prettier --write \
            apps/admin/src/AssetLibraryView.tsx \
            apps/admin/src/asset-library/media-upload-queue.ts \
            apps/admin/src/main.tsx \
            apps/admin/src/media-center.css \
            apps/admin/test/media-center-density-contract.test.mjs

      - name: Commit changes
        shell: bash
        run: |
          rm .github/workflows/agent-media-center-density.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten media center density"
          git push origin HEAD:ui/media-center-density
