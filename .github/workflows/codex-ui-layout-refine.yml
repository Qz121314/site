name: Codex UI layout refinement

on:
  push:
    branches: [codex/ui-layout-refine-20260815]

permissions:
  contents: write

concurrency:
  group: codex-site-ui-layout-refinement
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/ui-layout-refine-20260815
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node.js 22 or newer is required')"
          npm install --global pnpm@11.19.0

      - name: Apply layout refinement
        run: python .github/scripts/apply_ui_layout_refine.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: pnpm format:write

      - name: Verify project
        run: pnpm verify

      - name: Commit verified layout refinement
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-ui-layout-refine.yml .github/scripts/apply_ui_layout_refine.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'ui: align support admin layout and refine storefront desktop spacing'
          git push origin HEAD:codex/ui-layout-refine-20260815
