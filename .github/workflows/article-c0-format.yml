name: Article C0 Format

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format C0 files
        run: |
          pnpm exec prettier --write \
            apps/storefront/src/messages-articles.ts \
            apps/storefront/test/messages-articles.test.mjs \
            apps/worker/src/publishing/storefront-bootstrap-snapshot.ts \
            apps/worker/src/routes/admin-message-articles.ts \
            apps/worker/test/message-article-migration.test.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/storefront/src/messages-articles.ts \
            apps/storefront/test/messages-articles.test.mjs \
            apps/worker/src/publishing/storefront-bootstrap-snapshot.ts \
            apps/worker/src/routes/admin-message-articles.ts \
            apps/worker/test/message-article-migration.test.mjs
          git diff --cached --quiet || git commit -m "style: format Article C0 contract changes"
          git push origin HEAD:feat/message-article-background-media-contract
