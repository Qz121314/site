name: Repair CI checkout

on:
  push:
    branches:
      - fix/customer-service-worker-fetch
    paths:
      - .github/workflows/patch-ci-checkout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-service-worker-fetch

      - name: Replace unauthenticated checkout blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "      - name: Checkout\n        run: |\n          set -euo pipefail\n          git init .\n          git remote add origin \"https://github.com/${GITHUB_REPOSITORY}.git\"\n          git fetch --no-tags --depth=1 origin \"${GITHUB_REF}\"\n          git checkout --detach FETCH_HEAD\n"
          new = "      - name: Checkout\n        uses: actions/checkout@v4\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 checkout blocks, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit CI repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git commit -m 'fix: restore authenticated CI checkout'
          git push origin HEAD:fix/customer-service-worker-fetch
