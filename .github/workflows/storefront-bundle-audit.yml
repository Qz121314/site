name: Storefront Bundle Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js and pnpm
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node.js 22 or newer is required')"
          npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit storefront source references
        run: |
          set -euo pipefail
          for pattern in \
            "bottom-navigation" \
            "support-contract" \
            "loadSectionSnapshot" \
            "loadProductSnapshot" \
            "loadFaqSnapshot" \
            "rememberStorefrontProducts" \
            "loadCurrentPointer" \
            "resolveMediaBaseUrl" \
            "parseBottomNavigationItems"; do
            echo "=== REF: $pattern ==="
            rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!.git/**' "$pattern" . || true
          done

      - name: Audit storefront bundle graph
        working-directory: apps/storefront
        run: |
          cat > .bundle-audit.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { build, loadConfigFromFile, mergeConfig } from 'vite';

          const root = process.cwd();
          const configPath = path.join(root, 'vite.config.ts');
          const loaded = await loadConfigFromFile(
            { command: 'build', mode: 'production' },
            configPath,
          );
          if (!loaded) throw new Error('Unable to load storefront Vite config.');

          let chunks = [];
          const auditPlugin = {
            name: 'storefront-bundle-audit',
            generateBundle(_options, bundle) {
              chunks = Object.values(bundle)
                .filter((item) => item.type === 'chunk')
                .map((chunk) => ({
                  fileName: chunk.fileName,
                  isEntry: chunk.isEntry,
                  imports: chunk.imports,
                  dynamicImports: chunk.dynamicImports,
                  modules: Object.entries(chunk.modules).map(([id, info]) => ({
                    id: path.relative(root, id),
                    absoluteId: path.resolve(id),
                    renderedLength: info.renderedLength ?? 0,
                  })),
                }));
            },
          };

          await build(
            mergeConfig(loaded.config, {
              logLevel: 'warn',
              plugins: [auditPlugin],
              build: { write: false },
            }),
          );

          const entry = chunks.find((chunk) => chunk.isEntry);
          if (!entry) throw new Error('Storefront entry chunk not found.');

          const byName = new Map(chunks.map((chunk) => [chunk.fileName, chunk]));
          const initialNames = new Set();
          const queue = [entry.fileName];
          while (queue.length > 0) {
            const name = queue.shift();
            if (!name || initialNames.has(name)) continue;
            initialNames.add(name);
            const chunk = byName.get(name);
            for (const imported of chunk?.imports ?? []) queue.push(imported);
          }

          const initialModules = chunks
            .filter((chunk) => initialNames.has(chunk.fileName))
            .flatMap((chunk) =>
              chunk.modules.map((module) => ({ ...module, chunk: chunk.fileName })),
            )
            .sort((a, b) => b.renderedLength - a.renderedLength);

          console.log('=== INITIAL_CHUNKS ===');
          for (const name of initialNames) console.log(name);
          console.log('=== TOP_INITIAL_MODULES ===');
          for (const module of initialModules.slice(0, 60)) {
            console.log(`${module.renderedLength}\t${module.chunk}\t${module.id}`);
          }
          console.log('=== CHUNK_SUMMARY ===');
          for (const chunk of chunks
            .map((item) => ({
              ...item,
              renderedLength: item.modules.reduce(
                (sum, module) => sum + module.renderedLength,
                0,
              ),
            }))
            .sort((a, b) => b.renderedLength - a.renderedLength)) {
            console.log(
              `${chunk.renderedLength}\t${chunk.isEntry ? 'entry' : 'async'}\t${chunk.fileName}`,
            );
          }

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          const included = new Set(
            chunks.flatMap((chunk) => chunk.modules.map((module) => module.absoluteId)),
          );
          const sourceFiles = walk(path.join(root, 'src'))
            .filter((file) => /\.(?:ts|tsx)$/u.test(file))
            .map((file) => path.resolve(file));
          const unreachable = sourceFiles
            .filter((file) => !included.has(file))
            .map((file) => path.relative(root, file))
            .sort();

          console.log('=== PRODUCTION_UNREACHABLE_SOURCE ===');
          if (unreachable.length === 0) console.log('(none)');
          else for (const file of unreachable) console.log(file);
          EOF
          node .bundle-audit.mjs
          rm .bundle-audit.mjs
