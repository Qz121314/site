name: Temporary dashboard formatter

on:
  push:
    branches: [chore/remove-site-traffic-stats]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/remove-site-traffic-stats

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format dashboard
        run: pnpm exec prettier --write apps/admin/src/Dashboard.tsx

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/admin/src/Dashboard.tsx; then
            echo 'Dashboard already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin/src/Dashboard.tsx
          git commit -m 'style: format admin dashboard'
          git push origin HEAD:chore/remove-site-traffic-stats
