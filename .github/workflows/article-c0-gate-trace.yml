name: Article C0 Gate Trace

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-gate-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Trace modular publication
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/modular-publication.test.mjs

      - name: Trace public bootstrap runtime
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/public-bootstrap-runtime.test.mjs

      - name: Trace public content
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/public-content.test.mjs
