name: Article C0 Gate Trace

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-gate-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Trace dev preflight
        run: pnpm preflight:dev

      - name: Trace repository guardrails
        run: pnpm guardrails

      - name: Trace format
        run: pnpm format

      - name: Trace lint
        run: pnpm lint

      - name: Trace typecheck
        run: pnpm typecheck

      - name: Trace local migrations
        run: pnpm db:migrate:local

      - name: Trace full tests
        run: pnpm test

      - name: Trace build
        run: pnpm build

      - name: Trace Cloudflare dry run
        run: pnpm cf:check
