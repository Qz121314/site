name: Article C0 Gate Trace

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-gate-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Trace Worker legacy admin and routing tests
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/admin-auth.test.mjs \
            apps/worker/test/admin-crud-constraints.test.mjs \
            apps/worker/test/conversion-pool.test.mjs \
            apps/worker/test/customer-service-provider.test.mjs \
            apps/worker/test/home-layout.test.mjs \
            apps/worker/test/idempotency.test.mjs \
            apps/worker/test/pwa-icon-source-contract.test.mjs \
            apps/worker/test/security-headers.test.mjs \
            apps/worker/test/theme-import.test.mjs

      - name: Trace Worker publication and bootstrap tests
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/modular-publication.test.mjs \
            apps/worker/test/public-bootstrap-runtime.test.mjs \
            apps/worker/test/public-content.test.mjs

      - name: Trace Worker remaining public tests
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/public-conversion-route.test.mjs \
            apps/worker/test/public-media-fallback.test.mjs \
            apps/worker/test/public-search-index.test.mjs \
            apps/worker/test/public-seo.test.mjs \
            apps/worker/test/public-support-config.test.mjs

      - name: Reconfirm targeted Article C0 Worker tests
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/message-article-migration.test.mjs \
            apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-background-contract.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs \
            apps/worker/test/asset-cleanup-integration.test.mjs
