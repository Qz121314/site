name: Article C0 Gate Trace

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-gate-trace.yml

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align legacy modular bootstrap fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/test/modular-publication.test.mjs')
          text = path.read_text()
          old = """      articleId: 'article-a',\n      title: 'Announcement',\n      preview: 'Short preview',\n      sortOrder: 0,\n"""
          new = """      articleId: 'article-a',\n      title: 'Announcement',\n      preview: 'Short preview',\n      backgroundObjectKey: null,\n      sortOrder: 0,\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format repaired fixture
        run: pnpm exec prettier --write apps/worker/test/modular-publication.test.mjs

      - name: Re-run modular publication contract
        run: |
          node --test --experimental-strip-types \
            --import ./apps/worker/test/register-ts-resolver.mjs \
            apps/worker/test/modular-publication.test.mjs

      - name: Full repository verify
        run: pnpm verify

      - name: Commit verified fixture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/test/modular-publication.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test(worker): align bootstrap background metadata contract"
          git push origin HEAD:feat/message-article-background-media-contract
