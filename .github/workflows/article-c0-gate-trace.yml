name: Article C0 Gate Trace

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-gate-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix changed files
        run: pnpm fix:changed

      - name: Ensure fix gate is clean
        run: git diff --exit-code

      - name: Trace CI contract tests
        run: pnpm test:ci-contracts

      - name: Trace Admin tests
        run: pnpm --filter @site/admin test

      - name: Trace Storefront tests
        run: pnpm --filter @site/storefront test

      - name: Trace Worker tests
        run: pnpm --filter @site/worker test

      - name: Trace package tests
        run: pnpm --filter './packages/*' --if-present test
