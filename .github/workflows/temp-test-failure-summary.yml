name: Temp Test Failure Summary

on:
  push:
    branches:
      - agent/storefront-bootstrap-theme-pwa

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-bootstrap-theme-pwa
      - name: Set up Node and pnpm
        run: |
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Print only test failure context
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test-output.txt 2>&1
          status=$?
          set -e
          echo '--- FAILURE CONTEXT ---'
          grep -n -B 24 -A 60 -E 'not ok|AssertionError|ERR_ASSERTION|ERR_MODULE|failing tests|failureType|Expected values|actual:|expected:|✖|Failed' /tmp/test-output.txt || true
          echo '--- END FAILURE CONTEXT ---'
          exit "$status"
