name: Codex support docs sync

on:
  push:
    branches: [codex/support-docs-sync-20260815]

permissions:
  contents: write

concurrency:
  group: codex-site-support-docs-sync
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/support-docs-sync-20260815
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node.js 22 or newer is required')"
          npm install --global pnpm@11.19.0

      - name: Apply documentation sync
        run: python .github/scripts/apply_support_docs_sync.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm verify

      - name: Commit verified documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-support-docs-sync.yml .github/scripts/apply_support_docs_sync.py
          git add README.md docs/customer-service-integration.md
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'docs: sync customer service integration architecture'
          git push origin HEAD:codex/support-docs-sync-20260815
