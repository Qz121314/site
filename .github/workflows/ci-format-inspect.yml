name: CI Format Inspect

on:
  push:
    branches: [ci/single-runner-main-deploy]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier .github/workflows/ci.yml scripts/check-repository-guardrails.mjs --write
          git diff -- .github/workflows/ci.yml scripts/check-repository-guardrails.mjs || true
