name: CI Format Inspect

on:
  push:
    branches: [ci/single-runner-main-deploy]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          set -euo pipefail
          pnpm exec prettier .github/workflows/ci.yml scripts/check-repository-guardrails.mjs --write
          if git diff --quiet -- .github/workflows/ci.yml scripts/check-repository-guardrails.mjs; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml scripts/check-repository-guardrails.mjs
          git commit -m 'chore: apply repository formatting'
          git push origin HEAD:ci/single-runner-main-deploy
