name: Article C0 Test Contract

on:
  push:
    branches:
      - feat/message-article-background-media-contract
    paths:
      - .github/workflows/article-c0-test-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Article C0 test contract
        run: |
          sed -i "s/test('faq module status becomes dirty when Message Article placement changes'/test('Article content and Messages placement both make the shared faq publication module dirty'/" scripts/article-c0-test-contract.py
          python scripts/article-c0-test-contract.py

      - name: Commit tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/test/article-message-contract.test.mjs \
            apps/worker/test/message-article-migration.test.mjs \
            apps/worker/test/public-bootstrap-snapshot.test.mjs \
            apps/storefront/test/messages-articles.test.mjs
          git commit -m "test(content): define message article background media contract"
          git push origin HEAD:feat/message-article-background-media-contract
