name: Article C1 Phase Gate Corrections

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.number == 451 && github.head_ref == 'feat/article-center-admin-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/article-center-admin-ui
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Article C1 corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              target.write_text(text.replace(old, new, 1))

          view = 'apps/admin/src/ArticleCenterView.tsx'
          replace_once(
              view,
              "import { DeleteArticleDialog } from './article-center/DeleteArticleDialog';\nimport {\n",
              "import { DeleteArticleDialog } from './article-center/DeleteArticleDialog';\nimport {\n  moveAndNormalizeArticleOrder,\n  sortArticlesByDefault,\n} from './article-center/article-order';\nimport {\n",
          )
          replace_once(
              view,
              "import {\n  AdminSegmentedControl,\n  AdminSegmentedItem,\n} from './components/ui/segmented-control';\n",
              "import {\n  AdminSegmentedControl,\n  AdminSegmentedItem,\n} from './components/ui/segmented-control';\nimport { Select } from './components/ui/select';\n",
          )
          replace_once(
              view,
              "function sortByDefault(articles: AdminArticle[]): AdminArticle[] {\n  return [...articles].sort(\n    (left, right) =>\n      left.sortOrder - right.sortOrder ||\n      right.updatedAt.localeCompare(left.updatedAt) ||\n      left.title.localeCompare(right.title, 'zh-CN'),\n  );\n}\n\n",
              "",
          )
          replace_once(view, 'return sortByDefault(filtered);', 'return sortArticlesByDefault(filtered);')
          replace_once(
              view,
              "  async function moveArticle(article: AdminArticle, direction: -1 | 1) {\n    if (reorderDisabled) return;\n    const ordered = sortByDefault(activeArticles).map((item) => ({ ...item }));\n    const currentIndex = ordered.findIndex((item) => item.id === article.id);\n    const targetIndex = currentIndex + direction;\n    const current = ordered[currentIndex];\n    const target = ordered[targetIndex];\n    if (!current || !target) return;\n\n    const currentOrder = current.sortOrder;\n    current.sortOrder = target.sortOrder;\n    target.sortOrder = currentOrder;\n\n    setWorking(true);\n    clearMessages();\n    try {\n      await reorderArticles([\n        { id: current.id, sortOrder: current.sortOrder },\n        { id: target.id, sortOrder: target.sortOrder },\n      ]);\n      setActiveArticles(ordered);\n      setSuccessMessage('文章顺序已更新。');\n    } catch (error) {\n      handleError(error);\n      await loadScope('active');\n    } finally {\n      setWorking(false);\n    }\n  }\n",
              "  async function moveArticle(article: AdminArticle, direction: -1 | 1) {\n    if (reorderDisabled) return;\n    const normalizedOrder = moveAndNormalizeArticleOrder(\n      activeArticles,\n      article.id,\n      direction,\n    );\n    if (!normalizedOrder) return;\n\n    setWorking(true);\n    clearMessages();\n    try {\n      await reorderArticles(\n        normalizedOrder.map(({ id, sortOrder }) => ({ id, sortOrder })),\n      );\n      setActiveArticles(normalizedOrder);\n      setSuccessMessage('文章顺序已更新。');\n    } catch (error) {\n      handleError(error);\n      await loadScope('active');\n    } finally {\n      setWorking(false);\n    }\n  }\n",
          )
          replace_once(
              view,
              "          <select\n            className=\"ui-input\"\n            value={sortMode}\n            onChange={(event) =>\n              updateSortMode(event.target.value as ArticleSortMode)\n            }\n          >\n            <option value=\"default\">默认顺序</option>\n            <option value=\"title\">标题</option>\n            <option value=\"updated\">更新时间</option>\n          </select>\n",
              "          <Select\n            value={sortMode}\n            onChange={(event) =>\n              updateSortMode(event.target.value as ArticleSortMode)\n            }\n          >\n            <option value=\"default\">默认顺序</option>\n            <option value=\"title\">标题</option>\n            <option value=\"updated\">更新时间</option>\n          </Select>\n",
          )

          replace_once(
              'apps/admin/src/article-center/DeleteArticleDialog.tsx',
              '删除后文章进入回收站；现有 backend 删除语义保持不变。',
              '删除后文章会进入回收站，可稍后恢复。',
          )

          Path('apps/admin/src/components/ui/select.tsx').write_text("""import type { SelectHTMLAttributes } from 'react';
          import { cn } from '../../lib/cn';

          type SelectProps = SelectHTMLAttributes<HTMLSelectElement>;

          export function Select({ className, ...props }: SelectProps) {
            return <select className={cn('ui-input', className)} {...props} />;
          }
          """)

          Path('apps/admin/src/article-center/article-order.ts').write_text("""import type { AdminArticle } from './api';

          export function sortArticlesByDefault(
            articles: readonly AdminArticle[],
          ): AdminArticle[] {
            return [...articles].sort(
              (left, right) =>
                left.sortOrder - right.sortOrder ||
                right.updatedAt.localeCompare(left.updatedAt) ||
                left.title.localeCompare(right.title, 'zh-CN'),
            );
          }

          export function moveAndNormalizeArticleOrder(
            articles: readonly AdminArticle[],
            articleId: string,
            direction: -1 | 1,
          ): AdminArticle[] | null {
            const ordered = sortArticlesByDefault(articles);
            const currentIndex = ordered.findIndex((article) => article.id === articleId);
            const targetIndex = currentIndex + direction;
            if (currentIndex < 0 || targetIndex < 0 || targetIndex >= ordered.length) {
              return null;
            }

            const [moved] = ordered.splice(currentIndex, 1);
            if (!moved) return null;
            ordered.splice(targetIndex, 0, moved);

            return ordered.map((article, index) => ({
              ...article,
              sortOrder: index * 10,
            }));
          }
          """)

          Path('apps/admin/test/article-c1-phase-gate-corrections.test.mjs').write_text("""import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';
          import { moveAndNormalizeArticleOrder } from '../src/article-center/article-order.ts';

          async function source(relativePath) {
            return readFile(new URL(relativePath, import.meta.url), 'utf8');
          }

          function article(id, sortOrder, updatedAt) {
            return {
              id,
              title: id,
              body: '',
              sortOrder,
              isActive: true,
              createdAt: '2026-09-07T00:00:00Z',
              updatedAt,
              deletedAt: null,
            };
          }

          test('Article reorder normalizes duplicate sortOrder values after a move', () => {
            const original = [
              article('first', 10, '2026-09-07T03:00:00Z'),
              article('second', 10, '2026-09-07T02:00:00Z'),
              article('third', 20, '2026-09-07T01:00:00Z'),
            ];

            const reordered = moveAndNormalizeArticleOrder(original, 'second', -1);

            assert.ok(reordered);
            assert.deepEqual(
              reordered.map(({ id, sortOrder }) => ({ id, sortOrder })),
              [
                { id: 'second', sortOrder: 0 },
                { id: 'first', sortOrder: 10 },
                { id: 'third', sortOrder: 20 },
              ],
            );
            assert.deepEqual(
              original.map(({ id, sortOrder }) => ({ id, sortOrder })),
              [
                { id: 'first', sortOrder: 10 },
                { id: 'second', sortOrder: 10 },
                { id: 'third', sortOrder: 20 },
              ],
            );
          });

          test('Article reorder submits the complete normalized order in one request', async () => {
            const view = await source('../src/ArticleCenterView.tsx');

            assert.match(view, /moveAndNormalizeArticleOrder/);
            assert.match(view, /await reorderArticles\(\s*normalizedOrder\.map/);
            assert.doesNotMatch(view, /await reorderArticles\(\[/);
          });

          test('Article sort control is owned by the shared Select primitive', async () => {
            const view = await source('../src/ArticleCenterView.tsx');
            const select = await source('../src/components/ui/select.tsx');

            assert.match(view, /from '.\/components\/ui\/select'/);
            assert.match(view, /<Select/);
            assert.doesNotMatch(view, /<select/);
            assert.match(select, /SelectHTMLAttributes<HTMLSelectElement>/);
            assert.match(select, /cn\('ui-input', className\)/);
          });

          test('Article delete dialog uses operator-facing recovery copy', async () => {
            const deletion = await source('../src/article-center/DeleteArticleDialog.tsx');

            assert.match(deletion, /删除后文章会进入回收站，可稍后恢复。/);
            assert.doesNotMatch(deletion, /backend 删除语义/);
          });
          """)
          PY

      - name: Format changed PR surface with repository tooling
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ORIGINAL_HEAD=$(git rev-parse HEAD)
          echo "$ORIGINAL_HEAD" > /tmp/c1-original-head
          git reset --mixed "$BASE_SHA"
          pnpm fix:changed
          pnpm format
          git reset --mixed "$ORIGINAL_HEAD"

      - name: Run targeted Article and Admin tests
        run: pnpm --filter @site/admin test

      - name: Run canonical repository verification
        run: pnpm verify

      - name: Commit validated corrections and remove temporary gate
        run: |
          rm .github/workflows/c1-phase-gate-corrections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(admin): close Article C1 phase gate corrections"
          git push origin HEAD:feat/article-center-admin-ui
