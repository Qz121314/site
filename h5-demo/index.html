<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H5 页面测试</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f7fb;
        color: #102a43;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .page {
        max-width: 430px;
        min-height: 100vh;
        margin: 0 auto;
        background: #fff;
        overflow: hidden;
      }
      .hero {
        padding: 48px 28px 42px;
        color: #fff;
        background: linear-gradient(145deg, #125b9a, #1aa58a);
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 13px;
        letter-spacing: 0.12em;
        opacity: 0.8;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.15;
        letter-spacing: -0.04em;
      }
      .hero p {
        margin: 18px 0 0;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.85);
      }
      .content {
        padding: 28px;
      }
      .card {
        padding: 22px;
        border: 1px solid #e1eaf2;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(16, 42, 67, 0.08);
      }
      .card h2 {
        margin: 0;
        font-size: 20px;
      }
      .card p {
        margin: 10px 0 0;
        color: #627d98;
        line-height: 1.7;
      }
      .actions {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 11px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        color: #fff;
        background: #1261a0;
      }
      .secondary {
        color: #1261a0;
        background: #e8f4f5;
      }
      .note {
        margin: 22px 0 0;
        color: #829ab1;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">H5 DEMO PAGE</p>
        <h1>CTA 转化测试页面</h1>
        <p>这是一个用于测试页面中心 CTA 识别、行动号召修改和转化池绑定的示例页面。</p>
      </section>
      <section class="content">
        <div class="card">
          <h2>准备好开始了吗？</h2>
          <p>
            上传后，页面中心会自动识别下面两个按钮，并允许你修改按钮文案和绑定转化池。
          </p>
          <div class="actions">
            <button class="primary" type="button" data-site-cta="consult">
              立即咨询
            </button>
            <button class="secondary" type="button" data-site-cta="offer">
              领取优惠
            </button>
          </div>
        </div>
        <p class="note">页面中心测试样例 · 不包含本地素材上传</p>
      </section>
    </main>
  </body>
</html>
